# Values for the upstream opentelemetry-collector chart (versions.sh), release
# "agent": the Collector DaemonSet that collects PostgreSQL in pods (the
# postgresql pack's sql_query and the receiver's own metrics), kubelet metrics
# and container logs, on every node that runs PostgreSQL pods. It works for any
# PostgreSQL pod you can select with a label rule (a StatefulSet, an operator's
# pods). What is specific to CloudNativePG (its instance-manager metrics and its
# JSON logs) is in cnpg-values.yaml, a second -f file after this one. Derived
# from lab/k8s/otel/agent-values.yaml; the lab placeholders became the variables
# below, filled by envsubst (docs/guides/monitor/kubernetes.md), and the lab
# shortcuts are gone or marked. ${env:...} is the Collector's own syntax and stays.
#   OBENHUB_GATEWAY_ENDPOINT    OTLP/HTTP base URL of the gateway, no path (https://...)
#   OBENHUB_SERVICE_NAMESPACE   service.namespace of every series (inventory.yml, compose)
#   OBENHUB_CLUSTER_NAME        obenhub.cluster.name of the PostgreSQL pods this release watches
#   OBENHUB_PG_POD_RULE         receiver_creator expression over the pod, without the leading
#                               `type == "pod" &&`, e.g. labels["app"] == "pgdemo" (the endpoint
#                               types and fields are in the receivercreator README); keep it free of
#                               single quotes, the value goes inside single quotes
#   OBENHUB_PG_DATABASES        YAML list of databases the receiver connects to, e.g. [postgres, app]
#   OBENHUB_PG_SLOW_DATABASE    the one database the 5 m slow tier reads (packs/postgresql/README.md, "Slow tier"), e.g. app
#   OBENHUB_PG_SSLMODE          verify-ca (the server has a certificate and obenhub-pg-ca holds its CA) or
#                               disable (a server without TLS)
#   OBENHUB_PG_TLS_INSECURE     false with verify-ca; true with disable (the postgresql receiver then does
#                               not use TLS either). With false, the receiver uses TLS without verifying
#                               the server certificate, see the comment at its tls block
#   OBENHUB_KUBELET_SKIP_VERIFY true when the kubelet's serving certificate is self-signed (kind, kubeadm
#                               without serverTLSBootstrap), else false
#   OBENHUB_OTEL_NAMESPACE      namespace the release is installed into (helm -n); the agent's own
#                               logs are excluded by it, or it would collect its own output in a loop
#   OTELCOL_IMAGE_REPOSITORY, OTELCOL_IMAGE_TAG, OTELCOL_IMAGE_DIGEST   from OTELCOL_IMAGE in versions.sh
# Kubernetes objects it expects in the release namespace (the guide creates them):
#   secret obenhub-gateway-tls  ca.crt, tls.crt, tls.key: the gateway CA and a client certificate
#   secret pg-otel-monitor      key password: the monitoring role's password
#   configmap obenhub-pack-postgresql   packs/postgresql/queries.yaml and queries-slow.yaml
#   configmap obenhub-pg-ca             ca.crt: the CA that signed the PostgreSQL server certificates
#                                       (optional: not needed with OBENHUB_PG_SSLMODE=disable)
# Preset behaviour: chart templates/_config.tpl read at chart 0.178.3 (runs on 0.180.0). Component
# keys: receivers kubeletstats, receiver_creator, postgresql, sql_query, file_log
# and processors k8s_attributes in contrib v0.164.0; the chart renames filelog and
# k8sattributes to those names itself.
mode: daemonset
fullnameOverride: otelcol-agent

image:
  repository: ${OTELCOL_IMAGE_REPOSITORY}
  tag: ${OTELCOL_IMAGE_TAG}
  digest: ${OTELCOL_IMAGE_DIGEST}
command:
  name: otelcol-contrib

presets:
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: true
  logsCollection:
    enabled: true
    # keep file offsets across restarts (hostPath /var/lib/otelcol)
    storeCheckpoints: true

# The container logs under /var/log/pods are root-readable on the nodes. The
# agent runs as root to read them; if your nodes allow a log-reading group,
# prefer that and drop these two lines (assumption: not tested here).
securityContext:
  runAsUser: 0
  runAsGroup: 0

# Receive nothing: the chart opens hostPorts for these by default.
ports:
  otlp: {enabled: false}
  otlp-http: {enabled: false}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}

# The ConfigMaps and Secrets do not restart pods by themselves: after changing
# one, run `kubectl rollout restart daemonset/otelcol-agent-agent`.

extraEnvs:
  - name: OBENHUB_GATEWAY_ENDPOINT
    value: "${OBENHUB_GATEWAY_ENDPOINT}"
  - name: OTEL_MONITOR_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pg-otel-monitor
        key: password
extraVolumes:
  - name: gateway-tls
    secret:
      secretName: obenhub-gateway-tls
  - name: pack-postgresql
    configMap:
      name: obenhub-pack-postgresql
  - name: pg-ca
    configMap:
      name: obenhub-pg-ca
      optional: true
extraVolumeMounts:
  - {name: gateway-tls, mountPath: /etc/obenhub/tls, readOnly: true}
  - {name: pack-postgresql, mountPath: /etc/obenhub/packs/postgresql, readOnly: true}
  - {name: pg-ca, mountPath: /etc/obenhub/pg-ca, readOnly: true}

telemetry:
  resourceAttributes:
    extra:
      service.namespace: ${OBENHUB_SERVICE_NAMESPACE}
      service.name: otelcol
      # named by the node, like the Collectors of lab/pgha by theirs
      service.instance.id: otelcol-agent-${env:OTEL_K8S_NODE_NAME}

config:
  extensions:
    k8s_observer:
      auth_type: serviceAccount
      # only the pods on this node: every agent scrapes its own node
      node: ${env:K8S_NODE_NAME}
      observe_pods: true
  receivers:
    jaeger: null
    otlp: null
    prometheus: null
    zipkin: null
    kubeletstats:
      insecure_skip_verify: ${OBENHUB_KUBELET_SKIP_VERIFY}
    # The container logs of the pods; the Collectors' own are excluded (the
    # chart README warns about the log loop). Lines stay the container's own
    # text, with the pod's Kubernetes attributes (k8s_attributes).
    file_log:
      exclude:
        - /var/log/pods/${OBENHUB_OTEL_NAMESPACE}_*/opentelemetry-collector/*.log
      operators:
        - type: container
          id: container-parser
          max_log_size: 102400
    # The PostgreSQL pack against every pod on this node that matches
    # OBENHUB_PG_POD_RULE, as lab/pgha/files/otelcol.yaml.tmpl instantiates it;
    # the receivers are created per pod endpoint, so there is one set per pod and
    # none per role. `endpoint` is the pod IP. A server certificate usually names
    # a Service (CloudNativePG: pg-rw, pg-r, pg-ro), never a pod, so the
    # hostname cannot be verified: sql_query verifies the chain against the CA
    # (sslmode verify-ca), postgresql supports only verify-full or no
    # verification and uses TLS without verifying (sslmode require). With
    # OBENHUB_PG_SSLMODE=disable neither uses TLS.
    receiver_creator/postgresql:
      watch_observers: [k8s_observer]
      receivers:
        postgresql:
          rule: 'type == "pod" && (${OBENHUB_PG_POD_RULE})'
          config:
            endpoint: '`endpoint`:5432'
            transport: tcp
            username: otel_monitor
            password: ${env:OTEL_MONITOR_PASSWORD}
            # OBENHUB_PG_DATABASES: a YAML list of the databases to connect to, for
            # example [postgres, app] (postgres holds the administrative objects).
            # The receiver connects to each listed database.
            databases: ${OBENHUB_PG_DATABASES}
            collection_interval: 15s
            metrics:
              postgresql.deadlocks:
                enabled: true
            tls:
              insecure: ${OBENHUB_PG_TLS_INSECURE}
              # The pod address is usually not in the server certificate, so it
              # cannot be verified (the receiver supports only verify-full or no
              # verification; with insecure false it still uses TLS). Remove this
              # line if your certificates name the pods.
              insecure_skip_verify: true
        sql_query:
          rule: 'type == "pod" && (${OBENHUB_PG_POD_RULE})'
          config:
            driver: postgres
            host: '`endpoint`'
            port: 5432
            database: postgres
            username: otel_monitor
            password: ${env:OTEL_MONITOR_PASSWORD}
            additional_params:
              sslmode: ${OBENHUB_PG_SSLMODE}
              sslrootcert: /etc/obenhub/pg-ca/ca.crt
            max_open_conn: 3
            collection_interval: 15s
            timeout: 10s
            queries: ${file:/etc/obenhub/packs/postgresql/queries.yaml}
        # Slow tier (packs/postgresql/queries-slow.yaml): one database per instance
        sql_query/slow:
          rule: 'type == "pod" && (${OBENHUB_PG_POD_RULE})'
          config:
            driver: postgres
            host: '`endpoint`'
            port: 5432
            database: ${OBENHUB_PG_SLOW_DATABASE}
            username: otel_monitor
            password: ${env:OTEL_MONITOR_PASSWORD}
            additional_params:
              sslmode: ${OBENHUB_PG_SSLMODE}
              sslrootcert: /etc/obenhub/pg-ca/ca.crt
            max_open_conn: 1
            collection_interval: 5m
            timeout: 60s
            queries: ${file:/etc/obenhub/packs/postgresql/queries-slow.yaml}
  processors:
    # Same attribute names as lab/pgha/files/otelcol.yaml.tmpl; the instance is
    # the pod (k8s.pod.name is set by receiver_creator), never a role.
    resource/postgresql:
      attributes:
        - {key: service.namespace, value: "${OBENHUB_SERVICE_NAMESPACE}", action: upsert}
        - {key: service.name, value: postgresql, action: upsert}
        - {key: service.instance.id, from_attribute: k8s.pod.name, action: upsert}
        - {key: server.address, from_attribute: k8s.pod.name, action: upsert}
        - {key: server.port, value: '5432', action: upsert}
        - {key: db.system.name, value: postgresql, action: upsert}
        - {key: obenhub.cluster.name, value: "${OBENHUB_CLUSTER_NAME}", action: upsert}
  exporters:
    debug: null
    otlp_http/gateway:
      endpoint: ${env:OBENHUB_GATEWAY_ENDPOINT}
      tls:
        ca_file: /etc/obenhub/tls/ca.crt
        cert_file: /etc/obenhub/tls/tls.crt
        key_file: /etc/obenhub/tls/tls.key
  service:
    extensions: [health_check, k8s_observer]
    telemetry:
      metrics:
        level: normal
        readers:
          - periodic:
              interval: 15000
              exporter:
                otlp:
                  protocol: http/protobuf
                  endpoint: ${env:OBENHUB_GATEWAY_ENDPOINT}/v1/metrics
                  certificate: /etc/obenhub/tls/ca.crt
                  client_certificate: /etc/obenhub/tls/tls.crt
                  client_key: /etc/obenhub/tls/tls.key
    pipelines:
      traces: null
      # receivers: kubeletstats is added by the preset
      metrics:
        receivers: []
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [otlp_http/gateway]
      metrics/postgresql:
        receivers: [receiver_creator/postgresql]
        processors: [memory_limiter, k8s_attributes, resource/postgresql, batch]
        exporters: [otlp_http/gateway]
      # receivers: file_log is added by the preset
      logs:
        receivers: []
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [otlp_http/gateway]
