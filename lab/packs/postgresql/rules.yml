# PostgreSQL pack rules, used by lab/slice1 and lab/stage3 (both mount this
# file into vmalert next to their own rules). Each lab defines the recorded
# series obenhub.expected_collector (one per Collector) and obenhub.expected_target
# (with an obenhub.collector label naming the Collector that collects it) in its
# own inventory group; PostgresTargetAbsent reads the service.name="postgresql"
# entries, CollectorAbsent the Collectors. Names follow the naming
# contract (ADR 0006).
# Gating: standby-only rules join on recovery.active == 1, so a primary never
# matches and missing data never fires.
groups:
  - name: postgresql
    interval: 15s
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: Always firing; proves the alert pipeline works.

      - alert: PostgresTargetAbsent
        expr: |
          obenhub.expected_target{service.name="postgresql"}
            unless on(service.instance.id)
          present_over_time(postgresql.collection.heartbeat[2m])
            and on(obenhub.collector)
          label_replace(present_over_time(otelcol_process_uptime[1m]), "obenhub.collector", "$1", "service.instance.id", "(.+)")
        # The heartbeat of a PostgreSQL target is postgresql.collection.heartbeat.
        # A target is absent only while the Collector that collects it is alive
        # (obenhub.collector, matched to the Collector's self-metrics
        # service.instance.id): the 1m window empties before the 2m one, so a
        # stopped Collector raises only its own CollectorAbsent. The Alertmanager inhibit alone lost the race in the
        # lab (2026-11-06, collector-stopped): vmalert's startsAt is older than
        # group_wait, so Alertmanager sends at once, in whatever order.
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'No heartbeat from {{ (index $labels "service.instance.id") }}'

      - alert: CollectorAbsent
        # Per Collector: an expected Collector with no self-metrics for 2m. A
        # Collector that sends through another one (obenhub.upstream) is left
        # out while that upstream is itself absent: the upstream's 1m window
        # empties before the 2m one, so a stopped gateway raises only its own
        # alert, not one per Collector behind it.
        expr: |
          (
            obenhub.expected_collector
              unless on(service.instance.id)
            present_over_time(otelcol_process_uptime[2m])
          )
            unless on(obenhub.upstream)
          label_replace(
            obenhub.expected_collector
              unless on(service.instance.id)
            present_over_time(otelcol_process_uptime[1m]),
            "obenhub.upstream", "$1", "service.instance.id", "(.+)")
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Collector {{ (index $labels "service.instance.id") }} reports no self-metrics'

      # An inventory entry whose obenhub.collector names no expected Collector
      # (a typo, or the label missing) would silently switch off that target's
      # absent alerts, because their gate matches on it. A missing label
      # matches nothing on the right, so it fires too. The for: 1m rides out
      # the start-up order of the inventory groups.
      - alert: CollectorUnknown
        expr: |
          (obenhub.expected_target or obenhub.expected_scrape)
            unless on(obenhub.collector)
          label_replace(obenhub.expected_collector, "obenhub.collector", "$1", "service.instance.id", "(.+)")
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Inventory entry {{ (index $labels "service.name") }} {{ (index $labels "service.instance.id") }} names an unknown Collector ("{{ (index $labels "obenhub.collector") }}")'

      - alert: PostgresStandbyNotStreaming
        # Not while no PostgreSQL in the lab is writable: then every node is in
        # recovery and none can stream; a cluster manager's own alert says that
        # (stage 3: PatroniNoWritablePrimary). The guard is lab-wide, not per
        # cluster: in slice1 the subscriber is always writable, so there it
        # never silences. "A node is writable" is read from the pack
        # (recovery.active == 0), so the two sources stay independent.
        # The join includes k8s.pod.uid: on Kubernetes a deleted pod's last
        # sample (streaming 0, as on any primary) stays visible for the
        # staleness lookback and would otherwise match the recreated pod of the
        # same name in recovery (lab/k8s primary-deleted, run 2026-11-11).
        # Where the label is absent on both sides (VM and Compose labs) the
        # join is unchanged.
        expr: |
          postgresql.wal_receiver.streaming == 0
            and on(service.instance.id, k8s.pod.uid)
          postgresql.recovery.active == 1
            and on()
          count(postgresql.recovery.active == 0) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} is in recovery and not streaming'

      - alert: PostgresReplayBacklog
        expr: |
          postgresql.replay.backlog > 16 * 1024 * 1024
            and on(service.instance.id)
          postgresql.recovery.active == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} replay backlog is {{ $value | humanize1024 }}B'

      - alert: PostgresSnapshotHeldTooLong
        expr: postgresql.snapshot.oldest_age > 120
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'A snapshot on {{ (index $labels "service.instance.id") }} is {{ $value | humanizeDuration }} old (lab threshold)'

      # Two tiers share one alertname and differ in severity, with no `for` and so
      # no pending state: the old `for` became a window inside the expression.
      # x = min_over_time(value[W':15s]) is the lowest value over the last W',
      # where W' = the time a tier used to need before firing (its old `for`)
      # plus one 15s step: a subquery window (t-W', t] holds W'/15s points
      # (the left edge is excluded, found with vmalert-tool v1.155.0), while
      # `for` needed one sample more than its length / 15s. Critical is x above
      # the critical threshold; warning is x above the warning threshold unless
      # the critical holds. At every evaluation exactly one tier is up while the
      # value stays above the warning threshold for W': when escalating,
      # de-escalating and across a single dip (a dip below the critical
      # threshold shows the warning for W', then the critical returns). A value
      # that jumps from below the warning threshold to above the critical one
      # never shows the warning, because both windows fill at the same
      # evaluation.
      # Warm-up: both tiers also require n = count_over_time(value[W':15s]) to
      # equal a full window (W'/15s points), as the old `for` required a full run
      # of evaluations. A new series, or one returning after a gap longer than
      # the lookback, therefore stays silent until its window is full. Points
      # bridged by the lookback after a missed scrape still count, so a single
      # lost sample does not restart the warm-up.
      # Suppression lives in the expressions, not in Alertmanager inhibit rules
      # (see lab/slice1/alertmanager). $value in the summaries is the lowest
      # value of the window, not the latest one.
      # PostgresConnectionSaturation, old for 1m, W' = 75s (5 points): critical at a ratio
      # of 0.95 or more, warning above 0.85 and below 0.95.
      - alert: PostgresConnectionSaturation
        expr: |
          WITH (
            r = postgresql.client_connection.count
              / on(service.instance.id)
            postgresql.client_connection.limit,
            x = min_over_time(r[75s:15s]),
            n = count_over_time(r[75s:15s])
          )
          ((x > 0.85) unless (x >= 0.95)) and (n >= 5)
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} client connections above 85% of capacity'

      - alert: PostgresConnectionSaturation
        expr: |
          WITH (
            r = postgresql.client_connection.count
              / on(service.instance.id)
            postgresql.client_connection.limit,
            x = min_over_time(r[75s:15s]),
            n = count_over_time(r[75s:15s])
          )
          (x >= 0.95) and (n >= 5)
        labels:
          severity: critical
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} client connections at or above 95% of capacity'

      # Wraparound: age as a fraction of 2^31 (2147483648), the point where
      # PostgreSQL stops accepting commands. 50 % and 75 % are pgMonitor's
      # "percent towards wraparound" thresholds as recorded in the private
      # dbsight survey (pgMonitor at 862ff68, crunchy-alert-rules-pg.yml.example
      # L320-L359); that file was not re-read here, so the numbers are an
      # unconfirmed assumption. `kind` tells transaction ids from multixact ids;
      # postgresql.database.name comes from the pack. Primary only: a physical standby repeats the
      # primary's datfrozenxid, so it would alert twice. Not reachable in a lab
      # run (it takes about a billion transactions): unit tests only, the metric
      # itself is present in both labs. Tiers as described above, old for 5m, W' = 315s (21 points):
      # critical above 0.75, warning above 0.5 up to and including 0.75.
      - alert: PostgresTransactionIdWraparound
        expr: |
          WITH (
            f = label_set(postgresql.database.xid_age / 2147483648, "kind", "xid")
              or
            label_set(postgresql.database.mxid_age / 2147483648, "kind", "mxid"),
            x = min_over_time(f[315s:15s]),
            n = count_over_time(f[315s:15s])
          )
          (((x > 0.5) unless (x > 0.75)) and (n >= 21))
            and on(service.instance.id)
          postgresql.recovery.active == 0
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.kind }} age of {{ (index $labels "postgresql.database.name") }} on {{ (index $labels "service.instance.id") }} is {{ $value | humanizePercentage }} of the wraparound limit'

      - alert: PostgresTransactionIdWraparound
        expr: |
          WITH (
            f = label_set(postgresql.database.xid_age / 2147483648, "kind", "xid")
              or
            label_set(postgresql.database.mxid_age / 2147483648, "kind", "mxid"),
            x = min_over_time(f[315s:15s]),
            n = count_over_time(f[315s:15s])
          )
          ((x > 0.75) and (n >= 21))
            and on(service.instance.id)
          postgresql.recovery.active == 0
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.kind }} age of {{ (index $labels "postgresql.database.name") }} on {{ (index $labels "service.instance.id") }} is {{ $value | humanizePercentage }} of the wraparound limit'

      # Idle in a transaction is a session that stopped talking, not a long
      # statement: postgresql.transaction.idle_age counts from the moment it
      # went idle. PostgresSnapshotHeldTooLong is the other half (the xmin horizon,
      # held by a running query as well). Thresholds are lab thresholds, scaled
      # down from pgMonitor's 300 s and 900 s (same survey, L199-L216,
      # unconfirmed here). Tiers as described above, old for 30s, W' = 45s (3 points): critical above 180 s,
      # warning above 60 s up to and including 180 s.
      - alert: PostgresIdleInTransaction
        expr: |
          WITH (
            x = min_over_time(postgresql.transaction.idle_age[45s:15s]),
            n = count_over_time(postgresql.transaction.idle_age[45s:15s])
          )
          ((x > 60) unless (x > 180)) and (n >= 3)
        labels:
          severity: warning
        annotations:
          summary: 'A session on {{ (index $labels "service.instance.id") }} has been idle in a transaction for {{ $value | humanizeDuration }} (lab threshold)'

      - alert: PostgresIdleInTransaction
        expr: |
          WITH (
            x = min_over_time(postgresql.transaction.idle_age[45s:15s]),
            n = count_over_time(postgresql.transaction.idle_age[45s:15s])
          )
          (x > 180) and (n >= 3)
        labels:
          severity: critical
        annotations:
          summary: 'A session on {{ (index $labels "service.instance.id") }} has been idle in a transaction for {{ $value | humanizeDuration }} (lab threshold)'

      # The oldest lock wait. Lab threshold; one tier, because a wait is a
      # symptom whose cause (the blocker) the pack does not name.
      - alert: PostgresBlockedSessions
        expr: postgresql.lock.oldest_wait_age > 30
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'A session on {{ (index $labels "service.instance.id") }} has waited {{ $value | humanizeDuration }} for a lock (lab threshold)'

      # postgresql.deadlocks is postgresqlreceiver's optional metric (enabled in
      # both labs' Collector configs) and only covers the databases listed in
      # the receiver's `databases`. last minus first sample in the window, not
      # increase or delta: MetricsQL counts a counter that is new in the window
      # from zero, so a Collector restart would read the lifetime total as fresh
      # deadlocks (seen in a unit test with a flat counter, 2026-11-08, for
      # increase, increase_pure and delta). A reset to zero reads as negative
      # and does not fire; the accepted trade-off is that a reset followed by a
      # rise back above the first sample within the window can hide deadlocks.
      # Any deadlock in the last 5 minutes fires: PostgreSQL
      # resolves it by aborting one session, so this is evidence, not a page.
      - alert: PostgresDeadlocks
        expr: last_over_time(postgresql.deadlocks[5m]) - first_over_time(postgresql.deadlocks[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | printf "%.0f" }} deadlock(s) in {{ (index $labels "postgresql.database.name") }} on {{ (index $labels "service.instance.id") }} in the last 5 minutes'

      # Requested checkpoints (pg_stat_checkpointer.num_requested on
      # PostgreSQL 17+, read by postgresqlreceiver as
      # postgresql.bgwriter.checkpoint.count{type="requested"}): WAL reached
      # max_wal_size before checkpoint_timeout. Requested checkpoints also come
      # from CHECKPOINT, CREATE DATABASE, base backups, promotion and
      # shutdown, so one or two per 5 minutes are normal; the lab threshold of more
      # than 3 per 5 minutes is an assumption checked against the default-config
      # labs (a handful of requested checkpoints per day) and the
      # checkpoint-pressure scenario. The 5 minute window keeps the resolve
      # time inside the scenario's 10 minute limit.
      # Last minus first sample, for the reason given at PostgresDeadlocks.
      # Primary only: a standby counts restartpoints.
      - alert: PostgresCheckpointsRequested
        expr: |
          (
            last_over_time(postgresql.bgwriter.checkpoint.count{type="requested"}[5m])
              - first_over_time(postgresql.bgwriter.checkpoint.count{type="requested"}[5m])
          ) > 3
            and on(service.instance.id)
          postgresql.recovery.active == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} had {{ $value | printf "%.0f" }} requested checkpoints in 5 minutes (lab threshold)'

      # A physical slot without a consumer keeps WAL until
      # max_slot_wal_keep_size. Primary only: Patroni keeps member slots on
      # replicas too, and those are inactive by design. Lab threshold. An
      # invalidated slot retains no WAL and has its own alert
      # (PostgresReplicationSlotInvalidated, below), so it is excluded.
      - alert: PostgresPhysicalSlotInactive
        expr: |
          (
            postgresql.replication_slot.inactive_age{postgresql.replication_slot.type="physical"} > 120
              unless on(service.instance.id, postgresql.replication_slot.name)
            postgresql.replication_slot.invalidated == 1
          )
            and on(service.instance.id)
          postgresql.recovery.active == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Physical slot {{ (index $labels "postgresql.replication_slot.name") }} on {{ (index $labels "service.instance.id") }} has been inactive for {{ $value | humanizeDuration }} (lab threshold)'

      # Any slot, physical or logical, on any node. Lab scenario slot-invalidated (slice1): an
      # unused physical slot falls more than max_slot_wal_keep_size behind and
      # a CHECKPOINT removes its WAL (wal_status lost, reason wal_removed).
      - alert: PostgresReplicationSlotInvalidated
        expr: postgresql.replication_slot.invalidated == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: 'Slot {{ (index $labels "postgresql.replication_slot.name") }} on {{ (index $labels "service.instance.id") }} is invalidated ({{ (index $labels "postgresql.replication_slot.invalidation_reason") }})'

      # A slot, valid and not yet invalidated, that holds back more than
      # 512 MiB of WAL on a primary: the volume is filling. Fires per slot,
      # whatever the type and whether the slot is active (a consumer that is
      # connected but far behind retains the same WAL). Lab threshold, set
      # against the k8s lab's guard max_slot_wal_keep_size = 1GB (lab/k8s/cnpg/cluster.yaml,
      # read as -1 = unlimited on 2026-11-11): half of it, so the alert comes
      # while the slot is still valid. An invalidated slot retains nothing and
      # has PostgresReplicationSlotInvalidated. Primary only: CloudNativePG (and
      # Patroni) copy slots to the replicas, where retained_wal is a few
      # hundred KB to 1 MB and means nothing (read on the k8s, pgha and stage3
      # labs on 2026-11-11).
      # Read from the existing labs on 2026-11-11 (pgha, stage3, slice1; five
      # days of history, 30 s steps): in their normal state retained_wal on a
      # primary is below 1 MB. Replay-heavy scenarios push a valid slot past
      # 256 MiB for under 6 minutes in total (stage3 reached 411 MB), never
      # past 512 MiB; slice1 slot-invalidated and subscription-disabled each
      # touched it in two isolated 30 s samples, which the 2 minute hold rides
      # out. A sustained breach in those labs would now alert; the hold is the
      # only protection. Accepted miss: a slot that retains less than the
      # threshold for ever, or one that goes from below to invalidated inside
      # one hold time.
      # Smoke run 2026-11-11 (k8s lab, replica cut, 700 MiB written): fired
      # 2m48s after the writes ended, resolved 1m after the cut was removed
      # (the replica consumed the WAL). The scratch table must not be left to
      # autovacuum: that doubled the WAL in the first run and the slot passed
      # the guard (status unreserved).
      # Lab scenario: lab/k8s/scenarios/slot-retaining-wal.sh.
      - alert: PostgresReplicationSlotRetainingWAL
        expr: |
          (
            postgresql.replication_slot.retained_wal > 512 * 1024 * 1024
              unless on(service.instance.id, postgresql.replication_slot.name)
            postgresql.replication_slot.invalidated == 1
          )
            and on(service.instance.id)
          postgresql.recovery.active == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Slot {{ (index $labels "postgresql.replication_slot.name") }} on {{ (index $labels "service.instance.id") }} retains {{ $value | humanize1024 }}B of WAL (lab threshold)'

      # Covers the pack and postgresqlreceiver's database.count (a canary for the
      # receiver). Every pack query returns at least one row on every node, or
      # (slots, subscriptions) none by design, so the list holds both kinds. `on(__name__)` is not honoured by binary
      # operators, so the metric name
      # is copied into the `metric` label first; that also puts it in the alert.
      # Looks back 1h: a series gone for longer resolves silently; a dead target
      # is still caught by PostgresTargetAbsent. Slot series exist only where
      # slots exist (the primary) and subscription series only on the
      # subscriber; the match is per instance, so a node that never had them
      # is silent. Dropping the last slot or subscription on purpose therefore
      # alerts for up to an hour; that is accepted, not filtered.
      - alert: PostgresSeriesVanished
        expr: |
          label_copy(last_over_time({__name__=~"postgresql[.](recovery[.]active|wal_receiver[.]streaming|replay[.](backlog|paused)|snapshot[.]oldest_age|xmin_horizon[.]age|client_connection[.](count|limit)|database[.](count|xid_age|mxid_age)|transaction[.]idle_age|lock[.](waiting_session[.]count|oldest_wait_age)|replication_slot[.](active|retained_wal|unconfirmed_wal|wal_status|invalidated|inactive_age)|subscription[.](enabled|apply_worker_running|last_msg_age|apply_error|sync_error|conflict))"}[1h]) keep_metric_names, "__name__", "metric")
            unless on(metric, service.instance.id)
          label_copy(present_over_time({__name__=~"postgresql[.](recovery[.]active|wal_receiver[.]streaming|replay[.](backlog|paused)|snapshot[.]oldest_age|xmin_horizon[.]age|client_connection[.](count|limit)|database[.](count|xid_age|mxid_age)|transaction[.]idle_age|lock[.](waiting_session[.]count|oldest_wait_age)|replication_slot[.](active|retained_wal|unconfirmed_wal|wal_status|invalidated|inactive_age)|subscription[.](enabled|apply_worker_running|last_msg_age|apply_error|sync_error|conflict))"}[2m]) keep_metric_names, "__name__", "metric")
            and on(service.instance.id)
          present_over_time(postgresql.collection.heartbeat[2m])
        # Only while the target's heartbeat lives: a dead target or Collector
        # is PostgresTargetAbsent or CollectorAbsent, not one alert per series.
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.metric }} vanished on {{ (index $labels "service.instance.id") }}'

      # Two or more instances of one cluster are writable at the same time
      # (postgresql.recovery.active == 0): two primaries, split brain. This
      # reads PostgreSQL itself, so it holds with any cluster manager or none
      # (Patroni, CloudNativePG, a manual promote). A cluster is the set of
      # members of one physical (streaming) replication group: they share
      # obenhub.cluster.name (on Kubernetes with k8s.namespace.name, as in
      # packs/cnpg). A logical subscriber is a cluster of its own and has its
      # own obenhub.cluster.name (slice1-subscriber), or it would always count as a
      # second primary.
      # Only fresh samples count: last_over_time over 30 s (two 15 s
      # collections) returns the latest value per series and drops a series
      # that has not reported for 30 s: a dead primary's last 0 would
      # otherwise live on for the backend's staleness lookback (minutes) and
      # fire next to the promoted primary. The inner max by service.instance.id
      # keeps one value per instance: a recreated Kubernetes pod of the same
      # name is a new series (k8s.pod.uid) and the deleted pod's last 0 must
      # not count twice; max prefers "in recovery" (1), so this can only hide
      # an alert, never invent one.
      # "for" is 45 s (three evaluations). On CloudNativePG the deleted
      # primary's last 0 overlaps the promoted replica's 0 for roughly 10 to
      # 40 s (lab/k8s primary-deleted run: replica writable about 6 s after
      # the kill, the new pod starts at +6 s, then recovery and up to one 15 s
      # scrape before it reports 1). With a 30 s window the stale 0 is gone
      # before a 45 s hold can complete. Patroni: the leader key expires 20 to
      # 30 s after the last sample, so the overlap is shorter still.
      # Trade-off, accepted: a real split brain shorter than about 60 s (the
      # hold plus a window's worth of samples) is not alerted; dropping a
      # series after two missed collections can only hide an alert.
      - alert: PostgresMultiplePrimaries
        expr: |
          count by (obenhub.cluster.name, k8s.namespace.name) (
            max by (obenhub.cluster.name, k8s.namespace.name, service.instance.id) (
              last_over_time(postgresql.recovery.active[30s])
            ) == 0
          ) > 1
        for: 45s
        labels:
          severity: critical
        annotations:
          summary: 'Cluster {{ (index $labels "obenhub.cluster.name") }} has {{ $value }} writable instances (split brain)'
