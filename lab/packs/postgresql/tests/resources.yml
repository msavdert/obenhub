      - eval_time: 4m15s
        groupname: postgresql
        alertname: ConnectionSaturation
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'a client connections at or above 95% of capacity'
      - eval_time: 4m30s
        groupname: postgresql
        alertname: ConnectionSaturation
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
