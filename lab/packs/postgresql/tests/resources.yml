# Tests for the shared PostgreSQL pack rules (lab/slice1 and lab/stage3 use them).
# SnapshotHeldTooLong and ConnectionSaturation.
rule_files:
  - ../rules.yml
evaluation_interval: 15s

tests:
  - name: snapshot older than 120s fires after 30s; younger or absent does not
    interval: 15s
    input_series:
      - series: 'postgresql.snapshot.oldest_age{service.instance.id="pg-primary"}'
        values: '0x4 130x56'
      - series: 'postgresql.snapshot.oldest_age{service.instance.id="pg-standby"}'
        values: '100x60'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: SnapshotHeldTooLong
        exp_alerts: []
      - eval_time: 3m
        groupname: postgresql
        alertname: SnapshotHeldTooLong
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
            exp_annotations:
              summary: 'A snapshot on pg-primary is 2m 10s old (lab threshold)'

  - name: no snapshot data does not fire
    interval: 15s
    input_series:
      - series: 'postgresql.snapshot.oldest_age{service.instance.id="pg-primary"}'
        values: '_x60'
    alert_rule_test:
      - eval_time: 5m
        groupname: postgresql
        alertname: SnapshotHeldTooLong
        exp_alerts: []

  - name: saturation fires above 85 percent of capacity on one server only
    interval: 15s
    input_series:
      - series: 'postgresql.connection.client{service.instance.id="pg-primary"}'
        values: '5x4 90x56'
      - series: 'postgresql.connection.client_capacity{service.instance.id="pg-primary"}'
        values: '97x60'
      - series: 'postgresql.connection.client{service.instance.id="pg-standby"}'
        values: '5x60'
      - series: 'postgresql.connection.client_capacity{service.instance.id="pg-standby"}'
        values: '97x60'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: ConnectionSaturation
        exp_alerts: []
      - eval_time: 4m
        groupname: postgresql
        alertname: ConnectionSaturation
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
            exp_annotations:
              summary: 'pg-primary client connections above 85% of capacity'

  - name: saturation at 80 percent or with a missing capacity series does not fire
    interval: 15s
    input_series:
      - series: 'postgresql.connection.client{service.instance.id="pg-primary"}'
        values: '78x60'
      - series: 'postgresql.connection.client_capacity{service.instance.id="pg-primary"}'
        values: '97x60'
      - series: 'postgresql.connection.client{service.instance.id="pg-standby"}'
        values: '95x60'
    alert_rule_test:
      - eval_time: 8m
        groupname: postgresql
        alertname: ConnectionSaturation
        exp_alerts: []

  - name: saturation tiers, boundary and escalation (one tier per series)
    interval: 15s
    input_series:
      # 95 of 100 = 0.95: critical
      - series: 'postgresql.connection.client{service.instance.id="pg-crit"}'
        values: '95x60'
      # 0.95 exactly (19 of 20) belongs to the critical tier
      - series: 'postgresql.connection.client{service.instance.id="pg-edge"}'
        values: '19x60'
      # 0.90: warning only
      - series: 'postgresql.connection.client{service.instance.id="pg-warn"}'
        values: '90x60'
      # 0.90 for 3 minutes, then 0.98
      - series: 'postgresql.connection.client{service.instance.id="pg-esc"}'
        values: '90x12 98x48'
      - series: 'postgresql.connection.client_capacity{service.instance.id="pg-crit"}'
        values: '100x60'
      - series: 'postgresql.connection.client_capacity{service.instance.id="pg-edge"}'
        values: '20x60'
      - series: 'postgresql.connection.client_capacity{service.instance.id="pg-warn"}'
        values: '100x60'
      - series: 'postgresql.connection.client_capacity{service.instance.id="pg-esc"}'
        values: '100x60'
    alert_rule_test:
      # pg-esc: warning while at 0.90, ...
      - eval_time: 2m30s
        groupname: postgresql
        alertname: ConnectionSaturation
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-crit
            exp_annotations:
              summary: 'pg-crit client connections at or above 95% of capacity'
          - exp_labels:
              severity: critical
              service.instance.id: pg-edge
            exp_annotations:
              summary: 'pg-edge client connections at or above 95% of capacity'
          - exp_labels:
              severity: warning
              service.instance.id: pg-esc
            exp_annotations:
              summary: 'pg-esc client connections above 85% of capacity'
          - exp_labels:
              severity: warning
              service.instance.id: pg-warn
            exp_annotations:
              summary: 'pg-warn client connections above 85% of capacity'
      # ... then the critical only (steady state)
      - eval_time: 5m
        groupname: postgresql
        alertname: ConnectionSaturation
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-crit
            exp_annotations:
              summary: 'pg-crit client connections at or above 95% of capacity'
          - exp_labels:
              severity: critical
              service.instance.id: pg-edge
            exp_annotations:
              summary: 'pg-edge client connections at or above 95% of capacity'
          - exp_labels:
              severity: critical
              service.instance.id: pg-esc
            exp_annotations:
              summary: 'pg-esc client connections at or above 95% of capacity'
          - exp_labels:
              severity: warning
              service.instance.id: pg-warn
            exp_annotations:
              summary: 'pg-warn client connections above 85% of capacity'

  # The ratio is 0.98 from 3m15s; the critical needs five samples (the old 1m for) and appears at 4m15s, the warning is up until then.
  - name: saturation tiers - escalation, exactly one tier at every evaluation
    interval: 15s
    input_series:
