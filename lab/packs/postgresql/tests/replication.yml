# Tests for the shared PostgreSQL pack rules (lab/slice1 and lab/stage3 use them).
# PostgresStandbyNotStreaming and PostgresReplayBacklog gate on recovery.active == 1;
# PostgresStandbyNotStreaming is also silent while no node is writable.
# PostgresMultiplePrimaries is at the end.
rule_files:
  - ../rules.yml
evaluation_interval: 15s

tests:
  - name: not streaming fires on the standby only; the primary (0, not in recovery) is gated out
    interval: 15s
    input_series:
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-primary"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-primary"}'
        values: '0x60'
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-standby"}'
        values: '1x8 0x52'
      - series: 'postgresql.recovery.active{service.instance.id="pg-standby"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 1m   # still streaming
        groupname: postgresql
        alertname: PostgresStandbyNotStreaming
        exp_alerts: []
      - eval_time: 2m30s   # 0 for 30s, below the 1m hold
        groupname: postgresql
        alertname: PostgresStandbyNotStreaming
        exp_alerts: []
      - eval_time: 5m
        groupname: postgresql
        alertname: PostgresStandbyNotStreaming
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-standby
            exp_annotations:
              summary: pg-standby is in recovery and not streaming

  - name: a failed standby collection (no samples) does not fire
    interval: 15s
    input_series:
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-standby"}'
        values: '1x8 _x52'
      - series: 'postgresql.recovery.active{service.instance.id="pg-standby"}'
        values: '1x8 _x52'
    alert_rule_test:
      - eval_time: 8m
        groupname: postgresql
        alertname: PostgresStandbyNotStreaming
        exp_alerts: []

  - name: not streaming does not fire when only recovery.active is missing
    interval: 15s
    input_series:
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-standby"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 8m
        groupname: postgresql
        alertname: PostgresStandbyNotStreaming
        exp_alerts: []

  - name: a short startup blip of streaming=0 does not fire
    interval: 15s
    input_series:
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-standby"}'
        values: '0x3 1x57'
      - series: 'postgresql.recovery.active{service.instance.id="pg-standby"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 3m
        groupname: postgresql
        alertname: PostgresStandbyNotStreaming
        exp_alerts: []

  - name: promoted standby (recovery.active 0) is no longer expected to stream
    interval: 15s
    input_series:
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-standby"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-standby"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 8m
        groupname: postgresql
        alertname: PostgresStandbyNotStreaming
        exp_alerts: []

  - name: backlog above 16 MiB fires on the standby; 0 and the primary do not
    interval: 15s
    input_series:
      - series: 'postgresql.replay.backlog{service.instance.id="pg-standby"}'
        values: '0x8 20000000x52'
      - series: 'postgresql.recovery.active{service.instance.id="pg-standby"}'
        values: '1x60'
      - series: 'postgresql.replay.backlog{service.instance.id="pg-primary"}'
        values: '20000000x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-primary"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: PostgresReplayBacklog
        exp_alerts: []
      - eval_time: 5m
        groupname: postgresql
        alertname: PostgresReplayBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-standby
            exp_annotations:
              summary: pg-standby replay backlog is 19.07MiB

  - name: backlog exactly at the threshold or below does not fire
    interval: 15s
    input_series:
      - series: 'postgresql.replay.backlog{service.instance.id="pg-standby"}'
        values: '16777216x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-standby"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 8m
        groupname: postgresql
        alertname: PostgresReplayBacklog
        exp_alerts: []

  - name: not streaming is silent when no node is writable (quorum lost, all in recovery)
    interval: 15s
    input_series:
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-1"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-1"}'
        values: '1x60'
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-2"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-2"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 8m
        groupname: postgresql
        alertname: PostgresStandbyNotStreaming
        exp_alerts: []

  - name: not streaming ignores a deleted pod's stale primary sample under the recreated pod (k8s.pod.uid)
    interval: 15s
    input_series:
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-1",k8s.pod.uid="old"}'
        values: '0x4'
      - series: 'postgresql.recovery.active{service.instance.id="pg-1",k8s.pod.uid="old"}'
        values: '0x4'
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-1",k8s.pod.uid="new"}'
        values: '_x6 1x40'
      - series: 'postgresql.recovery.active{service.instance.id="pg-1",k8s.pod.uid="new"}'
        values: '_x6 1x40'
      - series: 'postgresql.recovery.active{service.instance.id="pg-2",k8s.pod.uid="p2"}'
        values: '1x4 0x42'
    alert_rule_test:
      - eval_time: 3m
        groupname: postgresql
        alertname: PostgresStandbyNotStreaming
        exp_alerts: []

  - name: not streaming still fires for a pod in recovery that does not stream (k8s.pod.uid on both sides)
    interval: 15s
    input_series:
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-1",k8s.pod.uid="new"}'
        values: '0x40'
      - series: 'postgresql.recovery.active{service.instance.id="pg-1",k8s.pod.uid="new"}'
        values: '1x40'
      - series: 'postgresql.recovery.active{service.instance.id="pg-2",k8s.pod.uid="p2"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 3m
        groupname: postgresql
        alertname: PostgresStandbyNotStreaming
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-1
              k8s.pod.uid: new
            exp_annotations:
              summary: pg-1 is in recovery and not streaming

  # --- multiple primaries ----------------------------------------------------
  - name: two fresh writable instances of one cluster fire only after the 45 s hold
    interval: 15s
    input_series:
      - series: 'postgresql.recovery.active{obenhub.cluster.name="c1",service.instance.id="pg-1"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{obenhub.cluster.name="c1",service.instance.id="pg-2"}'
        values: '1x8 0x52'
      - series: 'postgresql.recovery.active{obenhub.cluster.name="c1",service.instance.id="pg-3"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []
      - eval_time: 2m45s   # two writable for 30 s, below the hold
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []
      - eval_time: 4m
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts:
          - exp_labels: {severity: critical, obenhub.cluster.name: c1}
            exp_annotations:
              summary: Cluster c1 has 2 writable instances (split brain)

  - name: one writable instance does not fire
    interval: 15s
    input_series:
      - series: 'postgresql.recovery.active{obenhub.cluster.name="c1",service.instance.id="pg-1"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{obenhub.cluster.name="c1",service.instance.id="pg-2"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 4m
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []

  - name: a dead primary's stale 0 next to the promoted one does not fire (failover)
    interval: 15s
    input_series:
      # Worst case: pg-2 reports its first 0 at 1m45, one collection before
      # pg-1 reports its last 0 (2m) and stops. The stale 0 stays in a 30 s
      # window until 2m15 only, so the overlap (1m45 to 2m15) is shorter than
      # the 45 s hold. With a 45 s window the overlap lasts to 2m30 and the
      # alert fires; without last_over_time (the 5 m lookback) it fires too.
      - series: 'postgresql.recovery.active{obenhub.cluster.name="c1",service.instance.id="pg-1"}'
        values: '0x8 _x52'
      - series: 'postgresql.recovery.active{obenhub.cluster.name="c1",service.instance.id="pg-2"}'
        values: '1x6 0x54'
    alert_rule_test:
      - eval_time: 2m30s
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []
      - eval_time: 2m45s
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []
      - eval_time: 3m
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []
      - eval_time: 5m
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []

  - name: writable instances in different clusters do not fire (a logical subscriber is its own cluster)
    interval: 15s
    input_series:
      - series: 'postgresql.recovery.active{obenhub.cluster.name="slice1",service.instance.id="pg-primary"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{obenhub.cluster.name="slice1",service.instance.id="pg-standby"}'
        values: '1x60'
      - series: 'postgresql.recovery.active{obenhub.cluster.name="slice1-subscriber",service.instance.id="pg-subscriber"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{obenhub.cluster.name="c2",service.instance.id="pg-1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 4m
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []

  - name: the same cluster name in two namespaces is two clusters
    interval: 15s
    input_series:
      - series: 'postgresql.recovery.active{obenhub.cluster.name="pg",k8s.namespace.name="a",service.instance.id="pg-1",k8s.pod.uid="u1"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{obenhub.cluster.name="pg",k8s.namespace.name="b",service.instance.id="pg-1",k8s.pod.uid="u2"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 4m
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []

  - name: a recreated pod of the same name does not count twice (old pod uid 0, new pod uid in recovery)
    interval: 15s
    input_series:
      # pg-1 was primary (uid old); its pod is recreated as a replica (uid new)
      # at 2m15s while the old series lingers to 3m30. pg-2 is promoted at
      # 2m15s. Counting series instead of instances (k8s.pod.uid in the inner
      # max by) makes this test fail (checked in a scratch copy).
      - series: 'postgresql.recovery.active{obenhub.cluster.name="pg",k8s.namespace.name="a",service.instance.id="pg-1",k8s.pod.uid="old"}'
        values: '0x14 _x46'
      - series: 'postgresql.recovery.active{obenhub.cluster.name="pg",k8s.namespace.name="a",service.instance.id="pg-1",k8s.pod.uid="new"}'
        values: '_x9 1x51'
      - series: 'postgresql.recovery.active{obenhub.cluster.name="pg",k8s.namespace.name="a",service.instance.id="pg-2",k8s.pod.uid="p2"}'
        values: '1x9 0x51'
    alert_rule_test:
      - eval_time: 3m
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []
      - eval_time: 3m15s
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []
      - eval_time: 3m30s
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []
      - eval_time: 5m
        groupname: postgresql
        alertname: PostgresMultiplePrimaries
        exp_alerts: []
