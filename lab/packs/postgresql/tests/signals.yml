        groupname: postgresql
        alertname: TransactionIdWraparound
        exp_alerts: []
      - eval_time: 5m30s
        groupname: postgresql
        alertname: TransactionIdWraparound
        exp_alerts: []
      - eval_time: 6m
        groupname: postgresql
        alertname: TransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              datname: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'
      - eval_time: 6m15s
        groupname: postgresql
        alertname: TransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              datname: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'
      - eval_time: 6m30s
