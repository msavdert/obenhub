# Tests for the shared PostgreSQL pack rules (lab/slice1 and lab/stage3 use them).
# Wraparound, idle in transaction, blocked sessions, deadlocks, requested
# checkpoints, the inactive physical slot and invalidated slots. Wraparound has unit tests only:
# the lab cannot reach those ages.
rule_files:
  - ../rules.yml
evaluation_interval: 15s

tests:
  - name: wraparound tiers by kind, exactly 0.75 is still the warning, exactly 0.5 is no alert
    interval: 15s
    input_series:
      # 2^31 = 2147483648; 0.5 -> 1073741824, 0.75 -> 1610612736
      - series: 'postgresql.database.xid_age{service.instance.id="pg-primary",postgresql.database.name="app"}'
        values: '1100000000x60'
      - series: 'postgresql.database.xid_age{service.instance.id="pg-primary",postgresql.database.name="postgres"}'
        values: '1610612736x60'
      - series: 'postgresql.database.xid_age{service.instance.id="pg-primary",postgresql.database.name="template1"}'
        values: '1073741824x60'
      - series: 'postgresql.database.mxid_age{service.instance.id="pg-primary",postgresql.database.name="app"}'
        values: '1700000000x60'
      - series: 'postgresql.database.mxid_age{service.instance.id="pg-primary",postgresql.database.name="postgres"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-primary"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 6m
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          # xid 0.512 of app: warning
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 51.22% of the wraparound limit'
          # xid exactly 0.75 of postgres: still warning
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
              postgresql.database.name: postgres
              kind: xid
            exp_annotations:
              summary: 'xid age of postgres on pg-primary is 75% of the wraparound limit'
          # mxid 0.79 of app: critical
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: mxid
            exp_annotations:
              summary: 'mxid age of app on pg-primary is 79.16% of the wraparound limit'
              # xid exactly 0.5 of template1 (not above): no alert

  - name: idle in transaction tiers and boundaries
    interval: 15s
    input_series:
      - series: 'postgresql.transaction.idle_age{service.instance.id="pg-warn"}'
        values: '0x4 90x56'
      - series: 'postgresql.transaction.idle_age{service.instance.id="pg-crit"}'
        values: '0x4 200x56'
      # exactly 60 and exactly 180 are not above the thresholds
      - series: 'postgresql.transaction.idle_age{service.instance.id="pg-low-edge"}'
        values: '60x60'
      - series: 'postgresql.transaction.idle_age{service.instance.id="pg-high-edge"}'
        values: '0x4 180x56'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts: []
      - eval_time: 5m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-warn
            exp_annotations:
              summary: 'A session on pg-warn has been idle in a transaction for 1m 30s (lab threshold)'
          - exp_labels:
              severity: critical
              service.instance.id: pg-crit
            exp_annotations:
              summary: 'A session on pg-crit has been idle in a transaction for 3m 20s (lab threshold)'
          - exp_labels:
              severity: warning
              service.instance.id: pg-high-edge
            exp_annotations:
              summary: 'A session on pg-high-edge has been idle in a transaction for 3m 0s (lab threshold)'

  - name: blocked sessions fire after a 30 s wait that lasts 30 s
    interval: 15s
    input_series:
      - series: 'postgresql.lock.oldest_wait_age{service.instance.id="pg-primary"}'
        values: '0x4 40x56'
      - series: 'postgresql.lock.oldest_wait_age{service.instance.id="pg-standby"}'
        values: '30x60'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: PostgresBlockedSessions
        exp_alerts: []
      - eval_time: 3m
        groupname: postgresql
        alertname: PostgresBlockedSessions
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
            exp_annotations:
              summary: 'A session on pg-primary has waited 40s for a lock (lab threshold)'

  - name: a deadlock fires at once and resolves once it has left the five minute window; a flat counter never fires
    interval: 15s
    input_series:
      - series: 'postgresql.deadlocks{service.instance.id="pg-primary",postgresql.database.name="postgres"}'
        values: '0x8 1x100'
      - series: 'postgresql.deadlocks{service.instance.id="pg-standby",postgresql.database.name="postgres"}'
        values: '3x108'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: PostgresDeadlocks
        exp_alerts: []
      - eval_time: 3m
        groupname: postgresql
        alertname: PostgresDeadlocks
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
              postgresql.database.name: postgres
            exp_annotations:
              summary: '1 deadlock(s) in postgres on pg-primary in the last 5 minutes'
      - eval_time: 6m
        groupname: postgresql
        alertname: PostgresDeadlocks
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
              postgresql.database.name: postgres
            exp_annotations:
              summary: '1 deadlock(s) in postgres on pg-primary in the last 5 minutes'
      - eval_time: 7m30s
        groupname: postgresql
        alertname: PostgresDeadlocks
        exp_alerts: []
      - eval_time: 12m
        groupname: postgresql
        alertname: PostgresDeadlocks
        exp_alerts: []

  - name: a counter reset to zero does not fire
    interval: 15s
    input_series:
      - series: 'postgresql.deadlocks{service.instance.id="pg-primary",postgresql.database.name="postgres"}'
        values: '5x8 0x100'
    alert_rule_test:
      - eval_time: 3m
        groupname: postgresql
        alertname: PostgresDeadlocks
        exp_alerts: []
      - eval_time: 6m
        groupname: postgresql
        alertname: PostgresDeadlocks
        exp_alerts: []

  - name: requested checkpoints fire on the primary only, above three in five minutes
    interval: 15s
    input_series:
      # +8 in the first 2 minutes
      - series: 'postgresql.bgwriter.checkpoint.count{service.instance.id="pg-primary",type="requested"}'
        values: '10 11 12 13 14 15 16 17 18 18x90'
      # the same counter on a standby (restartpoints) never fires
      - series: 'postgresql.bgwriter.checkpoint.count{service.instance.id="pg-standby",type="requested"}'
        values: '10 11 12 13 14 15 16 17 18 18x90'
      # scheduled checkpoints are not counted
      - series: 'postgresql.bgwriter.checkpoint.count{service.instance.id="pg-primary",type="scheduled"}'
        values: '0 2 4 6 8 10 12 14 16 16x90'
      # three more is not above three
      - series: 'postgresql.bgwriter.checkpoint.count{service.instance.id="pg-edge",type="requested"}'
        values: '10 11 12 13 13x90'
      - series: 'postgresql.recovery.active{service.instance.id="pg-primary"}'
        values: '0x100'
      - series: 'postgresql.recovery.active{service.instance.id="pg-standby"}'
        values: '1x100'
      - series: 'postgresql.recovery.active{service.instance.id="pg-edge"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 3m
        groupname: postgresql
        alertname: PostgresCheckpointsRequested
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
              type: requested
            exp_annotations:
              summary: 'pg-primary had 8 requested checkpoints in 5 minutes (lab threshold)'
      - eval_time: 20m
        groupname: postgresql
        alertname: PostgresCheckpointsRequested
        exp_alerts: []

  - name: an inactive physical slot fires on the primary only
    interval: 15s
    input_series:
      - series: 'postgresql.replication_slot.inactive_age{service.instance.id="pg-primary",postgresql.replication_slot.name="spare",postgresql.replication_slot.type="physical"}'
        values: '0x4 150x56'
      # an active slot, a logical slot and the replica-side copy do not fire
      - series: 'postgresql.replication_slot.inactive_age{service.instance.id="pg-primary",postgresql.replication_slot.name="standby1",postgresql.replication_slot.type="physical"}'
        values: '0x60'
      - series: 'postgresql.replication_slot.inactive_age{service.instance.id="pg-primary",postgresql.replication_slot.name="app_sub",postgresql.replication_slot.type="logical"}'
        values: '500x60'
      - series: 'postgresql.replication_slot.inactive_age{service.instance.id="pg-standby",postgresql.replication_slot.name="spare",postgresql.replication_slot.type="physical"}'
        values: '500x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-primary"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-standby"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: PostgresPhysicalSlotInactive
        exp_alerts: []
      - eval_time: 4m
        groupname: postgresql
        alertname: PostgresPhysicalSlotInactive
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
              postgresql.replication_slot.name: spare
              postgresql.replication_slot.type: physical
            exp_annotations:
              summary: 'Physical slot spare on pg-primary has been inactive for 2m 30s (lab threshold)'

  - name: an inactive but invalidated physical slot does not fire PostgresPhysicalSlotInactive
    interval: 15s
    input_series:
      - series: 'postgresql.replication_slot.inactive_age{service.instance.id="pg-primary",postgresql.replication_slot.name="gone",postgresql.replication_slot.type="physical"}'
        values: '500x60'
      - series: 'postgresql.replication_slot.invalidated{service.instance.id="pg-primary",postgresql.replication_slot.name="gone",postgresql.replication_slot.type="physical",postgresql.replication_slot.invalidation_reason="wal_removed"}'
        values: '1x60'
      # same state, not invalidated: still fires
      - series: 'postgresql.replication_slot.inactive_age{service.instance.id="pg-primary",postgresql.replication_slot.name="spare",postgresql.replication_slot.type="physical"}'
        values: '500x60'
      - series: 'postgresql.replication_slot.invalidated{service.instance.id="pg-primary",postgresql.replication_slot.name="spare",postgresql.replication_slot.type="physical",postgresql.replication_slot.invalidation_reason=""}'
        values: '0x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-primary"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 4m
        groupname: postgresql
        alertname: PostgresPhysicalSlotInactive
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
              postgresql.replication_slot.name: spare
              postgresql.replication_slot.type: physical
            exp_annotations:
              summary: 'Physical slot spare on pg-primary has been inactive for 8m 20s (lab threshold)'

  - name: an invalidated slot is critical, with the reason; a valid slot is not
    interval: 15s
    input_series:
      - series: 'postgresql.replication_slot.invalidated{service.name="postgresql",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pg-primary",postgresql.replication_slot.name="app_sub",postgresql.replication_slot.type="logical",postgresql.replication_slot.invalidation_reason="wal_removed"}'
        values: '0x8 1x52'
      - series: 'postgresql.replication_slot.invalidated{service.name="postgresql",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pg-primary",postgresql.replication_slot.name="standby1",postgresql.replication_slot.type="physical",postgresql.replication_slot.invalidation_reason=""}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: PostgresReplicationSlotInvalidated
        exp_alerts: []
      - eval_time: 5m
        groupname: postgresql
        alertname: PostgresReplicationSlotInvalidated
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              service.name: postgresql
              service.namespace: obenhub-lab
              obenhub.cluster.name: slice1
              postgresql.replication_slot.name: app_sub
              postgresql.replication_slot.type: logical
              postgresql.replication_slot.invalidation_reason: wal_removed
            exp_annotations:
              summary: Slot app_sub on pg-primary is invalidated (wal_removed)

  # idle_age is 200 from 3m15s; the critical needs three samples (the old 30s for) and appears at 3m45s.
  - name: idle in transaction tiers - escalation, exactly one tier at every evaluation
    interval: 15s
    input_series:
      - series: 'postgresql.transaction.idle_age{service.instance.id="a"}'
        values: '90x12 200x48'
    alert_rule_test:
      - eval_time: 3m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 1m 30s (lab threshold)'
      - eval_time: 3m15s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 1m 30s (lab threshold)'
      - eval_time: 3m30s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 1m 30s (lab threshold)'
      - eval_time: 3m45s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 4m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 4m15s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 4m30s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'

  - name: idle in transaction tiers - de-escalation, the warning follows the critical at once
    interval: 15s
    input_series:
      - series: 'postgresql.transaction.idle_age{service.instance.id="a"}'
        values: '200x20 90x40'
    alert_rule_test:
      - eval_time: 4m45s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 5m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 5m15s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 1m 30s (lab threshold)'
      - eval_time: 5m30s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 1m 30s (lab threshold)'
      - eval_time: 5m45s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 1m 30s (lab threshold)'
      - eval_time: 6m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 1m 30s (lab threshold)'

  - name: idle in transaction tiers - a single dip while critical shows the warning for the window, then the critical returns
    interval: 15s
    input_series:
      - series: 'postgresql.transaction.idle_age{service.instance.id="a"}'
        values: '200x20 90 200x39'
    alert_rule_test:
      - eval_time: 4m45s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 5m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 5m15s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 1m 30s (lab threshold)'
      - eval_time: 5m30s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 1m 30s (lab threshold)'
      - eval_time: 5m45s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 1m 30s (lab threshold)'
      - eval_time: 6m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 6m15s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 6m30s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'

  - name: idle in transaction tiers - a jump from below the warning threshold straight above the critical one never shows the warning
    interval: 15s
    input_series:
      - series: 'postgresql.transaction.idle_age{service.instance.id="a"}'
        values: '10x12 200x48'
    alert_rule_test:
      - eval_time: 3m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts: []
      - eval_time: 3m15s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts: []
      - eval_time: 3m30s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts: []
      - eval_time: 3m45s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 4m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 4m15s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'

  # xid_age is 0.79 of the limit from 10m15s; the critical needs 21 samples (old 5m for plus a step) and appears at 15m15s.
  - name: wraparound tiers - escalation, exactly one tier at every evaluation
    interval: 15s
    input_series:
      - series: 'postgresql.database.xid_age{service.instance.id="pg-primary",postgresql.database.name="app"}'
        values: '1200000000x40 1700000000x80'
      - series: 'postgresql.recovery.active{service.instance.id="pg-primary"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 14m30s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 55.88% of the wraparound limit'
      - eval_time: 14m45s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 55.88% of the wraparound limit'
      - eval_time: 15m
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 55.88% of the wraparound limit'
      - eval_time: 15m15s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'
      - eval_time: 15m30s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'
      - eval_time: 15m45s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'

  - name: wraparound tiers - a jump from below the warning threshold straight above the critical one never shows the warning
    interval: 15s
    input_series:
      - series: 'postgresql.database.xid_age{service.instance.id="pg-primary",postgresql.database.name="app"}'
        values: '100000000x40 1700000000x80'
      - series: 'postgresql.recovery.active{service.instance.id="pg-primary"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 14m30s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts: []
      - eval_time: 14m45s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts: []
      - eval_time: 15m
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts: []
      - eval_time: 15m15s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'
      - eval_time: 15m30s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'
      - eval_time: 15m45s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'

  - name: wraparound on a standby never fires, the same age on the primary does
    interval: 15s
    input_series:
      - series: 'postgresql.database.xid_age{service.instance.id="pg-standby",postgresql.database.name="app"}'
        values: '1700000000x80'
      - series: 'postgresql.database.xid_age{service.instance.id="pg-primary",postgresql.database.name="app"}'
        values: '1700000000x80'
      - series: 'postgresql.recovery.active{service.instance.id="pg-primary"}'
        values: '0x80'
      - series: 'postgresql.recovery.active{service.instance.id="pg-standby"}'
        values: '1x80'
      # an age in the warning band on the standby exercises the warning tier's gate
      - series: 'postgresql.database.mxid_age{service.instance.id="pg-standby",postgresql.database.name="app"}'
        values: '1300000000x80'
    alert_rule_test:
      - eval_time: 19m
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'

  # The first sample is at 1m; three points make a full window (the old 30s for).
  - name: idle in transaction warm-up - a new series above the critical threshold stays silent until its window is full
    interval: 15s
    input_series:
      - series: 'postgresql.transaction.idle_age{service.instance.id="a"}'
        values: '_x4 200x56'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts: []
      - eval_time: 1m15s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts: []
      - eval_time: 1m30s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 1m45s
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'
      - eval_time: 2m
        groupname: postgresql
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: a
            exp_annotations:
              summary: 'A session on a has been idle in a transaction for 3m 20s (lab threshold)'

  # The first sample is at 1m; 21 points make a full window (the old 5m for), so the critical comes at 6m.
  - name: wraparound warm-up - a new series above the critical threshold stays silent until its window is full
    interval: 15s
    input_series:
      - series: 'postgresql.database.xid_age{service.instance.id="pg-primary",postgresql.database.name="app"}'
        values: '_x4 1700000000x100'
      - series: 'postgresql.recovery.active{service.instance.id="pg-primary"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts: []
      - eval_time: 1m45s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts: []
      - eval_time: 2m30s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts: []
      - eval_time: 3m15s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts: []
      - eval_time: 4m
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts: []
      - eval_time: 4m45s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts: []
      - eval_time: 5m30s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts: []
      - eval_time: 6m
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'
      - eval_time: 6m15s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'
      - eval_time: 6m30s
        groupname: postgresql
        alertname: PostgresTransactionIdWraparound
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-primary
              postgresql.database.name: app
              kind: xid
            exp_annotations:
              summary: 'xid age of app on pg-primary is 79.16% of the wraparound limit'

  # --- PostgresReplicationSlotRetainingWAL (threshold 512 MiB = 536870912, hold 2m) ---
  - name: a valid slot above 512 MiB on a primary fires after the hold; below, on a replica copy, and invalidated stay quiet
    interval: 15s
    input_series:
      # 600 MiB from the start: fires
      - series: 'postgresql.replication_slot.retained_wal{service.instance.id="pg-1",postgresql.replication_slot.name="_cnpg_pg_2",postgresql.replication_slot.type="physical"}'
        values: '629145600x60'
      - series: 'postgresql.replication_slot.invalidated{service.instance.id="pg-1",postgresql.replication_slot.name="_cnpg_pg_2",postgresql.replication_slot.type="physical",postgresql.replication_slot.invalidation_reason=""}'
        values: '0x60'
      # 400 MiB: below the threshold
      - series: 'postgresql.replication_slot.retained_wal{service.instance.id="pg-1",postgresql.replication_slot.name="_cnpg_pg_3",postgresql.replication_slot.type="physical"}'
        values: '419430400x60'
      # 900 MiB but invalidated: retains nothing, has its own alert
      - series: 'postgresql.replication_slot.retained_wal{service.instance.id="pg-1",postgresql.replication_slot.name="gone",postgresql.replication_slot.type="physical"}'
        values: '943718400x60'
      - series: 'postgresql.replication_slot.invalidated{service.instance.id="pg-1",postgresql.replication_slot.name="gone",postgresql.replication_slot.type="physical",postgresql.replication_slot.invalidation_reason="wal_removed"}'
        values: '1x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-1"}'
        values: '0x60'
      # a replica's copy of a slot, large on purpose: replicas are out of scope
      - series: 'postgresql.replication_slot.retained_wal{service.instance.id="pg-2",postgresql.replication_slot.name="_cnpg_pg_3",postgresql.replication_slot.type="physical"}'
        values: '629145600x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-2"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 1m30s   # pending, below the 2m hold
        groupname: postgresql
        alertname: PostgresReplicationSlotRetainingWAL
        exp_alerts: []
      - eval_time: 2m30s   # firing just after the hold: pins `for` from above
        groupname: postgresql
        alertname: PostgresReplicationSlotRetainingWAL
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-1
              postgresql.replication_slot.name: _cnpg_pg_2
              postgresql.replication_slot.type: physical
            exp_annotations:
              summary: 'Slot _cnpg_pg_2 on pg-1 retains 600MiB of WAL (lab threshold)'
      - eval_time: 4m
        groupname: postgresql
        alertname: PostgresReplicationSlotRetainingWAL
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-1
              postgresql.replication_slot.name: _cnpg_pg_2
              postgresql.replication_slot.type: physical
            exp_annotations:
              summary: 'Slot _cnpg_pg_2 on pg-1 retains 600MiB of WAL (lab threshold)'

  - name: a slot that crosses the threshold for less than the hold, or sits exactly at it, does not fire; it resolves when the slot catches up
    interval: 15s
    input_series:
      # 90 s above (6 samples), then back to 1 MB
      - series: 'postgresql.replication_slot.retained_wal{service.instance.id="pg-1",postgresql.replication_slot.name="blip",postgresql.replication_slot.type="physical"}'
        values: '1000000x4 629145600x6 1000000x50'
      # exactly 512 MiB is not above it
      - series: 'postgresql.replication_slot.retained_wal{service.instance.id="pg-1",postgresql.replication_slot.name="edge",postgresql.replication_slot.type="physical"}'
        values: '536870912x60'
      # fires, then catches up at 6m
      - series: 'postgresql.replication_slot.retained_wal{service.instance.id="pg-1",postgresql.replication_slot.name="lag",postgresql.replication_slot.type="physical"}'
        values: '629145600x24 1000000x36'
      - series: 'postgresql.recovery.active{service.instance.id="pg-1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 5m
        groupname: postgresql
        alertname: PostgresReplicationSlotRetainingWAL
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-1
              postgresql.replication_slot.name: lag
              postgresql.replication_slot.type: physical
            exp_annotations:
              summary: 'Slot lag on pg-1 retains 600MiB of WAL (lab threshold)'
      - eval_time: 7m
        groupname: postgresql
        alertname: PostgresReplicationSlotRetainingWAL
        exp_alerts: []
