# PostgreSQL pack: the sql_query list shared by every PostgreSQL target of
# lab/slice1 and lab/stage3 (embedded with ${file:...} in each otelcol config).
# One query per concern, so a failing query loses only its own metrics while
# the heartbeat continues. Names follow the naming contract
# (ADR 0006); attribute columns are dotted aliases. The slot and subscription queries return no rows where
# there are none, so a node without them simply has no such series.
- sql: SELECT 1 AS collection_heartbeat
  metrics:
    - {metric_name: postgresql.collection.heartbeat, value_column: collection_heartbeat, value_type: int, data_type: gauge, unit: "1", description: "1 whenever the heartbeat query succeeded"}
- sql: |
    SELECT
      CASE WHEN pg_is_in_recovery() THEN 1 ELSE 0 END AS recovery_active,
      (EXISTS (SELECT 1 FROM pg_stat_wal_receiver WHERE status = 'streaming'))::int AS wal_receiver_streaming,
      CASE WHEN pg_is_in_recovery()
            THEN coalesce(pg_wal_lsn_diff(pg_last_wal_receive_lsn(), pg_last_wal_replay_lsn()), 0)::float8
            ELSE 0::float8 END AS replay_backlog,
      CASE WHEN pg_is_in_recovery()
            THEN (pg_get_wal_replay_pause_state() <> 'not paused')::int
            ELSE 0 END AS replay_paused
  metrics:
    - {metric_name: postgresql.recovery.active, value_column: recovery_active, value_type: int, data_type: gauge, unit: "1", description: "1 when the server is in recovery"}
    - {metric_name: postgresql.wal_receiver.streaming, value_column: wal_receiver_streaming, value_type: int, data_type: gauge, unit: "1", description: "1 when a WAL receiver is streaming (always 0 on a primary)"}
    - {metric_name: postgresql.replay.backlog, value_column: replay_backlog, value_type: double, data_type: gauge, unit: By, description: "Received but not yet replayed WAL"}
    - {metric_name: postgresql.replay.paused, value_column: replay_paused, value_type: int, data_type: gauge, unit: "1", description: "1 when WAL replay is paused"}
# snapshot_oldest_age covers what has a timestamp: client transactions that
# hold a snapshot or an xid, and prepared transactions (pg_prepared_xacts.
# prepared). Replication slots and walsender feedback have no timestamp; they
# are in xmin_horizon_age, in transactions. Every backend type counts there, so
# a walsender's backend_xmin (hot_standby_feedback) is included; the slot's own
# xmin and catalog_xmin are read from pg_replication_slots because a physical
# slot keeps them with no walsender attached.
- sql: |
    SELECT
      greatest(
        coalesce((SELECT max(extract(epoch FROM clock_timestamp() - xact_start))
                    FROM pg_stat_activity
                    WHERE (backend_xmin IS NOT NULL OR backend_xid IS NOT NULL)
                      AND backend_type = 'client backend'
                      AND pid <> pg_backend_pid()), 0),
        coalesce((SELECT max(extract(epoch FROM clock_timestamp() - prepared))
                    FROM pg_prepared_xacts), 0))::float8 AS snapshot_oldest_age,
      coalesce((SELECT max(age(x)) FROM (
                  SELECT backend_xmin AS x FROM pg_stat_activity WHERE pid <> pg_backend_pid()
                  UNION ALL SELECT backend_xid FROM pg_stat_activity WHERE pid <> pg_backend_pid()
                  UNION ALL SELECT xmin FROM pg_replication_slots
                  UNION ALL SELECT catalog_xmin FROM pg_replication_slots
                  UNION ALL SELECT transaction FROM pg_prepared_xacts) h), 0)::bigint AS xmin_horizon_age,
      (SELECT count(*) FROM pg_stat_activity WHERE backend_type = 'client backend')::int AS client_connection_count,
      (current_setting('max_connections')::int
          - current_setting('superuser_reserved_connections')::int
          - current_setting('reserved_connections')::int) AS client_connection_limit
  metrics:
    - {metric_name: postgresql.snapshot.oldest_age, value_column: snapshot_oldest_age, value_type: double, data_type: gauge, unit: s, description: "Age of the oldest client transaction holding a snapshot or an xid, or of the oldest prepared transaction"}
    - {metric_name: postgresql.xmin_horizon.age, value_column: xmin_horizon_age, value_type: int, data_type: gauge, unit: '{transaction}', description: "Largest age() of any xmin or xid held by a backend (walsender feedback included), a replication slot (xmin, catalog_xmin) or a prepared transaction"}
    - {metric_name: postgresql.client_connection.count, value_column: client_connection_count, value_type: int, data_type: gauge, unit: '{connection}', description: "Client backends"}
    - {metric_name: postgresql.client_connection.limit, value_column: client_connection_limit, value_type: int, data_type: gauge, unit: '{connection}', description: "max_connections minus reserved slots"}
# Wraparound: one row per database, template databases included (they are
# frozen by autovacuum like the rest). age() and mxid_age() count transactions
# and multixacts since datfrozenxid / datminmxid; both wrap at 2^31 (about 2.1
# billion), which is the denominator the rules use.
- sql: |
    SELECT datname AS "postgresql.database.name", age(datfrozenxid)::bigint AS xid_age, mxid_age(datminmxid)::bigint AS mxid_age
    FROM pg_database
  metrics:
    - {metric_name: postgresql.database.xid_age, value_column: xid_age, attribute_columns: ["postgresql.database.name"], value_type: int, data_type: gauge, unit: '{transaction}', description: "age(datfrozenxid) of the database, in transactions"}
    - {metric_name: postgresql.database.mxid_age, value_column: mxid_age, attribute_columns: ["postgresql.database.name"], value_type: int, data_type: gauge, unit: '{multixact}', description: "mxid_age(datminmxid) of the database, in multixacts"}
# Time spent idle inside a transaction, as opposed to a long running statement
# or a held snapshot (postgresql.snapshot.oldest_age): state_change is when the
# session last changed state, so for an idle session it is the moment it went
# idle. 0 when no client is idle in a transaction.
- sql: |
    SELECT coalesce(max(extract(epoch FROM clock_timestamp() - state_change)), 0)::float8 AS idle_age
    FROM pg_stat_activity
    WHERE backend_type = 'client backend'
      AND state IN ('idle in transaction', 'idle in transaction (aborted)')
      AND pid <> pg_backend_pid()
  metrics:
    - {metric_name: postgresql.transaction.idle_age, value_column: idle_age, value_type: double, data_type: gauge, unit: s, description: "Longest time a client session has been idle in a transaction (0 when none)"}
# Sessions waiting for a lock: pg_locks rows that are not granted.
# pg_locks.waitstart (PostgreSQL 14+) is when the wait began; it is not
# guaranteed to be set for every waiting row, so a NULL counts as 0
# (PostgreSQL 18 docs, view pg_locks). pg_blocking_pids() is left out on
# purpose: that would be one call per waiting backend, each taking the lock
# manager partition locks, where this is one pg_locks scan (which also takes
# them, once) per collection.
- sql: |
    SELECT
      count(DISTINCT pid)::int AS lock_waiting_session_count,
      coalesce(max(extract(epoch FROM clock_timestamp() - waitstart)), 0)::float8 AS oldest_wait_age
    FROM pg_locks
    WHERE NOT granted
  metrics:
    - {metric_name: postgresql.lock.waiting_session.count, value_column: lock_waiting_session_count, value_type: int, data_type: gauge, unit: '{session}', description: "Sessions waiting for a lock"}
    - {metric_name: postgresql.lock.oldest_wait_age, value_column: oldest_wait_age, value_type: double, data_type: gauge, unit: s, description: "Longest current lock wait (0 when none)"}
# One row per replication slot, on every node. Without a slot there is
# no series, which is no fault. The current LSN is read with
# pg_last_wal_receive_lsn() in recovery, where pg_current_wal_lsn() errors;
# a standby that never streamed has no receive LSN (NULL) and one in archive
# recovery replays past what it received, so the greater of receive and replay
# LSN is used (greatest ignores NULL), never a negative or silent 0
# wal_status as a number: 0 reserved, 1 extended, 2 unreserved, 3 lost,
# -1 none (no restart_lsn). inactive_age is 0 while the slot is active.
- sql: |
    SELECT
      (btrim(current_setting('synchronous_standby_names')) <> '')::int AS synchronous_standby_required,
      (SELECT count(*) FROM pg_stat_replication WHERE sync_state IN ('sync', 'quorum'))::int AS synchronous_standby_count
  metrics:
    - {metric_name: postgresql.replication.synchronous_standby.required, value_column: synchronous_standby_required, value_type: int, data_type: gauge, unit: "1", description: "1 when synchronous_standby_names is not empty (commits wait for a standby)"}
    - {metric_name: postgresql.replication.synchronous_standby.count, value_column: synchronous_standby_count, value_type: int, data_type: gauge, unit: '{standby}', description: "Standbys that pg_stat_replication reports as sync or quorum (0 where there are no WAL senders)"}
- sql: |
    SELECT
      slot_name AS "postgresql.replication_slot.name",
      slot_type AS "postgresql.replication_slot.type",
      active::int AS active,
      coalesce(pg_wal_lsn_diff(CASE WHEN pg_is_in_recovery() THEN greatest(pg_last_wal_receive_lsn(), pg_last_wal_replay_lsn()) ELSE pg_current_wal_lsn() END, restart_lsn), 0)::float8 AS retained_wal,
      coalesce(pg_wal_lsn_diff(CASE WHEN pg_is_in_recovery() THEN greatest(pg_last_wal_receive_lsn(), pg_last_wal_replay_lsn()) ELSE pg_current_wal_lsn() END, confirmed_flush_lsn), 0)::float8 AS unconfirmed_wal,
      CASE wal_status WHEN 'reserved' THEN 0 WHEN 'extended' THEN 1 WHEN 'unreserved' THEN 2 WHEN 'lost' THEN 3 ELSE -1 END AS wal_status,
      (invalidation_reason IS NOT NULL)::int AS invalidated,
      coalesce(invalidation_reason, '') AS "postgresql.replication_slot.invalidation_reason",
      coalesce(extract(epoch FROM clock_timestamp() - inactive_since), 0)::float8 AS inactive_age
    FROM pg_replication_slots
  metrics:
    - {metric_name: postgresql.replication_slot.active, value_column: active, attribute_columns: ["postgresql.replication_slot.name", "postgresql.replication_slot.type"], value_type: int, data_type: gauge, unit: "1", description: "1 when a process is streaming from the slot"}
    - {metric_name: postgresql.replication_slot.retained_wal, value_column: retained_wal, attribute_columns: ["postgresql.replication_slot.name", "postgresql.replication_slot.type"], value_type: double, data_type: gauge, unit: By, description: "WAL kept for the slot: current LSN minus restart_lsn"}
    - {metric_name: postgresql.replication_slot.unconfirmed_wal, value_column: unconfirmed_wal, attribute_columns: ["postgresql.replication_slot.name", "postgresql.replication_slot.type"], value_type: double, data_type: gauge, unit: By, description: "Logical slots: current LSN minus confirmed_flush_lsn (0 for physical slots)"}
    - {metric_name: postgresql.replication_slot.wal_status, value_column: wal_status, attribute_columns: ["postgresql.replication_slot.name", "postgresql.replication_slot.type"], value_type: int, data_type: gauge, unit: "1", description: "0 reserved, 1 extended, 2 unreserved, 3 lost, -1 none"}
    - {metric_name: postgresql.replication_slot.invalidated, value_column: invalidated, attribute_columns: ["postgresql.replication_slot.name", "postgresql.replication_slot.type", "postgresql.replication_slot.invalidation_reason"], value_type: int, data_type: gauge, unit: "1", description: "1 when the slot is invalidated; the reason is an attribute"}
    - {metric_name: postgresql.replication_slot.inactive_age, value_column: inactive_age, attribute_columns: ["postgresql.replication_slot.name", "postgresql.replication_slot.type"], value_type: double, data_type: gauge, unit: s, description: "Seconds since the slot became inactive (0 while active)"}
# One row per subscription, built from pg_subscription so a subscription
# without a worker still reports (apply_worker_running 0). Only subname
# and subenabled are read: subconninfo is not readable by pg_monitor.
# last_msg_age is 0 while there is no apply worker row.
- sql: |
    SELECT
      s.subname AS "postgresql.subscription.name",
      s.subenabled::int AS enabled,
      (EXISTS (SELECT 1 FROM pg_stat_subscription a WHERE a.subid = s.oid AND a.worker_type = 'apply' AND a.pid IS NOT NULL))::int AS apply_worker_running,
      coalesce((SELECT extract(epoch FROM clock_timestamp() - max(a.last_msg_receipt_time)) FROM pg_stat_subscription a WHERE a.subid = s.oid AND a.worker_type = 'apply'), 0)::float8 AS last_msg_age,
      coalesce(t.apply_error_count, 0)::bigint AS apply_errors,
      coalesce(t.sync_error_count, 0)::bigint AS sync_errors
    FROM pg_subscription s
    LEFT JOIN pg_stat_subscription_stats t ON t.subid = s.oid
  metrics:
    - {metric_name: postgresql.subscription.enabled, value_column: enabled, attribute_columns: ["postgresql.subscription.name"], value_type: int, data_type: gauge, unit: "1", description: "1 when the subscription is enabled"}
    - {metric_name: postgresql.subscription.apply_worker_running, value_column: apply_worker_running, attribute_columns: ["postgresql.subscription.name"], value_type: int, data_type: gauge, unit: "1", description: "1 when an apply worker process exists for the subscription"}
    - {metric_name: postgresql.subscription.last_msg_age, value_column: last_msg_age, attribute_columns: ["postgresql.subscription.name"], value_type: double, data_type: gauge, unit: s, description: "Seconds since the apply worker last received a message from the publisher (0 without a worker)"}
    - {metric_name: postgresql.subscription.apply_error, value_column: apply_errors, attribute_columns: ["postgresql.subscription.name"], value_type: int, data_type: sum, monotonic: true, aggregation: cumulative, unit: '{error}', description: "pg_stat_subscription_stats.apply_error_count"}
    - {metric_name: postgresql.subscription.sync_error, value_column: sync_errors, attribute_columns: ["postgresql.subscription.name"], value_type: int, data_type: sum, monotonic: true, aggregation: cumulative, unit: '{error}', description: "pg_stat_subscription_stats.sync_error_count"}
# The seven PostgreSQL 18 conflict counters as one metric.
- sql: |
    SELECT t.subname AS "postgresql.subscription.name", c.conflict_type AS "postgresql.conflict.type", c.n::bigint AS conflicts
    FROM pg_stat_subscription_stats t
    CROSS JOIN LATERAL (VALUES
      ('insert_exists', t.confl_insert_exists),
      ('update_origin_differs', t.confl_update_origin_differs),
      ('update_exists', t.confl_update_exists),
      ('update_missing', t.confl_update_missing),
      ('delete_origin_differs', t.confl_delete_origin_differs),
      ('delete_missing', t.confl_delete_missing),
      ('multiple_unique_conflicts', t.confl_multiple_unique_conflicts)
    ) AS c(conflict_type, n)
  metrics:
    - {metric_name: postgresql.subscription.conflict, value_column: conflicts, attribute_columns: ["postgresql.subscription.name", "postgresql.conflict.type"], value_type: int, data_type: sum, monotonic: true, aggregation: cumulative, unit: '{conflict}', description: "pg_stat_subscription_stats confl_* counters, by conflict type"}
# WAL archiver (pg_stat_archiver, PostgreSQL 18 docs, monitoring-stats). Not in
# postgresqlreceiver at v0.164.0 (metadata.yaml has no archiver metric).
# `failing` is the state the view's columns define: the last attempt that
# failed is newer than the last that succeeded (or none ever succeeded), so a
# transient failure clears itself and a restart of the Collector changes
# nothing. A failure that aborts the archiver process (killed by a signal, exit
# status above 125) is not counted in pg_stat_archiver (PostgreSQL 18 docs,
# 25.3.1), so the number of segments still waiting is read as well:
# pg_ls_archive_statusdir() (pg_monitor may run it) lists pg_wal/archive_status,
# where a segment waiting for the archiver is a .ready file. With archive_mode
# off there are no .ready files and the counters stay 0.
- sql: |
    SELECT
      archived_count::bigint AS archived_files,
      failed_count::bigint AS failures,
      (last_failed_time IS NOT NULL AND (last_archived_time IS NULL OR last_failed_time > last_archived_time))::int AS failing,
      (SELECT count(*) FROM pg_ls_archive_statusdir() WHERE name LIKE '%.ready')::int AS ready_files
    FROM pg_stat_archiver
  metrics:
    - {metric_name: postgresql.archiver.archived_file, value_column: archived_files, value_type: int, data_type: sum, monotonic: true, aggregation: cumulative, unit: '{file}', description: "pg_stat_archiver.archived_count: WAL files archived successfully"}
    - {metric_name: postgresql.archiver.failure, value_column: failures, value_type: int, data_type: sum, monotonic: true, aggregation: cumulative, unit: '{failure}', description: "pg_stat_archiver.failed_count: failed archive attempts"}
    - {metric_name: postgresql.archiver.failing, value_column: failing, value_type: int, data_type: gauge, unit: "1", description: "1 when the last failed archive attempt is newer than the last success"}
    - {metric_name: postgresql.archiver.ready_file.count, value_column: ready_files, value_type: int, data_type: gauge, unit: '{file}', description: "WAL files waiting for the archiver (.ready files in pg_wal/archive_status)"}
