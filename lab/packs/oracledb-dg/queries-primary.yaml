# Oracle Data Guard pack, primary-only queries: read by one sql_query receiver
# that connects to the primary only (sql_query/primary_account in
# lab/oracle/files/otelcol-obs.yaml), through the SYSDG-only user like the
# queries of queries.yaml. They are a separate file because they read a view
# that a mounted standby does not serve: SELECT FROM DBA_USERS as SYSDG on the
# mounted CDB19_STBY fails with ORA-01219 (read 2026-11-14), and a query that
# fails would log an error on every collection of the standby receiver. Like
# the oracledb receiver, this receiver stays pointed at the VM that was primary
# when the Collector started; after a failover its query fails on the old
# primary until pair.sh is edited and the Collector restarted.
# Why it exists: the oracledb receiver (C##OBENHUB_MON) and the sql_query
# receivers hold pooled sessions, so an expired or locked monitoring account
# is invisible while the pool lives and the Collector keeps scraping
# (scenario password-expired, lab/oracle/results/runs.jsonl). The account
# state is read through the other account's session (C##OBENHUB_DG), which is
# not the one that expires. DBA_USERS read from the CDB root lists the root's
# rows only, which is where the oracledb receiver connects (service CDB19).
# Names follow ADR 0006 under the receiver's namespace oracledb.*. Aliases are
# quoted so that go-ora returns them in lower case.
# Accounts: C##OBENHUB_* (a common user, as in the lab's CDBs) or OBENHUB_*
# (a database without the C## prefix, a non-CDB for one; no such account
# exists in the lab, read 2026-11-19).
# ACCOUNT_STATUS is OPEN, EXPIRED, EXPIRED(GRACE), LOCKED, LOCKED(TIMED) or
# a combination such as EXPIRED & LOCKED; everything but OPEN is value 0. The
# status is a label, so the old series lingers until staleness after a change.
- sql: |
    SELECT
      d.db_unique_name AS "oracledb.database.unique_name",
      u.username AS "oracledb.user.name",
      u.account_status AS "oracledb.user.status",
      CASE WHEN u.account_status = 'OPEN' THEN 1 ELSE 0 END AS "open"
    FROM dba_users u CROSS JOIN v$database d
    WHERE u.username LIKE 'C##OBENHUB\_%' ESCAPE '\' OR u.username LIKE 'OBENHUB\_%' ESCAPE '\'
  metrics:
    - {metric_name: oracledb.user.open, value_column: open, attribute_columns: ["oracledb.database.unique_name", "oracledb.user.name", "oracledb.user.status"], value_type: int, data_type: gauge, unit: "1", description: "1 when the account status of a project monitoring account is OPEN, 0 when it is expired, in grace or locked"}
# Oldest lock wait: the longest time a session has been waiting on another
# session, in seconds, 0 when none; the Oracle counterpart of
# postgresql.lock.oldest_wait_age. Why a query: oracledbreceiver (contrib
# v0.164.0) has no such metric (metadata.yaml at that tag, read 2026-11-15 UTC:
# oracledb.lock.time is a cumulative sum of the "transaction lock foreground
# wait time" statistic, off by default; oracledb.dml_locks.* and
# oracledb.enqueue_* count usage and deadlocks; the blocking attributes belong
# to the disabled db.server.query_sample log event, not to a metric).
# V$SESSION, Oracle Database 19c Database Reference, 9.17 V$SESSION
# (https://docs.oracle.com/en/database/oracle/oracle-database/19/refrn/V-SESSION.html,
# fetched 2026-11-15 UTC): BLOCKING_SESSION is the session identifier of the
# blocking session; WAIT_TIME_MICRO is "if the session is currently waiting,
# then the value is the time spent in the current wait"; SECONDS_IN_WAIT "has
# been deprecated in favor of the columns WAIT_TIME_MICRO and
# TIME_SINCE_LAST_WAIT_MICRO"; STATE WAITING means the session is currently
# waiting. WAIT_CLASS 'Application' is the class seen live for the lock wait
# (enq: TX - row lock contention); that it covers row and table lock waits
# generally, and that other classes carry a blocker only for short internal
# contention (buffer busy waits, library cache locks, ITL allocation), is
# unconfirmed: from memory, not read in the Reference. Only the row lock wait
# was exercised. In a manual probe on 2026-11-15 UTC (not a recorded run) the
# value kept growing across the 3 s timeouts of the enqueue wait (20 s after
# 25 s of holding).
# Read from the CDB root: V$SESSION lists the sessions of every container
# there (CON_ID 3, PDB19, seen as C##OBENHUB_DG with SYSDG and as
# C##OBENHUB_MON in that manual probe, which is not a recorded run; the
# scenario's runs read it as C##OBENHUB_DG only through the Collector), so no
# CONTAINER_DATA setting is changed.
# One row and one value for the whole CDB; the container of the waiter is not
# a label. Primary only, like the account query above: the scenario and the
# rule are about the primary.
- sql: |
    SELECT
      d.db_unique_name AS "oracledb.database.unique_name",
      (SELECT NVL(MAX(s.wait_time_micro) / 1000000, 0)
        FROM v$session s
        WHERE s.blocking_session IS NOT NULL
          AND s.state = 'WAITING'
          AND s.wait_class = 'Application') AS "oldest_wait_age"
    FROM v$database d
  metrics:
    - {metric_name: oracledb.lock.oldest_wait_age, value_column: oldest_wait_age, attribute_columns: ["oracledb.database.unique_name"], value_type: double, data_type: gauge, unit: s, description: "Longest current wait of a session for a lock held by another session (V$SESSION, wait class Application, all containers), 0 when none"}
