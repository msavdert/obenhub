      - eval_time: 3m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []
      - eval_time: 3m30s
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []
      - eval_time: 4m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []
      - eval_time: 10m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []

  # 273/320 = 0.853 and 303/320 = 0.947 are warning, 272/320 = 0.85 exactly is neither tier, 304/320 = 0.95 exactly belongs to critical.
  - name: "processes: tier boundaries, 272 of 320 is 0.85 and stays quiet, 304 is 0.95 and is critical"
    interval: 30s
    input_series:
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="a-272"}'
        values: '272x40'
