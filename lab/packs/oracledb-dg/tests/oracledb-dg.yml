            exp_annotations:
              summary: 'Oracle instance c-303 uses more than 85% of its PROCESSES limit'
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: d-304, severity: critical}
            exp_annotations:
              summary: 'Oracle instance d-304 uses 95% or more of its PROCESSES limit: new logins fail with ORA-00020'

  - name: "processes: an instance with no limit series, or no usage series, is quiet"
    interval: 30s
    input_series:
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="only-usage"}'
        values: '320x40'
      - series: 'oracledb.processes.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="only-limit"}'
        values: '320x40'
    alert_rule_test:
