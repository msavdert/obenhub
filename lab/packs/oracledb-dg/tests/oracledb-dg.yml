  # The oracledb receiver reads the role and open mode once at start, and the
  # series carry them as labels, so a restarted Collector can leave two series
  # of one instance side by side until the old one goes stale. The rule takes
  # max by (service.instance.id, obenhub.cluster.name) of each side; without
  # it the division matches many series to many and nothing fires.
  - name: "processes: two series of one instance that differ in role and open mode give one alert"
    interval: 30s
    input_series:
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracle.db.role="PHYSICAL STANDBY",oracle.db.open_mode="MOUNTED"}'
        values: '80x40'
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracle.db.role="PRIMARY",oracle.db.open_mode="READ WRITE"}'
        values: '320x40'
      - series: 'oracledb.processes.limit{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracle.db.role="PHYSICAL STANDBY",oracle.db.open_mode="MOUNTED"}'
        values: '320x40'
      - series: 'oracledb.processes.limit{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracle.db.role="PRIMARY",oracle.db.open_mode="READ WRITE"}'
        values: '320x40'
    alert_rule_test:
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: critical}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses 95% or more of its PROCESSES limit: new logins fail with ORA-00020'

  # OracleTablespaceUsageHigh. oracledb.tablespace_size.* come from the
  # oracledb receiver (30s collection), in bytes; the lab Collector adds
  # oracle.db.pdb (CDB$ROOT for the root). Labels are reduced to the ones the
  # rule keeps. 20971520 is the 20 MB tablespace of scenario tablespace-full,
  # 34359721984 the 32 GiB autoextend limit of the lab's root tablespaces
  # (read 2026-11-14). The window of the rule is 90s, three points of 30s.

  - name: "tablespace: healthy tablespaces, a small and an autoextend one, are quiet"
    interval: 30s
    input_series:
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="SYSTEM",oracle.db.pdb="CDB$ROOT"}'
        values: '1560000000x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="SYSTEM",oracle.db.pdb="CDB$ROOT"}'
        values: '34359721984x40'
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="OBENHUB_FILL",oracle.db.pdb="PDB19"}'
        values: '1048576x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="OBENHUB_FILL",oracle.db.pdb="PDB19"}'
        values: '20971520x40'
    alert_rule_test:
      - eval_time: 19m
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []

  # The first sample near full is at 2m30 and the critical tier is up from 4m
  # (the window of 90s must hold three points at or above 0.95); the first
  # sample back at 0 (the segment dropped, the tablespace still there) is at
  # 7m and the alert is gone from 8m. SYSTEM of the same PDB stays quiet.
  - name: "tablespace: a full tablespace fires critical for it alone and resolves when emptied"
    interval: 30s
    input_series:
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="OBENHUB_FILL",oracle.db.pdb="PDB19"}'
        values: '1048576x5 20447232x9 0x30'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="OBENHUB_FILL",oracle.db.pdb="PDB19"}'
        values: '20971520x44'
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="SYSTEM",oracle.db.pdb="PDB19"}'
        values: '830000000x44'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="SYSTEM",oracle.db.pdb="PDB19"}'
        values: '34359721984x44'
    alert_rule_test:
      - eval_time: 2m15s
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []
      - eval_time: 3m45s
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []
      - eval_time: 4m
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, tablespace_name: OBENHUB_FILL, oracle.db.pdb: PDB19, severity: critical}
            exp_annotations:
              summary: 'Tablespace OBENHUB_FILL (PDB19) of Oracle instance CDB19 is 95% or more full of its maximum size: at 100% a segment that needs a new extent fails with ORA-01653'
      - eval_time: 7m45s
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, tablespace_name: OBENHUB_FILL, oracle.db.pdb: PDB19, severity: critical}
            exp_annotations:
              summary: 'Tablespace OBENHUB_FILL (PDB19) of Oracle instance CDB19 is 95% or more full of its maximum size: at 100% a segment that needs a new extent fails with ORA-01653'
      - eval_time: 8m
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []

  # The same tablespace name in the root and in a PDB is two series (with
  # oracle.db.pdb); only the full one alerts.
  - name: "tablespace: the same name in the root and in a PDB, only the full one alerts"
    interval: 30s
    input_series:
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="USERS",oracle.db.pdb="CDB$ROOT"}'
        values: '2800000x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="USERS",oracle.db.pdb="CDB$ROOT"}'
        values: '34359721984x40'
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="USERS",oracle.db.pdb="PDB19"}'
        values: '33000000000x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="USERS",oracle.db.pdb="PDB19"}'
        values: '34359721984x40'
    alert_rule_test:
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, tablespace_name: USERS, oracle.db.pdb: PDB19, severity: critical}
            exp_annotations:
              summary: 'Tablespace USERS (PDB19) of Oracle instance CDB19 is 95% or more full of its maximum size: at 100% a segment that needs a new extent fails with ORA-01653'

  # Tier boundaries on 20 MB (20971520 bytes): 0.85 is 17825792 (stays quiet,
  # the warning is strictly above), one block of 8 KiB more is warning, 0.95
  # is 19922944 (critical), one block less is warning; an unlimited
  # tablespace (-1) gives a negative ratio and is quiet.
  - name: "tablespace: tier boundaries, 0.85 is quiet, 0.95 is critical, limit -1 is quiet"
    interval: 30s
    input_series:
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="T_085",oracle.db.pdb="PDB19"}'
        values: '17825792x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="T_085",oracle.db.pdb="PDB19"}'
        values: '20971520x40'
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="T_085_PLUS",oracle.db.pdb="PDB19"}'
        values: '17833984x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="T_085_PLUS",oracle.db.pdb="PDB19"}'
        values: '20971520x40'
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="T_095_MINUS",oracle.db.pdb="PDB19"}'
        values: '19914752x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="T_095_MINUS",oracle.db.pdb="PDB19"}'
        values: '20971520x40'
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="T_095",oracle.db.pdb="PDB19"}'
        values: '19922944x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="T_095",oracle.db.pdb="PDB19"}'
        values: '20971520x40'
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="T_UNLIMITED",oracle.db.pdb="PDB19"}'
        values: '900000000x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="T_UNLIMITED",oracle.db.pdb="PDB19"}'
        values: '-1x40'
    alert_rule_test:
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, tablespace_name: T_085_PLUS, oracle.db.pdb: PDB19, severity: warning}
            exp_annotations:
              summary: 'Tablespace T_085_PLUS (PDB19) of Oracle instance CDB19 is more than 85% full of its maximum size'
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, tablespace_name: T_095_MINUS, oracle.db.pdb: PDB19, severity: warning}
            exp_annotations:
              summary: 'Tablespace T_095_MINUS (PDB19) of Oracle instance CDB19 is more than 85% full of its maximum size'
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, tablespace_name: T_095, oracle.db.pdb: PDB19, severity: critical}
            exp_annotations:
              summary: 'Tablespace T_095 (PDB19) of Oracle instance CDB19 is 95% or more full of its maximum size: at 100% a segment that needs a new extent fails with ORA-01653'

  # The series starts full (a new tablespace, or a restarted Collector): the
  # window of 90s holds one point at 15s, two at 30s and 45s, three at 1m, and
  # the alert waits for the third (the guard n >= 3 of the rule).
  - name: "tablespace: warm-up, a new series at 0.99 stays quiet until its window is full"
    interval: 30s
    input_series:
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="OBENHUB_FILL",oracle.db.pdb="PDB19"}'
        values: '20762000x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="OBENHUB_FILL",oracle.db.pdb="PDB19"}'
        values: '20971520x40'
    alert_rule_test:
      - eval_time: 15s
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []
      - eval_time: 30s
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []
      - eval_time: 45s
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []
      - eval_time: 1m
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, tablespace_name: OBENHUB_FILL, oracle.db.pdb: PDB19, severity: critical}
            exp_annotations:
              summary: 'Tablespace OBENHUB_FILL (PDB19) of Oracle instance CDB19 is 95% or more full of its maximum size: at 100% a segment that needs a new extent fails with ORA-01653'

  - name: "tablespace: warm-up, a new series at 0.90 stays quiet until its window is full"
    interval: 30s
    input_series:
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="OBENHUB_FILL",oracle.db.pdb="PDB19"}'
        values: '18874368x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="OBENHUB_FILL",oracle.db.pdb="PDB19"}'
        values: '20971520x40'
    alert_rule_test:
      - eval_time: 15s
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []
      - eval_time: 30s
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []
      - eval_time: 45s
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []
      - eval_time: 1m
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, tablespace_name: OBENHUB_FILL, oracle.db.pdb: PDB19, severity: warning}
            exp_annotations:
              summary: 'Tablespace OBENHUB_FILL (PDB19) of Oracle instance CDB19 is more than 85% full of its maximum size'

  # One collection near full does not fire: the window needs three points.
  - name: "tablespace: one collection near full does not fire"
    interval: 30s
    input_series:
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="OBENHUB_FILL",oracle.db.pdb="PDB19"}'
        values: '1048576x5 20447232 1048576x34'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="OBENHUB_FILL",oracle.db.pdb="PDB19"}'
        values: '20971520x40'
    alert_rule_test:
      - eval_time: 2m30s
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []
      - eval_time: 3m
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []
      - eval_time: 4m
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []

  # A tablespace that has usage and no limit series (or the reverse) is quiet.
  - name: "tablespace: usage without a limit series, or a limit without usage, is quiet"
    interval: 30s
    input_series:
      - series: 'oracledb.tablespace_size.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="ONLY_USAGE",oracle.db.pdb="PDB19"}'
        values: '20971520x40'
      - series: 'oracledb.tablespace_size.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19",tablespace_name="ONLY_LIMIT",oracle.db.pdb="PDB19"}'
        values: '20971520x40'
    alert_rule_test:
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleTablespaceUsageHigh
        exp_alerts: []

  # OracleBlockedSessions. oracledb.lock.oldest_wait_age is the sql_query of
  # queries-primary.yaml (15s collection, seconds, one series per database, 0
  # when no session waits for a lock). The rule needs the lowest of three 15s
  # points above 30 s, so the wait is above 30 s at each of them.

  - name: "blocked sessions: no waiting session, and waits at or below 30 s, are quiet"
    interval: 15s
    input_series:
      - series: 'oracledb.lock.oldest_wait_age{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab"}'
        values: '0x80'
      - series: 'oracledb.lock.oldest_wait_age{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19B",service.instance.id="CDB19B",service.name="oracledb",service.namespace="obenhub-lab"}'
        values: '30x80'
    alert_rule_test:
      - eval_time: 20m
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts: []

  # The wait starts at 2m15 (5 s old at its first sample) and grows by one
  # collection step per sample. The lowest of three points is above 30 s from
  # 3m15 (values 35, 50, 65 at 2m45, 3m, 3m15); the last value is 305 s at
  # 7m15, and the first 0 at 7m30 takes the alert away at once.
  - name: "blocked sessions: a growing wait fires for its instance and resolves when it ends"
    interval: 15s
    input_series:
      - series: 'oracledb.lock.oldest_wait_age{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab"}'
        values: '0x8 5+15x20 0x40'
    alert_rule_test:
      - eval_time: 2m45s
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts: []
      - eval_time: 3m
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts: []
      - eval_time: 3m15s
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'A session on Oracle instance CDB19 has waited 35s for a lock held by another session (lab threshold)'
      - eval_time: 7m
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'A session on Oracle instance CDB19 has waited 4m 20s for a lock held by another session (lab threshold)'
      - eval_time: 7m15s
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'A session on Oracle instance CDB19 has waited 4m 35s for a lock held by another session (lab threshold)'
      - eval_time: 7m30s
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts: []

  # The boundary: 30 s is quiet (above 30), 31 s fires.
  - name: "blocked sessions: tier boundary, 30 s is quiet and 31 s fires"
    interval: 15s
    input_series:
      - series: 'oracledb.lock.oldest_wait_age{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab"}'
        values: '30x40'
      - series: 'oracledb.lock.oldest_wait_age{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19B",service.instance.id="CDB19B",service.name="oracledb",service.namespace="obenhub-lab"}'
        values: '31x40'
    alert_rule_test:
      - eval_time: 9m
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19B, severity: warning}
            exp_annotations:
              summary: 'A session on Oracle instance CDB19B has waited 31s for a lock held by another session (lab threshold)'

  # The series starts above the threshold (a new series, or a restarted
  # Collector): the window of 45s holds one point at 0s, two at 15s, three
  # from 30s, and the alert waits for the third (the guard n >= 3).
  - name: "blocked sessions: warm-up, a new series at 90 s stays quiet until its window is full"
    interval: 15s
    input_series:
      - series: 'oracledb.lock.oldest_wait_age{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab"}'
        values: '90x40'
    alert_rule_test:
      - eval_time: 0s
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts: []
      - eval_time: 15s
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts: []
      - eval_time: 30s
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'A session on Oracle instance CDB19 has waited 1m 30s for a lock held by another session (lab threshold)'

  # One or two collections above 30 s between zeros do not fire: the lowest
  # point of the window is 0.
  - name: "blocked sessions: one or two collections above 30 s do not fire"
    interval: 15s
    input_series:
      - series: 'oracledb.lock.oldest_wait_age{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab"}'
        values: '0x8 90 0x8 90 90 0x30'
    alert_rule_test:
      - eval_time: 2m15s
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts: []
      - eval_time: 2m30s
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts: []
      - eval_time: 4m45s
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts: []
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts: []
      - eval_time: 5m15s
        groupname: oracledb-dg
        alertname: OracleBlockedSessions
        exp_alerts: []
