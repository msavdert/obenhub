        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []
      - eval_time: 30s
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []
      - eval_time: 45s
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []
      - eval_time: 1m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses more than 85% of its PROCESSES limit'

  - name: "processes: one collection at the limit does not fire"
    interval: 30s
    input_series:
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19"}'
        values: '80x5 320 80x38'
