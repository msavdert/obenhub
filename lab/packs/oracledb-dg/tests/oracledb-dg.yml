      - series: 'oracledb.dataguard.protection.degraded{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY",oracledb.dataguard.protection_mode="MAXIMUM AVAILABILITY",oracledb.dataguard.protection_level="MAXIMUM AVAILABILITY"}'
        values: '0x60'
      - series: 'oracledb.fast_start_failover.enabled{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY"}'
        values: '1x60'
      - series: 'oracledb.fast_start_failover.synchronized{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY",oracledb.fast_start_failover.status="SYNCHRONIZED"}'
        values: '1x60'
      - series: 'oracledb.fast_start_failover.observer_present{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY"}'
        values: '1x60'
      - series: 'oracledb.database.primary{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19",oracledb.database.role="PRIMARY"}'
        values: '1x60'
      - series: 'oracledb.database.open{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19",oracledb.database.open_mode="READ WRITE"}'
        values: '1x60'
      - series: 'oracledb.database.primary{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY",oracledb.database.role="PHYSICAL STANDBY"}'
        values: '0x60'
      - series: 'oracledb.database.open{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY",oracledb.database.open_mode="MOUNTED"}'
        values: '0x60'
      - series: 'otelcol_process_uptime{service.instance.id="otelcol-ora-dg-obs",service.namespace="obenhub-lab"}'
        values: '1x60'
      - series: 'oracledb.dataguard.lag{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY",oracledb.dataguard.lag.type="apply"}'
        values: '0x60'
      - series: 'oracledb.dataguard.lag.data_age{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY",oracledb.dataguard.lag.type="apply"}'
        values: '1x60'
      - series: 'oracledb.dataguard.lag{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY",oracledb.dataguard.lag.type="transport"}'
        values: '0x60'
      - series: 'oracledb.dataguard.lag.data_age{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY",oracledb.dataguard.lag.type="transport"}'
        values: '1x60'
      - series: 'oracledb.dataguard.apply.running{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY"}'
        values: '1x60'
      - series: 'oracledb.dataguard.missing_log.count{obenhub.cluster.name="cdb19",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19_STBY"}'
        values: '0x60'
      - series: 'oracledb.archive_dest.valid{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19",oracledb.archive_dest.id="2",oracledb.archive_dest.destination="cdb19_stby",oracledb.archive_dest.status="ERROR"}'
        values: '0x20 _x40'
      - series: 'oracledb.archive_dest.gapped{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19",oracledb.archive_dest.id="2",oracledb.archive_dest.destination="cdb19_stby",oracledb.archive_dest.gap_status="NONE"}'
        values: '0x60'
      - series: 'oracledb.archive_dest.valid{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19",oracledb.archive_dest.id="2",oracledb.archive_dest.destination="cdb19_stby",oracledb.archive_dest.status="VALID"}'
        values: '_x21 1x39'
    alert_rule_test:
      - eval_time: 4m
        groupname: oracledb-dg
        alertname: OracleRedoDestinationInvalid
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, service.name: oracledb, service.namespace: obenhub-lab, oracledb.database.unique_name: CDB19, oracledb.archive_dest.id: 2, oracledb.archive_dest.destination: cdb19_stby, oracledb.archive_dest.status: ERROR, severity: critical}
            exp_annotations:
              summary: "Archive destination 2 (cdb19_stby) of CDB19 is ERROR"
      - eval_time: 7m
        groupname: oracledb-dg
        alertname: OracleRedoDestinationInvalid
        exp_alerts: []

  # The local archive destination (destination 1, TYPE LOCAL), listed by the
  # query since the archiver-stuck scenario. Labels as read from the lab on
  # 2026-11-15 UTC: the destination is the archive directory, GAP_STATUS is
  # empty (NONE, gap 0). Only the series the two rules read are given.
  - name: "a local archive destination in ERROR fires OracleRedoDestinationInvalid on that database only"
    interval: 15s
    input_series:
      # CDB19 (primary): local destination VALID for 1 minute, then ERROR; the remote one stays VALID
      - series: 'oracledb.archive_dest.valid{service.instance.id="CDB19",oracledb.database.unique_name="CDB19",oracledb.archive_dest.id="1",oracledb.archive_dest.destination="/u01/app/oracle/product/19.0.0/dbhome_2/dbs/arch",oracledb.archive_dest.status="VALID"}'
        values: '1x4 _x60'
      - series: 'oracledb.archive_dest.valid{service.instance.id="CDB19",oracledb.database.unique_name="CDB19",oracledb.archive_dest.id="1",oracledb.archive_dest.destination="/u01/app/oracle/product/19.0.0/dbhome_2/dbs/arch",oracledb.archive_dest.status="ERROR"}'
        values: '_x4 0x60'
      - series: 'oracledb.archive_dest.gapped{service.instance.id="CDB19",oracledb.database.unique_name="CDB19",oracledb.archive_dest.id="1",oracledb.archive_dest.destination="/u01/app/oracle/product/19.0.0/dbhome_2/dbs/arch",oracledb.archive_dest.gap_status="NONE"}'
        values: '0x64'
      - series: 'oracledb.archive_dest.valid{service.instance.id="CDB19",oracledb.database.unique_name="CDB19",oracledb.archive_dest.id="2",oracledb.archive_dest.destination="cdb19_stby",oracledb.archive_dest.status="VALID"}'
        values: '1x64'
      - series: 'oracledb.archive_dest.gapped{service.instance.id="CDB19",oracledb.database.unique_name="CDB19",oracledb.archive_dest.id="2",oracledb.archive_dest.destination="cdb19_stby",oracledb.archive_dest.gap_status="NO GAP"}'
        values: '0x64'
      # CDB19_STBY (mounted standby): its own local destination stays VALID
      - series: 'oracledb.archive_dest.valid{service.instance.id="CDB19_STBY",oracledb.database.unique_name="CDB19_STBY",oracledb.archive_dest.id="1",oracledb.archive_dest.destination="/u01/app/oracle/product/19.0.0/dbhome_2/dbs/arch",oracledb.archive_dest.status="VALID"}'
        values: '1x64'
      - series: 'oracledb.archive_dest.gapped{service.instance.id="CDB19_STBY",oracledb.database.unique_name="CDB19_STBY",oracledb.archive_dest.id="1",oracledb.archive_dest.destination="/u01/app/oracle/product/19.0.0/dbhome_2/dbs/arch",oracledb.archive_dest.gap_status="NONE"}'
        values: '0x64'
    alert_rule_test:
      - eval_time: 45s   # all destinations VALID or just changed: quiet
        groupname: oracledb-dg
        alertname: OracleRedoDestinationInvalid
        exp_alerts: []
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleRedoDestinationInvalid
        exp_alerts:
          - exp_labels: {service.instance.id: CDB19, oracledb.database.unique_name: CDB19, oracledb.archive_dest.id: 1, oracledb.archive_dest.destination: /u01/app/oracle/product/19.0.0/dbhome_2/dbs/arch, oracledb.archive_dest.status: ERROR, severity: critical}
            exp_annotations:
              summary: "Archive destination 1 (/u01/app/oracle/product/19.0.0/dbhome_2/dbs/arch) of CDB19 is ERROR"
      - eval_time: 5m   # a local row with no gap status is no gap
        groupname: oracledb-dg
        alertname: OracleRedoGap
        exp_alerts: []

  - name: "local destinations VALID on both databases leave both destination rules quiet"
    interval: 15s
    input_series:
      - series: 'oracledb.archive_dest.valid{service.instance.id="CDB19",oracledb.database.unique_name="CDB19",oracledb.archive_dest.id="1",oracledb.archive_dest.destination="/u01/app/oracle/product/19.0.0/dbhome_2/dbs/arch",oracledb.archive_dest.status="VALID"}'
        values: '1x60'
      - series: 'oracledb.archive_dest.gapped{service.instance.id="CDB19",oracledb.database.unique_name="CDB19",oracledb.archive_dest.id="1",oracledb.archive_dest.destination="/u01/app/oracle/product/19.0.0/dbhome_2/dbs/arch",oracledb.archive_dest.gap_status="NONE"}'
        values: '0x60'
      - series: 'oracledb.archive_dest.valid{service.instance.id="CDB19_STBY",oracledb.database.unique_name="CDB19_STBY",oracledb.archive_dest.id="1",oracledb.archive_dest.destination="/u01/app/oracle/product/19.0.0/dbhome_2/dbs/arch",oracledb.archive_dest.status="VALID"}'
        values: '1x60'
      - series: 'oracledb.archive_dest.gapped{service.instance.id="CDB19_STBY",oracledb.database.unique_name="CDB19_STBY",oracledb.archive_dest.id="1",oracledb.archive_dest.destination="/u01/app/oracle/product/19.0.0/dbhome_2/dbs/arch",oracledb.archive_dest.gap_status="NONE"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        groupname: oracledb-dg
        alertname: OracleRedoDestinationInvalid
        exp_alerts: []
      - eval_time: 10m
        groupname: oracledb-dg
        alertname: OracleRedoGap
        exp_alerts: []

  # Listener probe (tcpcheck receiver on ora-dg-obs). Series carry the labels
  # read from the Oracle lab VictoriaMetrics on 2026-11-14 (resource
  # attributes of the pipeline plus tcpcheck.endpoint); the failing value 0 is
  # from the receiver source (scraper.go) and an isolated container, not yet
  # from a lab scenario.

  - name: "listener probe: both connect, quiet"
    interval: 15s
    input_series:
      - series: 'tcpcheck.status{db.system.name="oracle.db",obenhub.cluster.name="cdb19",server.address="ora-au-lab",server.port="1521",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",tcpcheck.endpoint="ora-au-lab.lab.local:1521"}'
        values: '1x60'
      - series: 'tcpcheck.status{db.system.name="oracle.db",obenhub.cluster.name="cdb19",server.address="ora-dg-stby",server.port="1521",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",tcpcheck.endpoint="ora-dg-stby.lab.local:1521"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 10m
        groupname: oracledb-dg
        alertname: OracleListenerUnreachable
        exp_alerts: []

  - name: "listener probe: standby listener refuses from minute 2 to 8, fires after the hold, resolves"
    interval: 15s
    input_series:
      - series: 'tcpcheck.status{db.system.name="oracle.db",obenhub.cluster.name="cdb19",server.address="ora-au-lab",server.port="1521",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",tcpcheck.endpoint="ora-au-lab.lab.local:1521"}'
        values: '1x60'
      - series: 'tcpcheck.status{db.system.name="oracle.db",obenhub.cluster.name="cdb19",server.address="ora-dg-stby",server.port="1521",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",tcpcheck.endpoint="ora-dg-stby.lab.local:1521"}'
        values: '1x8 0x24 1x28'
    alert_rule_test:
      - eval_time: 2m45s
        groupname: oracledb-dg
        alertname: OracleListenerUnreachable
        exp_alerts: []
      - eval_time: 4m
        groupname: oracledb-dg
        alertname: OracleListenerUnreachable
        exp_alerts:
          - exp_labels: {db.system.name: oracle.db, obenhub.cluster.name: cdb19, server.address: ora-dg-stby, server.port: 1521, service.instance.id: CDB19_STBY, service.name: oracledb, service.namespace: obenhub-lab, tcpcheck.endpoint: ora-dg-stby.lab.local:1521, severity: critical}
            exp_annotations:
              summary: "Oracle listener ora-dg-stby.lab.local:1521 does not accept TCP connections"
      - eval_time: 9m
        groupname: oracledb-dg
        alertname: OracleListenerUnreachable
        exp_alerts: []

  - name: "listener probe: one failed collection does not fire"
    interval: 15s
    input_series:
      - series: 'tcpcheck.status{db.system.name="oracle.db",obenhub.cluster.name="cdb19",server.address="ora-au-lab",server.port="1521",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",tcpcheck.endpoint="ora-au-lab.lab.local:1521"}'
        values: '1x8 0 1x51'
    alert_rule_test:
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleListenerUnreachable
        exp_alerts: []

  - name: "listener probe: Collector dies after 4 failed collections (down since 2m00, last sample 2m45): the last 0 completes the hold, the alert fires at 3m00 and the condition is gone at 3m15"
    interval: 15s
    input_series:
      - series: 'tcpcheck.status{db.system.name="oracle.db",obenhub.cluster.name="cdb19",server.address="ora-au-lab",server.port="1521",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",tcpcheck.endpoint="ora-au-lab.lab.local:1521"}'
        values: '1x7 0x3 _x52'
    alert_rule_test:
      - eval_time: 2m45s
        groupname: oracledb-dg
        alertname: OracleListenerUnreachable
        exp_alerts: []
      - eval_time: 3m
        groupname: oracledb-dg
        alertname: OracleListenerUnreachable
        exp_alerts:
          - exp_labels: {db.system.name: oracle.db, obenhub.cluster.name: cdb19, server.address: ora-au-lab, server.port: 1521, service.instance.id: CDB19, service.name: oracledb, service.namespace: obenhub-lab, tcpcheck.endpoint: ora-au-lab.lab.local:1521, severity: critical}
            exp_annotations:
              summary: "Oracle listener ora-au-lab.lab.local:1521 does not accept TCP connections"
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleListenerUnreachable
        exp_alerts: []
    # vmalert keeps a resolved alert listed for 1m, so the end is read from
    # the condition: non-empty at 3m00, empty at 3m15. The expression below
    # is a copy of the rule's, so it does not guard the rule's window width.
    metricsql_expr_test:
      - expr: last_over_time(tcpcheck.status[30s]) == 0
        eval_time: 3m
        exp_samples:
          - labels: '{__name__="tcpcheck.status",db.system.name="oracle.db",obenhub.cluster.name="cdb19",server.address="ora-au-lab",server.port="1521",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",tcpcheck.endpoint="ora-au-lab.lab.local:1521"}'
            value: 0
      - expr: last_over_time(tcpcheck.status[30s]) == 0
        eval_time: 3m15s
        exp_samples: []

  - name: "listener probe: Collector dies while the alert fires, the condition ends within 30s of the last sample"
    interval: 15s
    input_series:
      - series: 'tcpcheck.status{db.system.name="oracle.db",obenhub.cluster.name="cdb19",server.address="ora-dg-stby",server.port="1521",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",tcpcheck.endpoint="ora-dg-stby.lab.local:1521"}'
        values: '1x7 0x39 _x12'
    alert_rule_test:
      - eval_time: 11m45s
        groupname: oracledb-dg
        alertname: OracleListenerUnreachable
        exp_alerts:
          - exp_labels: {db.system.name: oracle.db, obenhub.cluster.name: cdb19, server.address: ora-dg-stby, server.port: 1521, service.instance.id: CDB19_STBY, service.name: oracledb, service.namespace: obenhub-lab, tcpcheck.endpoint: ora-dg-stby.lab.local:1521, severity: critical}
            exp_annotations:
              summary: "Oracle listener ora-dg-stby.lab.local:1521 does not accept TCP connections"
      - eval_time: 13m
        groupname: oracledb-dg
        alertname: OracleListenerUnreachable
        exp_alerts: []
    # vmalert keeps a resolved alert listed for 1m, so the 15s resolution is
    # read from the condition itself: empty at 12m15, 30s after the last sample.
    metricsql_expr_test:
      - expr: last_over_time(tcpcheck.status[30s]) == 0
        eval_time: 11m45s
        exp_samples:
          - labels: '{__name__="tcpcheck.status",db.system.name="oracle.db",obenhub.cluster.name="cdb19",server.address="ora-dg-stby",server.port="1521",service.instance.id="CDB19_STBY",service.name="oracledb",service.namespace="obenhub-lab",tcpcheck.endpoint="ora-dg-stby.lab.local:1521"}'
            value: 0
      - expr: last_over_time(tcpcheck.status[30s]) == 0
        eval_time: 12m15s
        exp_samples: []

  - name: "monitoring accounts: both OPEN, quiet"
    interval: 15s
    input_series:
      - series: 'oracledb.user.open{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.user.name="C##OBENHUB_MON",oracledb.user.status="OPEN"}'
        values: '1x60'
      - series: 'oracledb.user.open{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.user.name="C##OBENHUB_DG",oracledb.user.status="OPEN"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 10m
        groupname: oracledb-dg
        alertname: OracleMonitoringAccountNotOpen
        exp_alerts: []

  - name: "monitoring accounts: C##OBENHUB_MON expires at 2m15 and is restored at 8m30, fires after the hold, resolves"
    interval: 15s
    input_series:
      - series: 'oracledb.user.open{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.user.name="C##OBENHUB_MON",oracledb.user.status="OPEN"}'
        values: '1x8 _x24 1x20'
      - series: 'oracledb.user.open{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.user.name="C##OBENHUB_MON",oracledb.user.status="EXPIRED"}'
        values: '_x8 0x24'
      - series: 'oracledb.user.open{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.user.name="C##OBENHUB_DG",oracledb.user.status="OPEN"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 2m45s
        groupname: oracledb-dg
        alertname: OracleMonitoringAccountNotOpen
        exp_alerts: []
      - eval_time: 3m30s
        groupname: oracledb-dg
        alertname: OracleMonitoringAccountNotOpen
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, oracledb.database.unique_name: CDB19, oracledb.user.name: "C##OBENHUB_MON", oracledb.user.status: "EXPIRED", service.instance.id: CDB19, service.name: oracledb, service.namespace: obenhub-lab, severity: critical}
            exp_annotations:
              summary: "Monitoring account C##OBENHUB_MON on CDB19 is EXPIRED"
      - eval_time: 11m
        groupname: oracledb-dg
        alertname: OracleMonitoringAccountNotOpen
        exp_alerts: []

  - name: "monitoring accounts: C##OBENHUB_DG locked for the rest of the run, fires after the hold"
    interval: 15s
    input_series:
      - series: 'oracledb.user.open{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.user.name="C##OBENHUB_MON",oracledb.user.status="OPEN"}'
        values: '1x60'
      - series: 'oracledb.user.open{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.user.name="C##OBENHUB_DG",oracledb.user.status="OPEN"}'
        values: '1x8 _x52'
      - series: 'oracledb.user.open{obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.user.name="C##OBENHUB_DG",oracledb.user.status="LOCKED(TIMED)"}'
        values: '_x8 0x52'
    alert_rule_test:
