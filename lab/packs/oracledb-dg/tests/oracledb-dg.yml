        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []

  # Usage 300 of 320 (0.9375) until 4m45, 310 (0.969) from 5m. The warning is up from 1m (the window of the first 300s), the critical tier replaces it at 6m30, 90s after the first sample at 310.
  - name: "processes: escalation from 0.94 to 0.97, one tier at every evaluation"
    interval: 30s
    input_series:
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19"}'
