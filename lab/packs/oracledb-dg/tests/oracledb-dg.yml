# One or more test groups per rule of lab/packs/oracledb-dg/rules.yml, with the
# Oracle lab inventory (the Collector otelcol-ora-dg-obs, the databases CDB19
# and CDB19_STBY). Series shapes follow the VictoriaMetrics of the Oracle lab
# read on 2026-11-13 (labels reduced to the ones the rules use); a healthy pair
# is the base of every case and a case changes one series. A role change is a
# new series under a new role label next to the old one, as after a switchover
# (the old one ends, the new one starts at the next sample); the old series'
# lingering past its last sample is not simulated. Generated once with a
# throwaway script, kept as plain YAML. No lab scenario has produced these
# shapes yet.
rule_files:
  - ../rules.yml
  - ../../../oracle/mon/vmalert/inventory.yml
evaluation_interval: 15s

tests:
  - name: "healthy pair: every rule is quiet"
    interval: 15s
    input_series:
      - series: 'oracledb.collection.heartbeat{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab"}'
        values: '1x60'
      - series: 'oracledb.dataguard.protection.degraded{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19",oracledb.dataguard.protection_mode="MAXIMUM AVAILABILITY",oracledb.dataguard.protection_level="MAXIMUM AVAILABILITY"}'
