      - series: 'oracledb.fast_start_failover.synchronized{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracledb.database.unique_name="CDB19",oracledb.fast_start_failover.status="SYNCHRONIZED"}'
