  # The oracledb receiver reads the role and open mode once at start, and the
  # series carry them as labels, so a restarted Collector can leave two series
  # of one instance side by side until the old one goes stale. The rule takes
  # max by (service.instance.id, obenhub.cluster.name) of each side; without
  # it the division matches many series to many and nothing fires.
  - name: "processes: two series of one instance that differ in role and open mode give one alert"
    interval: 30s
    input_series:
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracle.db.role="PHYSICAL STANDBY",oracle.db.open_mode="MOUNTED"}'
        values: '80x40'
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracle.db.role="PRIMARY",oracle.db.open_mode="READ WRITE"}'
        values: '320x40'
      - series: 'oracledb.processes.limit{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracle.db.role="PHYSICAL STANDBY",oracle.db.open_mode="MOUNTED"}'
        values: '320x40'
      - series: 'oracledb.processes.limit{obenhub.cluster.name="cdb19",service.instance.id="CDB19",service.name="oracledb",service.namespace="obenhub-lab",oracle.db.role="PRIMARY",oracle.db.open_mode="READ WRITE"}'
        values: '320x40'
    alert_rule_test:
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: critical}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses 95% or more of its PROCESSES limit: new logins fail with ORA-00020'
