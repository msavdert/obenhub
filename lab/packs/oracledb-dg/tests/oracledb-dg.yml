        values: '273x40'
      - series: 'oracledb.processes.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="b-273"}'
        values: '320x40'
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="c-303"}'
        values: '303x40'
      - series: 'oracledb.processes.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="c-303"}'
        values: '320x40'
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="d-304"}'
        values: '304x40'
      - series: 'oracledb.processes.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="d-304"}'
        values: '320x40'
    alert_rule_test:
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: b-273, severity: warning}
