  # OracleProcessesSaturation. oracledb.processes.* come from the oracledb
  # receiver (30s collection), so these series are 30s apart while the rules
  # run every 15s. Labels are reduced to the ones the rule keeps (the lab
  # series also carry oracle.db.role, oracle.db.open_mode and host labels,
  # read 2026-11-14). The window of the rule is 90s, three points of 30s.

  - name: "processes: a healthy instance (80 of 320) is quiet"
    interval: 30s
    input_series:
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19"}'
        values: '80x40'
      - series: 'oracledb.processes.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19"}'
        values: '320x40'
    alert_rule_test:
      - eval_time: 19m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []

  # The first sample at the limit is at 2m30 and the critical tier is up from 4m (the window of 90s must hold
  # three points at or above 0.95); the first sample back at 80 is at 7m and the alert is gone from 8m.
  - name: "processes: limit reached at 2m30 and released at 7m, critical fires and resolves"
    interval: 30s
    input_series:
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19"}'
        values: '80x5 320x9 80x30'
      - series: 'oracledb.processes.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19"}'
        values: '320x44'
    alert_rule_test:
      - eval_time: 2m15s
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []
      - eval_time: 3m45s
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []
      - eval_time: 4m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: critical}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses 95% or more of its PROCESSES limit: new logins fail with ORA-00020'
      - eval_time: 7m45s
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: critical}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses 95% or more of its PROCESSES limit: new logins fail with ORA-00020'
      - eval_time: 8m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []
      - eval_time: 9m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts: []

  # The series starts at the limit: three points are in the window at 1m, not at 45s.
  - name: "processes: warm-up, a new series at the limit stays quiet until its window is full"
    interval: 30s
    input_series:
      - series: 'oracledb.processes.usage{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19"}'
        values: '320x40'
      - series: 'oracledb.processes.limit{obenhub.cluster.name="cdb19",service.name="oracledb",service.namespace="obenhub-lab",service.instance.id="CDB19"}'
        values: '320x40'
