            exp_annotations:
              summary: 'Oracle instance CDB19 uses more than 85% of its PROCESSES limit'
      - eval_time: 4m30s
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses more than 85% of its PROCESSES limit'
      - eval_time: 4m45s
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses more than 85% of its PROCESSES limit'
      - eval_time: 5m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses more than 85% of its PROCESSES limit'
      - eval_time: 5m15s
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses more than 85% of its PROCESSES limit'
      - eval_time: 5m30s
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses more than 85% of its PROCESSES limit'
      - eval_time: 5m45s
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses more than 85% of its PROCESSES limit'
      - eval_time: 6m
        groupname: oracledb-dg
        alertname: OracleProcessesSaturation
        exp_alerts:
          - exp_labels: {obenhub.cluster.name: cdb19, service.instance.id: CDB19, severity: warning}
            exp_annotations:
              summary: 'Oracle instance CDB19 uses more than 85% of its PROCESSES limit'
      - eval_time: 6m15s
        groupname: oracledb-dg
