# Patroni alert rules (Patroni 4.1.5 REST /metrics), shared by the labs. The
# inventory these rules read (obenhub.expected_scrape with service.name
# "patroni", each with an obenhub.collector label naming the Collector that
# scrapes it, next to obenhub.expected_collector) is per lab, for example
# lab/stage3/vmalert/inventory.yml.
# Three Patroni nodes. Every rule is role-agnostic: the leader moves,
# so nothing here names a node as primary or standby. Patroni reports 0 for
# metrics that do not apply to a node's role (timeline and xlog_location are 0
# on a replica, received and replayed location are 0 on the leader; observed
# 2026-11-07 on Patroni 4.1.5), so cluster-wide values are max by (scope).
# Suppression is written into the expressions, not into Alertmanager inhibits
# (lab/slice1 lesson: vmalert's startsAt predates group_wait, so inhibits race).
# Pack metric names are provisional until the naming contract (ADR 0002).
groups:
  - name: patroni
    interval: 15s
    rules:
      # No node reports itself as the primary. "for" is longer than a normal
      # failover: the leader key expires after ttl (30 s), then the election
      # and the promotion follow (measured in the leader-killed scenario).
      # Silent while there is no Patroni data at all (the target alerts own
      # that case). Also silent while the most recent known primary is a member
      # whose Collector is dead: its patroni_primary goes stale, so the live
      # replicas alone sum to 0 although nothing is known about the leader
      # (that is its CollectorAbsent's). "Most recent": its last sample with
      # value 1 is not older than any other member's, so a replica promoted
      # since, or the leader's Patroni dying with a live Collector, ends the
      # suppression. Accepted loss: if the leader's whole VM dies and no
      # replica is promoted, this rule stays quiet while that node's
      # CollectorAbsent fires. patroni_cluster_unlocked is no alternative: in
      # the stage 3 data it reached 1 in only 4 samples in 3 days, never during
      # the leader-killed or quorum-lost runs.
      - alert: PatroniNoWritablePrimary
        expr: |
          WITH (
            last_primary = tlast_over_time((patroni_primary == 1)[1d:15s])
          )
          sum by (scope) (patroni_primary) == 0
            unless on(scope)
          (
            (
              last_primary
                and on(service.instance.id)
              (last_over_time(patroni_primary[1d]) == 1)
                and on(service.instance.id)
              (
                obenhub.expected_scrape{service.name="patroni"}
                  unless on(obenhub.collector)
                label_replace(present_over_time(otelcol_process_uptime[1m]), "obenhub.collector", "$1", "service.instance.id", "(.+)")
              )
            )
              >= on(scope) group_left
            max by (scope) (last_primary)
          )
        for: 90s
        labels:
          severity: critical
        annotations:
          summary: 'Cluster {{ $labels.scope }} has no writable primary'

      # The highest timeline any node reports rose compared with the highest
      # one seen in the hour before the last 3 m (a rolling maximum, so the
      # zeros of a gap do not count as a lower baseline). It holds for 3 m,
      # then the baseline catches up and the alert resolves: one firing per
      # change. It cannot fire during the first ~3 minutes after Patroni
      # metrics first appear: there is no baseline yet.
      # A planned switchover and an unplanned failover both raise the
      # timeline by one; these signals do not tell them apart (see the
      # switchover scenario).
      - alert: PatroniFailoverHappened
        expr: |
          max by (scope) (patroni_postgres_timeline)
            > on(scope)
          max_over_time(max by (scope) (patroni_postgres_timeline)[1h:1m] offset 3m)
        labels:
          severity: warning
        annotations:
          summary: 'Cluster {{ $labels.scope }} moved to timeline {{ $value }}'

      # A replica whose WAL position (max of received and replayed, the value
      # Patroni itself compares) is more than maximum_lag_on_failover behind
      # the leader's. 16777216 must equal maximum_lag_on_failover in
      # postgres/patroni.yml. The two positions come from two scrapes up to
      # 15 s apart; at the lab's load that skew stays well below the threshold
      # (assumption, checked by the control). A paused replay does not move
      # this value while the WAL receiver keeps receiving.
      - alert: PatroniReplicaNotEligible
        expr: |
          (
            max by (scope) (patroni_xlog_location)
              - on(scope) group_right()
            (
              (
                clamp_min(patroni_xlog_received_location - patroni_xlog_replayed_location, 0)
                  + patroni_xlog_replayed_location
              )
                and on(service.instance.id)
              patroni_replica == 1
            )
          ) > 16777216
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} is {{ $value | humanize1024 }}B behind the leader, beyond maximum_lag_on_failover'

      # Maintenance mode disables automatic failover. 3 m is a lab value.
      - alert: PatroniClusterPaused
        expr: max by (scope) (patroni_is_paused) == 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: 'Cluster {{ $labels.scope }} is paused: no automatic failover'

      # A parameter changed that needs a restart. 2 m is a lab value.
      - alert: PatroniPendingRestart
        expr: patroni_pending_restart == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} has a pending restart'

      # Provenance (ADR 0004 decision 4): the two alert kinds are PatroniDown
      # (patroni_up < 1, for 1m) and PatroniFailSafeActive
      # (sum(patroni_failsafe_mode_is_active) > 0) of pgsty/pigsty
      # files/victoria/rules/pgsql.yml at tag v4.5.0, commit
      # dab5dba333a070d96fde1f9feb41761148f2be8c, Apache-2.0. Read for ideas;
      # the expressions are written for this lab: pigsty's patroni_up comes from
      # its own exporter, here the signal is the Collector's scrape.
      #
      # Patroni's REST scrape has not succeeded for 2 m while the node's
      # PostgreSQL heartbeat is still present: Patroni down, PostgreSQL up (no
      # failover logic is running on that node). A node that is gone entirely
      # loses its heartbeat first (1 m window) and is PostgresTargetAbsent's
      # case, so the two never fire together. A stopped Collector raises only
      # its own CollectorAbsent: the gate is that the Collector that scrapes
      # this node (obenhub.collector) lived in the last 1 m.
      - alert: PatroniTargetAbsent
        expr: |
          obenhub.expected_scrape{service.name="patroni"}
            unless on(service.instance.id)
          (max_over_time(up{service.name="patroni"}[2m]) == 1)
            and on(service.instance.id)
          present_over_time(postgresql.collection.heartbeat[1m])
            and on(obenhub.collector)
          label_replace(present_over_time(otelcol_process_uptime[1m]), "obenhub.collector", "$1", "service.instance.id", "(.+)")
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Patroni on {{ (index $labels "service.instance.id") }} is not scraped while PostgreSQL still reports'

      # Failsafe mode: the DCS is unreachable and the leader keeps running on
      # the failsafe topology. UNIT TESTS ONLY: the lab runs with failsafe_mode
      # off (postgres/patroni.yml), so quorum-lost demotes the leader instead.
      # pigsty has no "for"; 30 s (two evaluations) is a lab value.
      - alert: PatroniFailsafeActive
        expr: patroni_failsafe_mode_is_active == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} runs in failsafe mode, the DCS is unreachable'
