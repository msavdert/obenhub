# k8s backend, run on the box next to the kind cluster (lab/k8s): the
# Collectors in the cluster push plain OTLP/HTTP to the gateway, published on
# the kind Docker network's IPv4 gateway address; everything else listens on
# 127.0.0.1 only. The five backend services extend lab/mon/compose.base.yaml
# (images, versions, flags, Alertmanager config, Grafana provisioning); this
# file adds ports, names, rule files and dashboards. Dashboards: lab/k8s/grafana/dashboards
# (CloudNativePG and Kubernetes) and the shared PostgreSQL dashboard of slice 1.
# Start with: lab/k8s/scripts/up.sh (it writes .env from the running kind network).

name: obenhub-k8s

services:
  gateway:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    container_name: obenhub-k8s-gateway
    restart: unless-stopped
    mem_limit: 256m
    command: ["--config=/etc/otelcol/config.yaml"]
    # only on the kind network's gateway address: reachable from the cluster
    # nodes, not from the LAN
    ports:
      - "${GATEWAY_IP:?run: lab/k8s/scripts/up.sh (it generates lab/k8s/mon/.env)}:${GATEWAY_PORT:?}:4318"
    volumes:
      - ./otelcol-gateway.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_started
    networks:
      - mon

  victoriametrics:
    extends:
      file: ../../mon/compose.base.yaml
      service: victoriametrics
    container_name: obenhub-k8s-victoriametrics
    ports:
      - "127.0.0.1:48428:8428"

  victorialogs:
    extends:
      file: ../../mon/compose.base.yaml
      service: victorialogs
    container_name: obenhub-k8s-victorialogs
    ports:
      - "127.0.0.1:49428:9428"

  vmalert:
    extends:
      file: ../../mon/compose.base.yaml
      service: vmalert
    container_name: obenhub-k8s-vmalert
    ports:
      - "127.0.0.1:48880:8880"
    volumes:
      - ./vmalert/inventory.yml:/etc/vmalert/inventory.yml:ro
      - ../../packs/cnpg/rules.yml:/etc/vmalert/pack/cnpg.yml:ro
      - ../../packs/k8s/rules.yml:/etc/vmalert/pack/k8s.yml:ro
      - ../../packs/postgresql/rules.yml:/etc/vmalert/pack/postgresql.yml:ro

  alertmanager:
    extends:
      file: ../../mon/compose.base.yaml
      service: alertmanager
    container_name: obenhub-k8s-alertmanager
    ports:
      - "127.0.0.1:49093:9093"

  grafana:
    extends:
      file: ../../mon/compose.base.yaml
      service: grafana
    container_name: obenhub-k8s-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?run: lab/k8s/scripts/up.sh (it generates lab/k8s/mon/.env)}"
    ports:
      - "127.0.0.1:43000:3000"
    volumes:
      - ../grafana/dashboards:/var/lib/obenhub/dashboards/k8s:ro
      - ../../slice1/grafana/dashboards:/var/lib/obenhub/dashboards/postgresql:ro

networks:
  mon: {}

volumes:
  vm-data: {}
  vl-data: {}
  am-data: {}
  grafana-data: {}
