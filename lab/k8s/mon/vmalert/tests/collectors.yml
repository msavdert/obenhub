      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker2"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker3"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 2m30s
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 3m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 4m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 5m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-cluster
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-cluster reports no self-metrics
      - eval_time: 6m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-cluster
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-cluster reports no self-metrics
      - eval_time: 7m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-cluster
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-cluster reports no self-metrics

  - name: "two agents stop: one CollectorAbsent each"
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-gateway"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-cluster"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker"}'
        values: '1x8 _x52'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker2"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker3"}'
        values: '1x8 _x52'
    alert_rule_test:
      - eval_time: 2m30s
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 3m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 4m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 5m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-agent-obenhub-worker
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-agent-obenhub-worker reports no self-metrics
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-agent-obenhub-worker3
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-agent-obenhub-worker3 reports no self-metrics
      - eval_time: 6m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-agent-obenhub-worker
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-agent-obenhub-worker reports no self-metrics
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-agent-obenhub-worker3
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-agent-obenhub-worker3 reports no self-metrics
      - eval_time: 7m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-agent-obenhub-worker
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-agent-obenhub-worker reports no self-metrics
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-agent-obenhub-worker3
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-agent-obenhub-worker3 reports no self-metrics

  - name: "the gateway stops, every Collector goes silent with it: only the gateway CollectorAbsent"
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-gateway"}'
        values: '1x8 _x52'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-cluster"}'
        values: '1x8 _x52'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker"}'
        values: '1x8 _x52'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker2"}'
        values: '1x8 _x52'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker3"}'
        values: '1x8 _x52'
    alert_rule_test:
      - eval_time: 2m30s
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 3m
