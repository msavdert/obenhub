# Collector liveness in the k8s lab: the gateway, the cluster Collector and one
# agent per worker, as listed in ../inventory.yml, read by CollectorAbsent of the
# shared Collector pack. Samples are 15 s apart; a stopped Collector's
# self-metrics end after 2 m (8 samples). CollectorAbsent: the 2 m window
# empties at 3m45s, firing after for: 1m (4m45s), so it is asserted from 5m;
# nothing may fire earlier. A Collector behind the gateway is left out while
# the gateway itself is absent, so a stopped gateway raises one alert, not five.
rule_files:
  - ../inventory.yml
  - ../../../../packs/collector/rules.yml
  - ../../../../packs/postgresql/rules.yml
evaluation_interval: 15s

tests:
  - name: "all five Collectors alive: no CollectorAbsent"
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-gateway"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-cluster"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker2"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker3"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 2m30s
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 3m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 4m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 5m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 6m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 7m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []

  - name: "one agent stops: only its CollectorAbsent"
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-gateway"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-cluster"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker2"}'
        values: '1x8 _x52'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-agent-obenhub-worker3"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 2m30s
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 3m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 4m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts: []
      - eval_time: 5m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-agent-obenhub-worker2
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-agent-obenhub-worker2 reports no self-metrics
      - eval_time: 6m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-agent-obenhub-worker2
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-agent-obenhub-worker2 reports no self-metrics
      - eval_time: 7m
        groupname: collector
        alertname: CollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.namespace: obenhub-lab
              service.instance.id: otelcol-agent-obenhub-worker2
              obenhub.upstream: otelcol-gateway
            exp_annotations:
              summary: Collector otelcol-agent-obenhub-worker2 reports no self-metrics

  - name: "the cluster Collector stops: only its CollectorAbsent"
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-gateway"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-cluster"}'
