---
apiVersion: v1
kind: Namespace
metadata:
  name: obenhub
---
# ${PG_IMAGE} is substituted from versions.sh by scripts/up.sh.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: obenhub
spec:
  instances: 3
  imageName: ${PG_IMAGE}
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: app
      owner: app
