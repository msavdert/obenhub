---
apiVersion: v1
kind: Namespace
metadata:
  name: obenhub
---
# ${PG_IMAGE} is substituted from versions.sh by scripts/up.sh.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: obenhub
spec:
  instances: 3
  imageName: ${PG_IMAGE}
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  storage:
    size: 1Gi
  # The exporter on port 9187 keeps only its built-in cnpg_collector_* set;
  # the default queries (cnpg_pg_*, cnpg_backends_*) repeat the PostgreSQL
  # pack, which the Collectors already run (ADR 0003).
  monitoring:
    disableDefaultQueries: true
  # Guard for the slot scenarios: max_slot_wal_keep_size defaults to -1
  # (unlimited, read on the lab 2026-11-11), so a slot whose replica cannot
  # consume WAL would keep growing the volume. local-path does not enforce the
  # 1Gi claim (df in the pod shows the host disk), so nothing else stops it.
  # With 1GB the slot is invalidated instead. sighup: a reload, no restart.
  # The alert threshold (ReplicationSlotRetainingWAL in lab/packs/postgresql)
  # sits well below it.
  postgresql:
    parameters:
      max_slot_wal_keep_size: 1GB
  bootstrap:
    initdb:
      database: app
      owner: app
  # The monitoring role of the Collectors (lab/k8s/otel): pg_monitor, as
  # lab/pgha/files/post-bootstrap.sh creates it. The Secret is made by
  # scripts/up.sh (random password, never written to the repository). A
  # managed role cannot carry the per-role statement_timeout that pgha sets.
  managed:
    roles:
      - name: otel_monitor
        ensure: present
        login: true
        comment: OpenTelemetry Collector monitoring role
        inRoles:
          - pg_monitor
          - pg_use_reserved_connections
        passwordSecret:
          name: pg-otel-monitor
