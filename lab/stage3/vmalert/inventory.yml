# Stage 3 inventory: the targets and scrapes this lab expects. The alert rules
# that read these series are the shared packs, lab/packs/{postgresql,patroni,etcd}.
# Every rule is role-agnostic and the inventory names nodes, never roles.
groups:
  - name: inventory
    interval: 15s
    rules:
      # The Collectors this lab expects, by their self-telemetry
      # service.instance.id; CollectorAbsent reads them. The obenhub.collector
      # label on the targets below names the Collector that collects them.
      - record: obenhub.expected_collector
        expr: label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-stage3")
      - record: obenhub.expected_target
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "stage3", "service.instance.id", "pg-1", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "stage3", "service.instance.id", "pg-2", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "stage3", "service.instance.id", "pg-3", "obenhub.collector", "otelcol-stage3")
          )

  - name: patroni-inventory
    interval: 15s
    rules:
      # Patroni REST scrapes expected from the Collector (the etcd ones are in
      # etcd-inventory below, same record name).
      - record: obenhub.expected_scrape
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "db.cluster.name", "stage3", "service.instance.id", "pg-1", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "db.cluster.name", "stage3", "service.instance.id", "pg-2", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "db.cluster.name", "stage3", "service.instance.id", "pg-3", "obenhub.collector", "otelcol-stage3")
          )

  - name: etcd-inventory
    interval: 15s
    rules:
      # Same name as the Patroni inventory above; the series differ
      # by service.name.
      - record: obenhub.expected_scrape
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "etcd-1", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "etcd-2", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "etcd-3", "obenhub.collector", "otelcol-stage3")
          )
