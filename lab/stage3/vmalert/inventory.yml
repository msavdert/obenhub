# Stage 3 inventory: the targets and scrapes this lab expects. The alert rules
# that read these series are the shared packs, lab/packs/{collector,postgresql,patroni,etcd}.
# Every rule is role-agnostic and the inventory names nodes, never roles.
groups:
  - name: inventory
    interval: 15s
    rules:
      # The Collectors this lab expects, by their self-telemetry
      # service.instance.id; CollectorAbsent reads them. The obenhub.collector
      # label on the targets below names the Collector that collects them.
      - record: obenhub.expected_collector
        expr: label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-stage3")
      - record: obenhub.expected_target
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "obenhub.cluster.name", "stage3", "service.instance.id", "pg-1", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "obenhub.cluster.name", "stage3", "service.instance.id", "pg-2", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "obenhub.cluster.name", "stage3", "service.instance.id", "pg-3", "obenhub.collector", "otelcol-stage3")
          )

  - name: patroni-inventory
    interval: 15s
    rules:
      # Patroni REST scrapes expected from the Collector (the etcd ones are in
      # etcd-inventory below, same record name).
      - record: obenhub.expected_scrape
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "obenhub.cluster.name", "stage3", "service.instance.id", "pg-1", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "obenhub.cluster.name", "stage3", "service.instance.id", "pg-2", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "obenhub.cluster.name", "stage3", "service.instance.id", "pg-3", "obenhub.collector", "otelcol-stage3")
          )

  - name: etcd-inventory
    interval: 15s
    rules:
      # Same name as the Patroni inventory above; the series differ
      # by service.name.
      - record: obenhub.expected_scrape
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "etcd-1", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "etcd-2", "obenhub.collector", "otelcol-stage3"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "etcd-3", "obenhub.collector", "otelcol-stage3")
          )

  # Lab parameters for the shared etcd pack (lab/packs/etcd/rules.yml): the pack
  # keeps the etcd-mixin thresholds (fsync p99 0.5 s, commit p99 0.25 s) as the
  # production defaults; this lab raises both to 1.0 s. This is not a production
  # value: the lab host's Proxmox storage is shared and slow, and the lab accepts
  # that. Measurements on 2026-11-18 (~19:56 UTC) from this lab's VictoriaMetrics:
  # worst sustained 10-minute p99 (max over members; "raw max" is the highest
  # single p99 sample), in seconds:
  # commit 24 h 0.355 (raw max 1.132), 48 h 0.676 (raw max 1.551);
  # fsync 24 h 0.261 (raw max 0.405), 48 h 0.780 (raw max 1.356).
  # Conditions: the 24 h window is the current load (pgbench -R 20, PR #105). The
  # 48 h window includes the period around 2026-11-17 14:35 to 15:08 UTC, when
  # pgbench still ran at -R 100 (5x the current load) and the owner was
  # installing a Kubernetes cluster on the same Proxmox host; an alert in such a
  # period is legitimate even in the lab. Under current conditions the margin to
  # 1.0 s is about 3x.
  - name: etcd-parameters
    interval: 15s
    rules:
      - record: obenhub.etcd.commit_duration.limit
        expr: vector(1.0)
      - record: obenhub.etcd.fsync_duration.limit
        expr: vector(1.0)
