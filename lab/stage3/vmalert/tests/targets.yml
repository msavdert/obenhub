# Watchdog, PostgresTargetAbsent, CollectorAbsent (three Patroni nodes).
rule_files:
  - ../rules/patroni.yml
evaluation_interval: 15s

tests:
  - name: watchdog always fires
    interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations:
              summary: Always firing; proves the alert pipeline works.

  - name: target absent fires only for the node that stopped reporting
    interval: 15s
    input_series:
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-1"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-2"}'
        values: '1x8 _x52'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-3"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 1m   # all alive
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts: []
      - eval_time: 3m   # pg-2 gone for 1m+ but the 2m window is not yet empty
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts: []
      - eval_time: 6m
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-2
              service.namespace: obenhub-lab
              service.name: postgresql
              db.cluster.name: stage3
            exp_annotations:
              summary: "No heartbeat from pg-2"

  - name: target absent does not fire when every node keeps reporting
    interval: 15s
    input_series:
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-1"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-2"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-3"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 10m
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts: []

  - name: target absent fires for a node that never reported
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-1"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-3"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 5m
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-2
              service.namespace: obenhub-lab
              service.name: postgresql
              db.cluster.name: stage3
            exp_annotations:
              summary: "No heartbeat from pg-2"

  - name: a stopped Collector raises CollectorAbsent only, not one alert per node
    interval: 15s
    input_series:
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-1"}'
        values: '1x8 _x52'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-2"}'
        values: '1x8 _x52'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-3"}'
        values: '1x8 _x52'
      - series: 'otelcol_process_uptime{service.name="otelcol"}'
        values: '1x8 _x52'
    alert_rule_test:
      - eval_time: 6m
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts: []
      - eval_time: 6m
        groupname: postgresql
        alertname: CollectorAbsent
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: The Collector reports no self-metrics.

  - name: CollectorAbsent stays silent while the Collector reports
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 10m
        groupname: postgresql
        alertname: CollectorAbsent
        exp_alerts: []
