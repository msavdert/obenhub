# StandbyNotStreaming and ReplayBacklog. Both gate on recovery.active == 1;
# StandbyNotStreaming is also silent while no node is writable.
rule_files:
  - ../rules/patroni.yml
evaluation_interval: 15s

tests:
  - name: not streaming fires on the node in recovery only, while another node is writable
    interval: 15s
    input_series:
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-1"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-1"}'
        values: '0x60'
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-2"}'
        values: '1x8 0x52'
      - series: 'postgresql.recovery.active{service.instance.id="pg-2"}'
        values: '1x60'
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-3"}'
        values: '1x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-3"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 1m   # still streaming
        groupname: postgresql
        alertname: StandbyNotStreaming
        exp_alerts: []
      - eval_time: 2m30s   # 0 for 30s, below the 1m hold
        groupname: postgresql
        alertname: StandbyNotStreaming
        exp_alerts: []
      - eval_time: 5m
        groupname: postgresql
        alertname: StandbyNotStreaming
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-2
            exp_annotations:
              summary: pg-2 is in recovery and not streaming

  - name: not streaming is silent when no node is writable (quorum lost, all in recovery)
    interval: 15s
    input_series:
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-1"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-1"}'
        values: '1x60'
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-2"}'
        values: '0x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-2"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 8m
        groupname: postgresql
        alertname: StandbyNotStreaming
        exp_alerts: []

  - name: a failed collection (no samples) does not fire not-streaming
    interval: 15s
    input_series:
      - series: 'postgresql.wal_receiver.streaming{service.instance.id="pg-2"}'
        values: '1x8 _x52'
      - series: 'postgresql.recovery.active{service.instance.id="pg-2"}'
        values: '1x8 _x52'
      - series: 'postgresql.recovery.active{service.instance.id="pg-1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 8m
        groupname: postgresql
        alertname: StandbyNotStreaming
        exp_alerts: []

  - name: replay backlog fires on a node in recovery above 16 MiB; the writable node is gated out
    interval: 15s
    input_series:
      - series: 'postgresql.replay.backlog{service.instance.id="pg-1"}'
        values: '99999999999x60'
      - series: 'postgresql.recovery.active{service.instance.id="pg-1"}'
        values: '0x60'
      - series: 'postgresql.replay.backlog{service.instance.id="pg-2"}'
        values: '0x8 100000000x52'
      - series: 'postgresql.recovery.active{service.instance.id="pg-2"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 1m
        groupname: postgresql
        alertname: ReplayBacklog
        exp_alerts: []
      - eval_time: 5m
        groupname: postgresql
        alertname: ReplayBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pg-2
            exp_annotations:
              summary: pg-2 replay backlog is 95.37MiB
