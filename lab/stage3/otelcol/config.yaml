# Stage 3 collector: three Patroni nodes, named by node and never by role.
# Receiver keys: receiver/postgresqlreceiver and receiver/prometheusreceiver at
# v0.164.0. The sql_query list is the shared PostgreSQL pack,
# lab/packs/postgresql/queries.yaml, mounted at /etc/otelcol/packs/postgresql.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # filelog offsets survive a Collector restart (volume otelcol-data).
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true

receivers:
  postgresql/pg-1:
    endpoint: pg-1:5432
    transport: tcp
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    databases: [postgres]
    collection_interval: 15s
    tls:
      insecure: true

  postgresql/pg-2:
    endpoint: pg-2:5432
    transport: tcp
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    databases: [postgres]
    collection_interval: 15s
    tls:
      insecure: true

  postgresql/pg-3:
    endpoint: pg-3:5432
    transport: tcp
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    databases: [postgres]
    collection_interval: 15s
    tls:
      insecure: true

  # Patroni REST API /metrics (Prometheus text format). Contrib has no
  # Patroni receiver, so this is the generic prometheusreceiver.
  prometheus/pg-1:
    config:
      scrape_configs:
        - job_name: patroni
          scrape_interval: 15s
          scrape_timeout: 10s
          static_configs:
            - targets: ['pg-1:8008']

  # Patroni REST API /metrics (Prometheus text format). Contrib has no
  # Patroni receiver, so this is the generic prometheusreceiver.
  prometheus/pg-2:
    config:
      scrape_configs:
        - job_name: patroni
          scrape_interval: 15s
          scrape_timeout: 10s
          static_configs:
            - targets: ['pg-2:8008']

  # Patroni REST API /metrics (Prometheus text format). Contrib has no
  # Patroni receiver, so this is the generic prometheusreceiver.
  prometheus/pg-3:
    config:
      scrape_configs:
        - job_name: patroni
          scrape_interval: 15s
          scrape_timeout: 10s
          static_configs:
            - targets: ['pg-3:8008']

  # etcd serves /metrics on the client URL (port 2379) in 3.6.16; checked
  # 2026-11-07 against etcd-1, so --listen-metrics-urls is not needed. The
  # Collector is on the dcs network for this (compose.yaml).
  prometheus/etcd-1:
    config:
      scrape_configs:
        - job_name: etcd
          scrape_interval: 15s
          scrape_timeout: 10s
          static_configs:
            - targets: ['etcd-1:2379']

  # etcd serves /metrics on the client URL (port 2379) in 3.6.16; checked
  # 2026-11-07 against etcd-1, so --listen-metrics-urls is not needed. The
  # Collector is on the dcs network for this (compose.yaml).
  prometheus/etcd-2:
    config:
      scrape_configs:
        - job_name: etcd
          scrape_interval: 15s
          scrape_timeout: 10s
          static_configs:
            - targets: ['etcd-2:2379']

  # etcd serves /metrics on the client URL (port 2379) in 3.6.16; checked
  # 2026-11-07 against etcd-1, so --listen-metrics-urls is not needed. The
  # Collector is on the dcs network for this (compose.yaml).
  prometheus/etcd-3:
    config:
      scrape_configs:
        - job_name: etcd
          scrape_interval: 15s
          scrape_timeout: 10s
          static_configs:
            - targets: ['etcd-3:2379']

  file_log/pg-1:
    include: [/var/log/pg-1/postgresql-*.json]
    start_at: beginning
    storage: file_storage
    operators:
      - &jsonlog
        type: json_parser
        parse_from: body
        # keep integers exact (query_id is a 64-bit integer)
        parse_ints: true
        timestamp:
          parse_from: attributes.timestamp
          layout: '%Y-%m-%d %H:%M:%S.%L %Z'
        severity:
          parse_from: attributes.error_severity
          mapping:
            debug: [DEBUG1, DEBUG2, DEBUG3, DEBUG4, DEBUG5]
            info: [LOG, INFO, NOTICE]
            warn: WARNING
            error: ERROR
            fatal: [FATAL, PANIC]
      # the log body is the server message, not the raw JSON line
      - &body
        type: move
        from: attributes.message
        to: body

  file_log/pg-2:
    include: [/var/log/pg-2/postgresql-*.json]
    start_at: beginning
    storage: file_storage
    operators:
      - *jsonlog
      - *body

  file_log/pg-3:
    include: [/var/log/pg-3/postgresql-*.json]
    start_at: beginning
    storage: file_storage
    operators:
      - *jsonlog
      - *body

  sql_query/pg-1:
    driver: postgres
    host: pg-1
    port: 5432
    database: postgres
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    queries: ${file:/etc/otelcol/packs/postgresql/queries.yaml}

  sql_query/pg-2:
    driver: postgres
    host: pg-2
    port: 5432
    database: postgres
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    queries: ${file:/etc/otelcol/packs/postgresql/queries.yaml}

  sql_query/pg-3:
    driver: postgres
    host: pg-3
    port: 5432
    database: postgres
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    queries: ${file:/etc/otelcol/packs/postgresql/queries.yaml}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # Attribute names are assumptions, as in lab/slice1/otelcol/config.yaml.
  # No role attribute on purpose: the leader moves. The Patroni scrape is its
  # own service (service.name patroni) with the same instance id, so metrics
  # of one node join on service.instance.id.
  resource/pg-1:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: postgresql, action: upsert}
      - {key: service.instance.id, value: pg-1, action: upsert}
      - {key: server.address, value: pg-1, action: upsert}
      - {key: server.port, value: '5432', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: db.cluster.name, value: stage3, action: upsert}
  resource/pg-1-patroni:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: patroni, action: upsert}
      - {key: service.instance.id, value: pg-1, action: upsert}
      - {key: server.address, value: pg-1, action: upsert}
      - {key: server.port, value: '8008', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: db.cluster.name, value: stage3, action: upsert}
  resource/pg-2:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: postgresql, action: upsert}
      - {key: service.instance.id, value: pg-2, action: upsert}
      - {key: server.address, value: pg-2, action: upsert}
      - {key: server.port, value: '5432', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: db.cluster.name, value: stage3, action: upsert}
  resource/pg-2-patroni:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: patroni, action: upsert}
      - {key: service.instance.id, value: pg-2, action: upsert}
      - {key: server.address, value: pg-2, action: upsert}
      - {key: server.port, value: '8008', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: db.cluster.name, value: stage3, action: upsert}
  resource/pg-3:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: postgresql, action: upsert}
      - {key: service.instance.id, value: pg-3, action: upsert}
      - {key: server.address, value: pg-3, action: upsert}
      - {key: server.port, value: '5432', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: db.cluster.name, value: stage3, action: upsert}
  resource/pg-3-patroni:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: patroni, action: upsert}
      - {key: service.instance.id, value: pg-3, action: upsert}
      - {key: server.address, value: pg-3, action: upsert}
      - {key: server.port, value: '8008', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: db.cluster.name, value: stage3, action: upsert}
  resource/etcd-1:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: etcd, action: upsert}
      - {key: service.instance.id, value: etcd-1, action: upsert}
      - {key: server.address, value: etcd-1, action: upsert}
      - {key: server.port, value: '2379', action: upsert}
  resource/etcd-2:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: etcd, action: upsert}
      - {key: service.instance.id, value: etcd-2, action: upsert}
      - {key: server.address, value: etcd-2, action: upsert}
      - {key: server.port, value: '2379', action: upsert}
  resource/etcd-3:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: etcd, action: upsert}
      - {key: service.instance.id, value: etcd-3, action: upsert}
      - {key: server.address, value: etcd-3, action: upsert}
      - {key: server.port, value: '2379', action: upsert}
  batch: {}

exporters:
  otlp_http/vm:
    endpoint: http://victoriametrics:8428/opentelemetry
  otlp_http/vl:
    endpoint: http://victorialogs:9428/insert/opentelemetry
    headers:
      VL-Stream-Fields: service.namespace,service.name,service.instance.id

service:
  extensions: [health_check, file_storage]
  telemetry:
    resource:
      attributes:
        - {name: service.namespace, value: obenhub-lab}
        - {name: service.name, value: otelcol}
        - {name: service.instance.id, value: otelcol-stage3}
    metrics:
      level: normal
      readers:
        - periodic:
            interval: 15000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
  pipelines:
    metrics/pg-1:
      receivers: [postgresql/pg-1, sql_query/pg-1]
      processors: [memory_limiter, resource/pg-1, batch]
      exporters: [otlp_http/vm]
    metrics/pg-1-patroni:
      receivers: [prometheus/pg-1]
      processors: [memory_limiter, resource/pg-1-patroni, batch]
      exporters: [otlp_http/vm]
    logs/pg-1:
      receivers: [file_log/pg-1]
      processors: [memory_limiter, resource/pg-1, batch]
      exporters: [otlp_http/vl]
    metrics/pg-2:
      receivers: [postgresql/pg-2, sql_query/pg-2]
      processors: [memory_limiter, resource/pg-2, batch]
      exporters: [otlp_http/vm]
    metrics/pg-2-patroni:
      receivers: [prometheus/pg-2]
      processors: [memory_limiter, resource/pg-2-patroni, batch]
      exporters: [otlp_http/vm]
    logs/pg-2:
      receivers: [file_log/pg-2]
      processors: [memory_limiter, resource/pg-2, batch]
      exporters: [otlp_http/vl]
    metrics/pg-3:
      receivers: [postgresql/pg-3, sql_query/pg-3]
      processors: [memory_limiter, resource/pg-3, batch]
      exporters: [otlp_http/vm]
    metrics/pg-3-patroni:
      receivers: [prometheus/pg-3]
      processors: [memory_limiter, resource/pg-3-patroni, batch]
      exporters: [otlp_http/vm]
    logs/pg-3:
      receivers: [file_log/pg-3]
      processors: [memory_limiter, resource/pg-3, batch]
      exporters: [otlp_http/vl]
    metrics/etcd-1:
      receivers: [prometheus/etcd-1]
      processors: [memory_limiter, resource/etcd-1, batch]
      exporters: [otlp_http/vm]
    metrics/etcd-2:
      receivers: [prometheus/etcd-2]
      processors: [memory_limiter, resource/etcd-2, batch]
      exporters: [otlp_http/vm]
    metrics/etcd-3:
      receivers: [prometheus/etcd-3]
      processors: [memory_limiter, resource/etcd-3, batch]
      exporters: [otlp_http/vm]
