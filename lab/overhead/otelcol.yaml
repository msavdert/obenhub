# Collector config for the overhead measurement on pg-lab (one server).
# Derived from lab/slice1/otelcol/config.yaml (receiver keys at v0.164.0):
# same receivers, the current shared PostgreSQL pack (lab/packs/postgresql/
# queries.yaml, installed by setup.sh at /etc/otelcol-contrib/packs/
# postgresql), same 15s intervals, max_open_conn 3, the optional
# postgresql.deadlocks metric on, same internal telemetry level.
# Differences: one PostgreSQL server on localhost, the debug exporter (verbosity basic) instead of the Victoria
# stack, and the health_check bound to loopback. The password is read from
# the environment (EnvironmentFile of the systemd unit), never from this file.
extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  file_storage:
    directory: /var/lib/otelcol-overhead/file_storage
    create_directory: true

receivers:
  postgresql/primary:
    endpoint: 127.0.0.1:5432
    transport: tcp
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    databases: [postgres]
    collection_interval: 15s
    metrics:
      postgresql.deadlocks:
        enabled: true
    tls:
      insecure: true

  file_log/primary:
    include: [/var/log/postgresql/postgresql-*.json]
    start_at: beginning
    storage: file_storage
    operators:
      - type: json_parser
        parse_from: body
        parse_ints: true
        timestamp:
          parse_from: attributes.timestamp
          layout: '%Y-%m-%d %H:%M:%S.%L %Z'
        severity:
          parse_from: attributes.error_severity
          mapping:
            debug: [DEBUG1, DEBUG2, DEBUG3, DEBUG4, DEBUG5]
            info: [LOG, INFO, NOTICE]
            warn: WARNING
            error: ERROR
            fatal: [FATAL, PANIC]
      - type: move
        from: attributes.message
        to: body

  sql_query/primary:
    driver: postgres
    host: 127.0.0.1
    port: 5432
    database: postgres
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    queries: ${file:/etc/otelcol-contrib/packs/postgresql/queries.yaml}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  resource/primary:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: postgresql, action: upsert}
      - {key: service.instance.id, value: pg-lab, action: upsert}
      - {key: server.address, value: pg-lab, action: upsert}
      - {key: server.port, value: '5432', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: obenhub.cluster.name, value: overhead, action: upsert}
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check, file_storage]
  telemetry:
    metrics:
      level: normal
  pipelines:
    metrics/primary:
      receivers: [postgresql/primary, sql_query/primary]
      processors: [memory_limiter, resource/primary, batch]
      exporters: [debug]
    logs/primary:
      receivers: [file_log/primary]
      processors: [memory_limiter, resource/primary, batch]
      exporters: [debug]
