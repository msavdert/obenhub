# PgBouncer 1.26.1 (PGDG apt) in front of database postgres on pg-lab.
# Own file. Transaction pooling, pool of 5. max_prepared_statements > 0 is
# what lets pgbench -M prepared work through transaction pooling (PgBouncer
# 1.21+); 0 would make the prepared cells fail or fall back.
[databases]
postgres = host=127.0.0.1 port=5432 dbname=postgres

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = obi_bench
server_tls_sslmode = disable
pool_mode = transaction
default_pool_size = 5
max_client_conn = 100
max_prepared_statements = 200
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /run/postgresql/pgbouncer.pid
