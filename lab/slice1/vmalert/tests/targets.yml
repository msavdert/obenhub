# PostgresTargetAbsent against the slice 1 inventory, and its interplay with
# CollectorAbsent and PostgresSeriesVanished (pack rules).
rule_files:
  - ../rules/postgresql.yml
  - ../../../packs/postgresql/rules.yml
evaluation_interval: 15s

tests:
  - name: target absent fires only for the dead target while the other lives
    interval: 15s
    input_series:
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-primary"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-standby"}'
        values: '1x8 _x52'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-subscriber"}'
        values: '1x60'
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-slice1"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 1m   # both alive
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts: []
      - eval_time: 3m   # standby gone for 1m+ but window (2m) not yet empty
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts: []
      - eval_time: 6m
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-standby
              service.namespace: obenhub-lab
              service.name: postgresql
              obenhub.cluster.name: slice1
              obenhub.collector: otelcol-slice1
            exp_annotations:
              summary: "No heartbeat from pg-standby"

  - name: target absent does not fire when both targets keep reporting
    interval: 15s
    input_series:
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-primary"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-standby"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-subscriber"}'
        values: '1x60'
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-slice1"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 10m
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts: []

  - name: target absent fires for a target that never reported
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-slice1"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-primary"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-subscriber"}'
        values: '1x60'
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
    alert_rule_test:
      - eval_time: 5m
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-standby
              service.namespace: obenhub-lab
              service.name: postgresql
              obenhub.cluster.name: slice1
              obenhub.collector: otelcol-slice1
            exp_annotations:
              summary: "No heartbeat from pg-standby"

  - name: target absent fires for the stopped subscriber only
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-slice1"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-primary"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-standby"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-subscriber"}'
        values: '1x8 _x52'
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
    alert_rule_test:
      - eval_time: 6m
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pg-subscriber
              service.namespace: obenhub-lab
              service.name: postgresql
              obenhub.cluster.name: slice1-subscriber
              obenhub.collector: otelcol-slice1
            exp_annotations:
              summary: "No heartbeat from pg-subscriber"

  - name: a stopped Collector raises only CollectorAbsent
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-slice1"}'
        values: '1x8 _x52'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-primary"}'
        values: '1x8 _x52'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-standby"}'
        values: '1x8 _x52'
      - series: 'postgresql.replay.backlog{service.instance.id="pg-standby"}'
        values: '0x8 _x52'
    alert_rule_test:
      - eval_time: 10m
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts: []
      - eval_time: 10m
        groupname: postgresql
        alertname: PostgresSeriesVanished
        exp_alerts: []

  - name: a stopped target raises PostgresTargetAbsent, not PostgresSeriesVanished
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-slice1"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-primary"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-standby"}'
        values: '1x8 _x52'
      - series: 'postgresql.replay.backlog{service.instance.id="pg-standby"}'
        values: '0x8 _x52'
    alert_rule_test:
      - eval_time: 10m
        groupname: postgresql
        alertname: PostgresSeriesVanished
        exp_alerts: []

  - name: a Collector restart shorter than the for clause raises nothing
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-slice1"}'
        values: '1x8 _x12 1x40'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-primary"}'
        values: '1x8 _x14 1x38'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-standby"}'
        values: '1x8 _x14 1x38'
    alert_rule_test:
      - eval_time: 5m40s   # uptime back, heartbeat not yet (30s later): pending only
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts: []
