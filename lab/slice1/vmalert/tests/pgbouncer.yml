# PgbouncerClientsWaiting, PgbouncerTargetAbsent, PgbouncerPoolSaturated,
# PgbouncerClientSaturation and PgbouncerWaitTime.
rule_files:
  - ../rules/postgresql.yml
  - ../../../packs/postgresql/rules.yml
evaluation_interval: 15s

tests:
  - name: a client waiting 8 s fires after the 1 m hold, not before
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.pool.oldest_wait_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 8x52'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 3m
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts: []
      - eval_time: 3m30s
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pgbouncer
              service.name: pgbouncer
              service.namespace: obenhub-lab
              obenhub.cluster.name: slice1
              pgbouncer.database.name: app
              user.name: app
            exp_annotations:
              summary: "PgBouncer pool app/app has a client waiting 8s for a server connection"

  - name: whole seconds and the sub-second part add up (4 s plus 2.5 s sub-second part fires)
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.pool.oldest_wait_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 4x52'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 2.5x52'
    alert_rule_test:
      - eval_time: 4m
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pgbouncer
              service.name: pgbouncer
              service.namespace: obenhub-lab
              obenhub.cluster.name: slice1
              pgbouncer.database.name: app
              user.name: app
            exp_annotations:
              summary: "PgBouncer pool app/app has a client waiting 6.5s for a server connection"

  - name: a wait of 5.5 s fires; the threshold is 5 s from above too
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.pool.oldest_wait_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 5x52'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 0.5x52'
    alert_rule_test:
      - eval_time: 4m
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pgbouncer
              service.name: pgbouncer
              service.namespace: obenhub-lab
              obenhub.cluster.name: slice1
              pgbouncer.database.name: app
              user.name: app
            exp_annotations:
              summary: "PgBouncer pool app/app has a client waiting 5.5s for a server connection"

  - name: a wait of 4.9 s does not fire; the threshold is 5 s
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.pool.oldest_wait_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 4x52'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 0.9x52'
    alert_rule_test:
      - eval_time: 6m
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts: []

  - name: a wait below the hold time (45 s of waiting) does not fire
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.pool.oldest_wait_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 8x3 0x49'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 6m
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts: []

  - name: the console pool (database pgbouncer) is ignored
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.pool.oldest_wait_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="pgbouncer",user.name="pgbouncer"}'
        values: '0x8 30x52'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="pgbouncer",user.name="pgbouncer"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 6m
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts: []

  - name: a paused database does not fire
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '1x60'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.pool.oldest_wait_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 30x52'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 6m
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts: []

  - name: a disabled database does not fire
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '1x60'
      - series: 'pgbouncer.pool.oldest_wait_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 30x52'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 6m
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts: []

  - name: a paused database does not hide a waiting pool of another database
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="other"}'
        values: '1x60'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="other"}'
        values: '0x60'
      - series: 'pgbouncer.pool.oldest_wait_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 30x52'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.pool.oldest_wait_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="other",user.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="other",user.name="app"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 6m
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pgbouncer
              service.name: pgbouncer
              service.namespace: obenhub-lab
              obenhub.cluster.name: slice1
              pgbouncer.database.name: app
              user.name: app
            exp_annotations:
              summary: "PgBouncer pool app/app has a client waiting 30s for a server connection"

  - name: stale series do not fire once the PgBouncer heartbeat is gone
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x8 _x52'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x60'
      - series: 'pgbouncer.pool.oldest_wait_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x8 30x52'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts: []

  - name: PgbouncerTargetAbsent fires for a stopped PgBouncer only, from the SHOW LISTS heartbeat
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-slice1"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-primary"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-standby"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.instance.id="pg-subscriber"}'
        values: '1x60'
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x8 _x52'
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="users"}'
        values: '3x60'
    alert_rule_test:
      - eval_time: 3m   # gone for 1m but the 2m window is not yet empty
        groupname: pgbouncer
        alertname: PgbouncerTargetAbsent
        exp_alerts: []
      - eval_time: 6m   # the pack rule names PostgreSQL heartbeats only: PgBouncer does not raise it
        groupname: postgresql
        alertname: PostgresTargetAbsent
        exp_alerts: []
      - eval_time: 6m   # only the "databases" row is the heartbeat: the live "users" row does not hide it
        groupname: pgbouncer
        alertname: PgbouncerTargetAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pgbouncer
              service.namespace: obenhub-lab
              service.name: pgbouncer
              obenhub.cluster.name: slice1
              obenhub.collector: otelcol-slice1
            exp_annotations:
              summary: "No heartbeat from pgbouncer"

  - name: PoolSaturated fires once the 5m window holds 20 points at ratio 1.0, not one point earlier
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x120'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x120'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x120'
      - series: 'pgbouncer.database.server_connection.limit{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '5x120'
      - series: 'pgbouncer.pool.active_server.count{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '5x120'
    alert_rule_test:
      - eval_time: 4m30s
        groupname: pgbouncer
        alertname: PgbouncerPoolSaturated
        exp_alerts: []
      - eval_time: 4m45s
        groupname: pgbouncer
        alertname: PgbouncerPoolSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pgbouncer
              service.name: pgbouncer
              service.namespace: obenhub-lab
              obenhub.cluster.name: slice1
              pgbouncer.database.name: app
              user.name: app
            exp_annotations:
              summary: "PgBouncer pool app/app used 100% of its pool_size over 5m"
  - name: PoolSaturated is silent at ratio 0.8
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x120'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x120'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x120'
      - series: 'pgbouncer.database.server_connection.limit{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '5x120'
      - series: 'pgbouncer.pool.active_server.count{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '4x120'
    alert_rule_test:
      - eval_time: 10m
        groupname: pgbouncer
        alertname: PgbouncerPoolSaturated
        exp_alerts: []

  - name: PoolSaturated fires at ratio 0.95, clearly above the 0.9 threshold
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x120'
      - series: 'pgbouncer.database.paused{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x120'
      - series: 'pgbouncer.database.disabled{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '0x120'
      - series: 'pgbouncer.database.server_connection.limit{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '20x120'
      - series: 'pgbouncer.pool.active_server.count{service.name="pgbouncer",service.namespace="obenhub-lab",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '19x120'
    alert_rule_test:
      - eval_time: 10m
        groupname: pgbouncer
        alertname: PgbouncerPoolSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: pgbouncer
              service.name: pgbouncer
              service.namespace: obenhub-lab
              obenhub.cluster.name: slice1
              pgbouncer.database.name: app
              user.name: app
            exp_annotations:
              summary: "PgBouncer pool app/app used 95% of its pool_size over 5m"

  - name: PoolSaturated is silent at ratio 0.85, clearly below the 0.9 threshold
    interval: 15s
    input_series:
