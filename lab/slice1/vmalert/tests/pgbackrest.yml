# The slice 1 parameter of the pgBackRest pack (rules/pgbackrest.yml records
# obenhub.backup_age.limit = 780 s) read by PgBackRestBackupStale. The pack's own
# behaviour is tested in packs/pgbackrest/tests.
rule_files:
  - ../rules/pgbackrest.yml
  - ../../../../packs/pgbackrest/rules.yml
evaluation_interval: 15s

tests:
  - name: with the slice 1 parameter a backup 900 s old is stale and one 600 s old is not
    interval: 15s
    input_series:
      - series: 'pgbackrest_backup_since_last_completion_seconds{obenhub.cluster.name="slice1",backup_type="incr",stanza="slice1",service.name="pgbackrest",service.instance.id="pgbackrest"}'
        values: '600x20 900x20'
    alert_rule_test:
      - eval_time: 4m
        groupname: pgbackrest
        alertname: PgBackRestBackupStale
        exp_alerts: []
      - eval_time: 8m
        groupname: pgbackrest
        alertname: PgBackRestBackupStale
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: slice1
              severity: warning
              backup_type: incr
              stanza: slice1
              service.name: pgbackrest
              service.instance.id: pgbackrest
            exp_annotations:
              summary: 'No completed pgBackRest backup of stanza slice1 for 900 s'
              description: "The last completed backup of a stanza is older than the tolerated age (obenhub.backup_age.limit, 26 h by default), for a minute. Run pgbackrest info for the stanza and check the job that takes the backups."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/pgbackrest/#pgbackrestbackupstale
