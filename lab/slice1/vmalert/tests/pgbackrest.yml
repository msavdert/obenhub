# The slice 1 parameter of the pgBackRest pack (rules/pgbackrest.yml records
# obenhub.backup_age.limit = 780 s) read by PgBackRestBackupStale. The pack's own
# behaviour is tested in lab/packs/pgbackrest/tests.
rule_files:
  - ../rules/pgbackrest.yml
  - ../../../packs/pgbackrest/rules.yml
evaluation_interval: 15s

tests:
  - name: with the slice 1 parameter a backup 900 s old is stale and one 600 s old is not
    interval: 15s
    input_series:
      - series: 'pgbackrest_backup_since_last_completion_seconds{backup_type="incr",stanza="slice1",service.name="pgbackrest",service.instance.id="pgbackrest"}'
        values: '600x20 900x20'
    alert_rule_test:
      - eval_time: 4m
        groupname: pgbackrest
        alertname: PgBackRestBackupStale
        exp_alerts: []
      - eval_time: 8m
        groupname: pgbackrest
        alertname: PgBackRestBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              backup_type: incr
              stanza: slice1
              service.name: pgbackrest
              service.instance.id: pgbackrest
            exp_annotations:
              summary: 'No completed pgBackRest backup of stanza slice1 for 900 s'
