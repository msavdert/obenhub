# The generic PostgreSQL rules (PostgresTargetAbsent,
# PostgresStandbyNotStreaming, PostgresReplayBacklog, PostgresSnapshotHeldTooLong, PostgresConnectionSaturation,
# PostgresSeriesVanished, and the logical-replication group) live in packs/postgresql/rules.yml (Watchdog, CollectorAbsent and
# CollectorUnknown: packs/collector/rules.yml; the PgBouncer rules:
# packs/pgbouncer/rules.yml). This file holds the inventory.
groups:
  - name: inventory
    interval: 15s
    rules:
      # The Collectors this lab expects, by their self-telemetry
      # service.instance.id; CollectorAbsent reads them. The obenhub.collector
      # label on the targets below names the Collector that collects them.
      - record: obenhub.expected_collector
        expr: label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-slice1")
      - record: obenhub.expected_target
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "obenhub.cluster.name", "slice1", "service.instance.id", "pg-primary", "obenhub.collector", "otelcol-slice1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "obenhub.cluster.name", "slice1", "service.instance.id", "pg-standby", "obenhub.collector", "otelcol-slice1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "obenhub.cluster.name", "slice1-subscriber", "service.instance.id", "pg-subscriber", "obenhub.collector", "otelcol-slice1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "pgbouncer", "obenhub.cluster.name", "slice1", "service.instance.id", "pgbouncer", "obenhub.collector", "otelcol-slice1")
          )
