# The generic PostgreSQL rules (Watchdog, PostgresTargetAbsent, CollectorAbsent,
# StandbyNotStreaming, ReplayBacklog, SnapshotHeldTooLong, ConnectionSaturation,
# SeriesVanished) live in lab/packs/postgresql/rules.yml. This file holds the
# inventory and the slice 1 specific groups.
groups:
  - name: inventory
    interval: 15s
    rules:
      # The Collectors this lab expects, by their self-telemetry
      # service.instance.id; CollectorAbsent reads them. The obenhub.collector
      # label on the targets below names the Collector that collects them.
      - record: obenhub.expected_collector
        expr: label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-slice1")
      - record: obenhub.expected_target
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "slice1", "service.instance.id", "pg-primary", "obenhub.collector", "otelcol-slice1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "slice1", "service.instance.id", "pg-standby", "obenhub.collector", "otelcol-slice1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "slice1", "service.instance.id", "pg-subscriber", "obenhub.collector", "otelcol-slice1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "pgbouncer", "db.cluster.name", "slice1", "service.instance.id", "pgbouncer", "obenhub.collector", "otelcol-slice1")
          )

  # Logical replication (stage 2). Thresholds are lab values. Measured in the
  # lab on a healthy idle subscription: last_msg_age peaks near 30 s (the
  # publisher's keepalive at half of wal_sender_timeout = 60 s). A network
  # cut moves apply_error_count by exactly 1 (the apply worker dies on
  # wal_receiver_timeout; measured 42 -> 43), then not again, while a
  # conflict raises it every retry. So two or more errors, not one, mean a
  # failing change.
  - name: logical-replication
    interval: 15s
    rules:
      # apply_error_count rises on every retry of a failing change (measured:
      # +1 about every 5 s, wal_retrieve_retry_interval, for an insert_exists
      # conflict), so two or more over 3 m means the apply worker is failing;
      # a single increase is a timeout or a one-off, and the not-streaming
      # alert covers a dead connection.
      - alert: LogicalApplyErrors
        expr: |
          increase(postgresql.subscription.apply_errors[3m])
            + increase(postgresql.subscription.sync_errors[3m]) >= 2
        labels:
          severity: critical
        annotations:
          summary: 'Subscription {{ $labels.subscription_name }} on {{ (index $labels "service.instance.id") }} has apply or sync errors'

      # An enabled subscription that is not receiving, by either branch:
      # - the apply worker is absent for most of 1 m (avg_over_time < 0.5; the
      #   average smooths the worker restart loop). This is what fires in the
      #   logical-cut scenario: with the default wal_receiver_timeout of 60 s
      #   the worker is killed after 60 s of silence, so
      # - last_msg_age > 60 (a worker that is alive but silent for longer than
      #   twice the ~30 s a healthy idle subscription peaks at) can only be
      #   reached when wal_receiver_timeout is longer than 60 s or 0. It is
      #   unit-tested only; no scenario reaches it with the default setting.
      # Not while the subscription is failing with errors (LogicalApplyErrors owns that
      # case: the worker restarts every 5 s) and not while the target is
      # absent. Both are expressed here, not as an Alertmanager inhibit, for
      # the reason given at PostgresTargetAbsent. A disabled subscription
      # (enabled 0) never matches.
      - alert: LogicalSubscriptionNotStreaming
        expr: |
          (
            postgresql.subscription.enabled == 1
              and on(service.instance.id, subscription_name)
            (
              avg_over_time(postgresql.subscription.apply_worker_running[1m]) < 0.5
                or on(service.instance.id, subscription_name)
              postgresql.subscription.last_msg_age > 60
            )
          )
            unless on(service.instance.id, subscription_name)
          (
            increase(postgresql.subscription.apply_errors[3m])
              + on(service.instance.id, subscription_name)
            increase(postgresql.subscription.sync_errors[3m]) >= 2
          )
            and on(service.instance.id)
          present_over_time(postgresql.collection.heartbeat[2m])
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Subscription {{ $labels.subscription_name }} on {{ (index $labels "service.instance.id") }} is enabled but not receiving'

      # On the publisher. Inactive for 3 m (a subscriber restart or a worker
      # restart loop resets inactive_seconds and does not match), or more than
      # 128 MiB not yet confirmed for the whole hold time. The bytes branch has
      # no lab scenario (it would need a stuck but connected subscriber and
      # 128 MiB of writes); it is covered by a unit test only. A failing
      # subscription (logical-conflict) restarts its walsender every 5 s, so
      # inactive_seconds stays small and a few rows stay far below the
      # threshold: the slot alert does not fire there, and the scenario
      # asserts that. Physical slots are out of scope here (standby-stopped
      # leaves standby1 inactive on purpose).
      - alert: LogicalSlotRetainingWal
        expr: |
          (
            postgresql.replication_slot.inactive_seconds{slot_type="logical"} > 180
              or on(service.instance.id, slot_name)
            postgresql.replication_slot.unconfirmed_bytes{slot_type="logical"} > 128 * 1024 * 1024
          )
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Logical slot {{ $labels.slot_name }} on {{ (index $labels "service.instance.id") }} is inactive or far behind and retains WAL'

      # Any slot, physical or logical. No lab scenario: invalidation needs
      # max_slot_wal_keep_size exceeded plus a checkpoint on a deliberately
      # stalled slot, too slow for the harness. Unit test only.
      - alert: ReplicationSlotInvalidated
        expr: postgresql.replication_slot.invalidated == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: 'Slot {{ $labels.slot_name }} on {{ (index $labels "service.instance.id") }} is invalidated ({{ $labels.invalidation_reason }})'

  # PgBouncer (stage 2). SHOW POOLS gives the oldest waiting client as whole
  # seconds (maxwait) plus microseconds (maxwait_us); the sum is the wait.
  - name: pgbouncer
    interval: 15s
    rules:
      # PgBouncer has no pack; its heartbeat is the SHOW LISTS row "databases"
      # (never missing while the console answers). Absent only while the
      # Collector that collects it (obenhub.collector) is alive, for the reason given at PostgresTargetAbsent in
      # the pack.
      - alert: PgbouncerTargetAbsent
        expr: |
          obenhub.expected_target{service.name="pgbouncer"}
            unless on(service.instance.id)
          present_over_time(pgbouncer.list.items{list="databases"}[2m])
            and on(obenhub.collector)
          label_replace(present_over_time(otelcol_process_uptime[1m]), "obenhub.collector", "$1", "service.instance.id", "(.+)")
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'No heartbeat from {{ (index $labels "service.instance.id") }}'

      # A client waits for a server connection only when the pool is at
      # pool_size. Over 5 s for 1 m is a lab threshold (assumption: a healthy
      # transaction-mode pool hands over a connection in milliseconds). Not for
      # the console's own pool (database pgbouncer), not for a paused or
      # disabled database (clients wait there by design), and not while the
      # target is absent (stale series); all in the expression, for the reason
      # given at PostgresTargetAbsent in the pack. SHOW DATABASES names the database in
      # `name`; it is copied to `database` to join SHOW POOLS.
      - alert: PgbouncerClientsWaiting
        expr: |
          (
            pgbouncer.pool.maxwait{database!="pgbouncer"}
              + pgbouncer.pool.maxwait_us{database!="pgbouncer"} / 1e6 > 5
          )
            unless on(service.instance.id, database)
          label_copy(
            (pgbouncer.database.paused == 1 or pgbouncer.database.disabled == 1),
            "name", "database"
          )
            and on(service.instance.id)
          present_over_time(pgbouncer.list.items{list="databases"}[2m])
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'PgBouncer pool {{ $labels.database }}/{{ $labels.user }} has a client waiting {{ $value | humanizeDuration }} for a server connection'

      # The three rules below are not for the console (database pgbouncer),
      # not for a paused or disabled database and not while the target is
      # absent, as at PgbouncerClientsWaiting. All thresholds are lab values
      # (assumption: they need tuning against a real workload).
      # A pool at its size with no client queued yet is the warning before
      # clients wait: r is the share of the configured pool_size that is linked
      # to a client, averaged over 5 m (window of 20 points, see the window
      # notes at ConnectionSaturation in lab/packs/postgresql/rules.yml; n
      # requires a full window, so a new pool stays silent while it warms up).
      # sv_active can exceed pool_size when a reserve pool is configured (it is
      # 0 in the lab), so r can pass 1. SHOW DATABASES pool_size shows
      # default_pool_size when the database sets none (PgBouncer 1.26.1).
      - alert: PgbouncerPoolSaturated
        expr: |
          WITH (
            r = pgbouncer.pool.servers_active{database!="pgbouncer"}
              / on(service.instance.id, database) group_left
            label_copy(pgbouncer.database.pool_size > 0, "name", "database"),
            x = avg_over_time(r[5m:15s]),
            n = count_over_time(r[5m:15s])
          )
          ((x >= 0.9) and (n >= 20))
            unless on(service.instance.id, database)
          label_copy(
            (pgbouncer.database.paused == 1 or pgbouncer.database.disabled == 1),
            "name", "database"
          )
            and on(service.instance.id)
          present_over_time(pgbouncer.list.items{list="databases"}[2m])
        labels:
          severity: warning
        annotations:
          summary: 'PgBouncer pool {{ $labels.database }}/{{ $labels.user }} used {{ $value | humanizePercentage }} of its pool_size over 5m'

      # Client connections against max_client_conn, two tiers as at
      # ConnectionSaturation (old for 1m, W' = 75s, 5 points): critical at a
      # ratio of 0.95 or more, warning above 0.85 and below 0.95. used_clients
      # (SHOW LISTS) is every client connection, the console's too. Console
      # connections count towards the limit but are never refused (decide_startup_pool,
      # src/client.c:1086, PgBouncer 1.26.1 commit f03e9bf), so r can exceed 1;
      # the new client is counted before the check, so max_client_conn clients
      # are admitted and the next is refused. A refused client is counted
      # nowhere (it is logged only with log_disconnections) and adds no wait
      # time, so this alert is the only signal. max_db_client_connections and
      # max_user_client_connections (1.24 and later) are 0 in the lab and are
      # not covered. The series has no database label, so there is nothing to
      # exclude or pause. If the SHOW CONFIG query alone fails, the division
      # yields nothing and both tiers go silent while the heartbeat (SHOW
      # LISTS) stays present; not covered.
      - alert: PgbouncerClientSaturation
        expr: |
          WITH (
            r = pgbouncer.list.items{list="used_clients"}
              / on(service.instance.id)
            pgbouncer.config.max_client_conn,
            x = min_over_time(r[75s:15s]),
            n = count_over_time(r[75s:15s])
          )
          (((x > 0.85) unless (x >= 0.95)) and (n >= 5))
            and on(service.instance.id)
          present_over_time(pgbouncer.list.items{list="databases"}[2m])
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} client connections above 85% of max_client_conn'

      - alert: PgbouncerClientSaturation
        expr: |
          WITH (
            r = pgbouncer.list.items{list="used_clients"}
              / on(service.instance.id)
            pgbouncer.config.max_client_conn,
            x = min_over_time(r[75s:15s]),
            n = count_over_time(r[75s:15s])
          )
          ((x >= 0.95) and (n >= 5))
            and on(service.instance.id)
          present_over_time(pgbouncer.list.items{list="databases"}[2m])
        labels:
          severity: critical
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} client connections at or above 95% of max_client_conn; further clients are refused'

      # Average wait per server assignment over 5 m, in seconds. Complements
      # PgbouncerClientsWaiting (oldest waiter over 5 s): many short waits that
      # never reach 5 s. total_wait_time grows when a waiting client is
      # activated (activate_client, src/objects.c:845; microseconds, SHOW
      # STATS). A client that died while queued is activated too, when a
      # server frees up, but gets no assignment: measured 2026-11-08, ending
      # pgbouncer-pool-saturated added about 1046 s of wait with no assignment.
      # Such a lump would dominate the average for the 5 m window, however
      # many assignments dilute it. A lump that large comes only from clients
      # that sat in the queue, so it shows first as maxwait. The rule is silent
      # for a database while, in the last 6 m (the rate window plus one scrape
      # margin), one of its pools had maxwait of 5 s or more for 75 s on end:
      # the run PgbouncerClientsWaiting needs to fire (5 s, for 1m), so that
      # wait already has its alert. Shorter bursts of 5 s or more do not
      # silence it; waits under 5 s each are counted as they are. Without
      # assignments in the window the ratio is +Inf or NaN and never fires.
      - alert: PgbouncerWaitTime
        expr: |
          (
            rate(pgbouncer.stats.wait_time{database!="pgbouncer"}[5m])
              / (rate(pgbouncer.stats.server_assignments{database!="pgbouncer"}[5m]) > 0)
              / 1e6 > 0.1
          )
            unless on(service.instance.id, database)
          max by(service.instance.id, database) (
            max_over_time(
              (min_over_time(pgbouncer.pool.maxwait{database!="pgbouncer"}[75s]) >= 5)[6m:15s]
            )
          )
            unless on(service.instance.id, database)
          label_copy(
            (pgbouncer.database.paused == 1 or pgbouncer.database.disabled == 1),
            "name", "database"
          )
            and on(service.instance.id)
          present_over_time(pgbouncer.list.items{list="databases"}[2m])
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'PgBouncer database {{ $labels.database }}: clients wait {{ $value | humanizeDuration }} on average for a server connection'
