# Pack metric names are provisional until the naming contract (ADR 0002).
# Gating: standby-only rules join on recovery.active == 1, so a primary never
# matches and missing data never fires.
groups:
  - name: inventory
    interval: 15s
    rules:
      - record: obenhub.expected_target
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "slice1", "service.instance.id", "pg-primary"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "slice1", "service.instance.id", "pg-standby"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "slice1", "service.instance.id", "pg-subscriber")
          )

  - name: postgresql
    interval: 15s
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: Always firing; proves the alert pipeline works.

      - alert: PostgresTargetAbsent
        expr: |
          obenhub.expected_target
            unless on(service.instance.id)
          present_over_time(postgresql.collection.heartbeat[2m])
            and on()
          count(present_over_time(otelcol_process_uptime[1m])) > 0
        # A target is absent only while the Collector is alive: the 1m window
        # empties before the 2m one, so a stopped Collector raises only
        # CollectorAbsent. The Alertmanager inhibit alone lost the race in the
        # lab (2026-11-06, collector-stopped): vmalert's startsAt is older than
        # group_wait, so Alertmanager sends at once, in whatever order.
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'No pack heartbeat from {{ (index $labels "service.instance.id") }}'

      - alert: CollectorAbsent
        expr: absent_over_time(otelcol_process_uptime[2m])
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The Collector reports no self-metrics.

      - alert: StandbyNotStreaming
        expr: |
          postgresql.wal_receiver.streaming == 0
            and on(service.instance.id)
          postgresql.recovery.active == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} is in recovery and not streaming'

      - alert: ReplayBacklog
        expr: |
          postgresql.replay.backlog > 16 * 1024 * 1024
            and on(service.instance.id)
          postgresql.recovery.active == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} replay backlog is {{ $value | humanize1024 }}B'

      - alert: SnapshotHeldTooLong
        expr: postgresql.snapshot.oldest_age > 120
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'A snapshot on {{ (index $labels "service.instance.id") }} is {{ $value | humanizeDuration }} old (lab threshold)'

      - alert: ConnectionSaturation
        expr: |
          postgresql.connection.client
            / on(service.instance.id)
          postgresql.connection.client_capacity > 0.85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} client connections above 85% of capacity'

      # Covers the pack and postgresqlreceiver's database.count (a canary for the
      # receiver). `on(__name__)` is not honoured by binary operators, so the metric name
      # is copied into the `metric` label first; that also puts it in the alert.
      # Looks back 1h: a series gone for longer resolves silently; a dead target
      # is still caught by PostgresTargetAbsent. Slot series exist only where
      # slots exist (the primary) and subscription series only on the
      # subscriber; the match is per instance, so a node that never had them
      # is silent. Dropping the last slot or subscription on purpose therefore
      # alerts for up to an hour; that is accepted, not filtered.
      - alert: SeriesVanished
        expr: |
          label_copy(last_over_time({__name__=~"postgresql[.](recovery[.]active|wal_receiver[.]streaming|replay[.](backlog|paused)|snapshot[.]oldest_age|connection[.](client|client_capacity)|database[.]count|replication_slot[.](active|retained_bytes|unconfirmed_bytes|wal_status|invalidated|inactive_seconds)|subscription[.](enabled|apply_worker_running|last_msg_age|apply_errors|sync_errors|conflicts))"}[1h]) keep_metric_names, "__name__", "metric")
            unless on(metric, service.instance.id)
          label_copy(present_over_time({__name__=~"postgresql[.](recovery[.]active|wal_receiver[.]streaming|replay[.](backlog|paused)|snapshot[.]oldest_age|connection[.](client|client_capacity)|database[.]count|replication_slot[.](active|retained_bytes|unconfirmed_bytes|wal_status|invalidated|inactive_seconds)|subscription[.](enabled|apply_worker_running|last_msg_age|apply_errors|sync_errors|conflicts))"}[2m]) keep_metric_names, "__name__", "metric")
            and on(service.instance.id)
          present_over_time(postgresql.collection.heartbeat[2m])
        # Only while the target's heartbeat lives: a dead target or Collector
        # is PostgresTargetAbsent or CollectorAbsent, not one alert per series.
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.metric }} vanished on {{ (index $labels "service.instance.id") }}'

  # Logical replication (stage 2). Thresholds are lab values. Measured in the
  # lab on a healthy idle subscription: last_msg_age peaks near 30 s (the
  # publisher's keepalive at half of wal_sender_timeout = 60 s). A network
  # cut moves apply_error_count by exactly 1 (the apply worker dies on
  # wal_receiver_timeout; measured 42 -> 43), then not again, while a
  # conflict raises it every retry. So two or more errors, not one, mean a
  # failing change.
  - name: logical-replication
    interval: 15s
    rules:
      # apply_error_count rises on every retry of a failing change (measured:
      # +1 about every 5 s, wal_retrieve_retry_interval, for an insert_exists
      # conflict), so two or more over 3 m means the apply worker is failing;
      # a single increase is a timeout or a one-off, and the not-streaming
      # alert covers a dead connection.
      - alert: LogicalApplyErrors
        expr: |
          increase(postgresql.subscription.apply_errors[3m])
            + increase(postgresql.subscription.sync_errors[3m]) >= 2
        labels:
          severity: critical
        annotations:
          summary: 'Subscription {{ $labels.subscription_name }} on {{ (index $labels "service.instance.id") }} has apply or sync errors'

      # An enabled subscription that is not receiving, by either branch:
      # - the apply worker is absent for most of 1 m (avg_over_time < 0.5; the
      #   average smooths the worker restart loop). This is what fires in the
      #   logical-cut scenario: with the default wal_receiver_timeout of 60 s
      #   the worker is killed after 60 s of silence, so
      # - last_msg_age > 60 (a worker that is alive but silent for longer than
      #   twice the ~30 s a healthy idle subscription peaks at) can only be
      #   reached when wal_receiver_timeout is longer than 60 s or 0. It is
      #   unit-tested only; no scenario reaches it with the default setting.
      # Not while the subscription is failing with errors (LogicalApplyErrors owns that
      # case: the worker restarts every 5 s) and not while the target is
      # absent. Both are expressed here, not as an Alertmanager inhibit, for
      # the reason given at PostgresTargetAbsent. A disabled subscription
      # (enabled 0) never matches.
      - alert: LogicalSubscriptionNotStreaming
        expr: |
          (
            postgresql.subscription.enabled == 1
              and on(service.instance.id, subscription_name)
            (
              avg_over_time(postgresql.subscription.apply_worker_running[1m]) < 0.5
                or on(service.instance.id, subscription_name)
              postgresql.subscription.last_msg_age > 60
            )
          )
            unless on(service.instance.id, subscription_name)
          (
            increase(postgresql.subscription.apply_errors[3m])
              + on(service.instance.id, subscription_name)
            increase(postgresql.subscription.sync_errors[3m]) >= 2
          )
            and on(service.instance.id)
          present_over_time(postgresql.collection.heartbeat[2m])
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Subscription {{ $labels.subscription_name }} on {{ (index $labels "service.instance.id") }} is enabled but not receiving'

      # On the publisher. Inactive for 3 m (a subscriber restart or a worker
      # restart loop resets inactive_seconds and does not match), or more than
      # 128 MiB not yet confirmed for the whole hold time. The bytes branch has
      # no lab scenario (it would need a stuck but connected subscriber and
      # 128 MiB of writes); it is covered by a unit test only. A failing
      # subscription (logical-conflict) restarts its walsender every 5 s, so
      # inactive_seconds stays small and a few rows stay far below the
      # threshold: the slot alert does not fire there, and the scenario
      # asserts that. Physical slots are out of scope here (standby-stopped
      # leaves standby1 inactive on purpose).
      - alert: LogicalSlotRetainingWal
        expr: |
          (
            postgresql.replication_slot.inactive_seconds{slot_type="logical"} > 180
              or on(service.instance.id, slot_name)
            postgresql.replication_slot.unconfirmed_bytes{slot_type="logical"} > 128 * 1024 * 1024
          )
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Logical slot {{ $labels.slot_name }} on {{ (index $labels "service.instance.id") }} is inactive or far behind and retains WAL'

      # Any slot, physical or logical. No lab scenario: invalidation needs
      # max_slot_wal_keep_size exceeded plus a checkpoint on a deliberately
      # stalled slot, too slow for the harness. Unit test only.
      - alert: ReplicationSlotInvalidated
        expr: postgresql.replication_slot.invalidated == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: 'Slot {{ $labels.slot_name }} on {{ (index $labels "service.instance.id") }} is invalidated ({{ $labels.invalidation_reason }})'
