# Slice 1 parameter of the pgBackRest pack (lab/packs/pgbackrest/rules.yml):
# the tolerated age of the last completed backup, in seconds. Arithmetic:
# backup interval 600 s (compose.yaml, BACKUP_INTERVAL) + the longest full
# backup seen 53 s (pgbackrest info, 2026-11-13; an incremental took 1 to 4 s)
# + exporter refresh 30 s + Collector scrape 30 s + margin 67 s = 780 s. The
# alert then waits for: 1m on top. A production value is a multiple of the real
# backup interval (the pack default is 26 h). Lab value, to be confirmed by
# the suite.
groups:
  - name: pgbackrest-parameters
    interval: 15s
    rules:
      - record: obenhub.backup_age.limit
        expr: vector(780)
