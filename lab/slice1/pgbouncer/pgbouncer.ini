; Stage 2: PgBouncer in front of database `app` on pg-primary.
; Option names: PgBouncer 1.26 config reference (pgbouncer.org/config.html),
; checked against the image's own sample /etc/pgbouncer/pgbouncer.ini.
; The userlist (client and server passwords) is a Compose config built from
; lab/slice1/.env; no password is in this file.
[databases]
app = host=pg-primary port=5432 dbname=app

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; no logfile or pidfile: the log goes to stdout (docker logs); the unix socket
; stays at its default (/tmp), reachable only inside the container
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; small on purpose, so that saturation is cheap to cause (scenario
; pgbouncer-pool-saturated); far below the primary's max_connections
default_pool_size = 5
max_client_conn = 50
; otel_monitor may run the read-only SHOW commands on the console
; (database pgbouncer); nobody is an admin user
admin_users =
stats_users = otel_monitor
; lib/pq (the Collector's sql_query driver) sends extra_float_digits
ignore_startup_parameters = extra_float_digits
; PgBouncer's default is 120 s, after which a queued client is dropped; the
; saturation scenario needs its queued clients to stay queued
query_wait_timeout = 600
; every Collector scrape and health check would log a login line otherwise
log_connections = 0
log_disconnections = 0
