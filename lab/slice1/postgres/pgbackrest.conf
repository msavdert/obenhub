# pgBackRest configuration of the slice 1 lab, read by the primary (archive-push),
# the pgbackrest-backup service, the pgbackrest-exporter and the throwaway
# restore of the pitr-restore scenario. Option names: pgBackRest 2.60.0
# configuration reference (https://pgbackrest.org/configuration.html).
[global]
repo1-path=/var/lib/pgbackrest
# a lab volume is small: keep two full backups and the WAL they need
repo1-retention-full=2
# immediate checkpoint instead of waiting for the next scheduled one
start-fast=y
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info

[slice1]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
