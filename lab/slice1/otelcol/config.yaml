# Slice 1 collector. Receiver keys: receiver/postgresqlreceiver at v0.164.0.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # filelog offsets survive a Collector restart (volume otelcol-data).
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true

receivers:
  postgresql/primary:
    endpoint: pg-primary:5432
    transport: tcp
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    databases: [postgres]
    collection_interval: 15s
    tls:
      insecure: true
  postgresql/standby:
    endpoint: pg-standby:5432
    transport: tcp
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    databases: [postgres]
    collection_interval: 15s
    tls:
      insecure: true

  postgresql/subscriber:
    endpoint: pg-subscriber:5432
    transport: tcp
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    databases: [postgres]
    collection_interval: 15s
    tls:
      insecure: true

  file_log/primary:
    include: [/var/log/pg-primary/postgresql-*.json]
    start_at: beginning
    storage: file_storage
    operators:
      - &jsonlog
        type: json_parser
        parse_from: body
        # keep integers exact (query_id is a 64-bit integer)
        parse_ints: true
        timestamp:
          parse_from: attributes.timestamp
          layout: '%Y-%m-%d %H:%M:%S.%L %Z'
        severity:
          parse_from: attributes.error_severity
          mapping:
            debug: [DEBUG1, DEBUG2, DEBUG3, DEBUG4, DEBUG5]
            info: [LOG, INFO, NOTICE]
            warn: WARNING
            error: ERROR
            fatal: [FATAL, PANIC]
      # the log body is the server message, not the raw JSON line
      - &body
        type: move
        from: attributes.message
        to: body
  file_log/standby:
    include: [/var/log/pg-standby/postgresql-*.json]
    start_at: beginning
    storage: file_storage
    operators:
      - *jsonlog
      - *body

  file_log/subscriber:
    include: [/var/log/pg-subscriber/postgresql-*.json]
    start_at: beginning
    storage: file_storage
    operators:
      - *jsonlog
      - *body

  # Pack metric names are provisional until the naming contract (ADR 0002).
  # The first three queries return exactly one row, with no FROM at top level;
  # pg_is_in_recovery() only inside CASE. The slot and subscription queries
  # return one row per slot or subscription (none where there are none).
  # All servers share the list through the anchor.
  sql_query/primary:
    driver: postgres
    host: pg-primary
    port: 5432
    database: postgres
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    # Separate queries so one failing query (a revoked function, a
    # missing view) loses only its own metrics while the heartbeat continues.
    queries: &pack_queries
      - sql: SELECT 1 AS collection_heartbeat
        metrics:
          - {metric_name: postgresql.collection.heartbeat, value_column: collection_heartbeat, value_type: int, data_type: gauge, description: "1 whenever the heartbeat query succeeded"}
      - sql: |
          SELECT
            CASE WHEN pg_is_in_recovery() THEN 1 ELSE 0 END AS recovery_active,
            (EXISTS (SELECT 1 FROM pg_stat_wal_receiver WHERE status = 'streaming'))::int AS wal_receiver_streaming,
            CASE WHEN pg_is_in_recovery()
                  THEN coalesce(pg_wal_lsn_diff(pg_last_wal_receive_lsn(), pg_last_wal_replay_lsn()), 0)::float8
                  ELSE 0::float8 END AS replay_backlog,
            CASE WHEN pg_is_in_recovery()
                  THEN (pg_get_wal_replay_pause_state() <> 'not paused')::int
                  ELSE 0 END AS replay_paused
        metrics:
          - {metric_name: postgresql.recovery.active, value_column: recovery_active, value_type: int, data_type: gauge, description: "1 when the server is in recovery"}
          - {metric_name: postgresql.wal_receiver.streaming, value_column: wal_receiver_streaming, value_type: int, data_type: gauge, description: "1 when a WAL receiver is streaming (always 0 on a primary)"}
          - {metric_name: postgresql.replay.backlog, value_column: replay_backlog, value_type: double, data_type: gauge, unit: By, description: "Received but not yet replayed WAL"}
          - {metric_name: postgresql.replay.paused, value_column: replay_paused, value_type: int, data_type: gauge, description: "1 when WAL replay is paused"}
      - sql: |
          SELECT
            coalesce((SELECT max(extract(epoch FROM clock_timestamp() - xact_start))
                        FROM pg_stat_activity
                        WHERE (backend_xmin IS NOT NULL OR backend_xid IS NOT NULL)
                          AND backend_type = 'client backend'
                          AND pid <> pg_backend_pid()), 0)::float8 AS snapshot_oldest_age,
            (SELECT count(*) FROM pg_stat_activity WHERE backend_type = 'client backend')::int AS connection_client,
            (current_setting('max_connections')::int
                - current_setting('superuser_reserved_connections')::int
                - current_setting('reserved_connections')::int) AS connection_client_capacity
        metrics:
          - {metric_name: postgresql.snapshot.oldest_age, value_column: snapshot_oldest_age, value_type: double, data_type: gauge, unit: s, description: "Age of the oldest client transaction holding a snapshot or an xid"}
          - {metric_name: postgresql.connection.client, value_column: connection_client, value_type: int, data_type: gauge, description: "Client backends"}
          - {metric_name: postgresql.connection.client_capacity, value_column: connection_client_capacity, value_type: int, data_type: gauge, description: "max_connections minus reserved slots"}
      # One row per replication slot, on every node. Without a slot there is
      # no series, which is no fault. The current LSN is read with
      # pg_last_wal_receive_lsn() in recovery, where pg_current_wal_lsn() errors.
      # wal_status as a number: 0 reserved, 1 extended, 2 unreserved, 3 lost,
      # -1 none (no restart_lsn). inactive_seconds is 0 while the slot is active.
      - sql: |
          SELECT
            slot_name,
            slot_type,
            active::int AS active,
            coalesce(pg_wal_lsn_diff(CASE WHEN pg_is_in_recovery() THEN pg_last_wal_receive_lsn() ELSE pg_current_wal_lsn() END, restart_lsn), 0)::float8 AS retained_bytes,
            coalesce(pg_wal_lsn_diff(CASE WHEN pg_is_in_recovery() THEN pg_last_wal_receive_lsn() ELSE pg_current_wal_lsn() END, confirmed_flush_lsn), 0)::float8 AS unconfirmed_bytes,
            CASE wal_status WHEN 'reserved' THEN 0 WHEN 'extended' THEN 1 WHEN 'unreserved' THEN 2 WHEN 'lost' THEN 3 ELSE -1 END AS wal_status,
            (invalidation_reason IS NOT NULL)::int AS invalidated,
            coalesce(invalidation_reason, '') AS invalidation_reason,
            coalesce(extract(epoch FROM clock_timestamp() - inactive_since), 0)::float8 AS inactive_seconds
          FROM pg_replication_slots
        metrics:
          - {metric_name: postgresql.replication_slot.active, value_column: active, attribute_columns: [slot_name, slot_type], value_type: int, data_type: gauge, description: "1 when a process is streaming from the slot"}
          - {metric_name: postgresql.replication_slot.retained_bytes, value_column: retained_bytes, attribute_columns: [slot_name, slot_type], value_type: double, data_type: gauge, unit: By, description: "WAL kept for the slot: current LSN minus restart_lsn"}
          - {metric_name: postgresql.replication_slot.unconfirmed_bytes, value_column: unconfirmed_bytes, attribute_columns: [slot_name, slot_type], value_type: double, data_type: gauge, unit: By, description: "Logical slots: current LSN minus confirmed_flush_lsn (0 for physical slots)"}
          - {metric_name: postgresql.replication_slot.wal_status, value_column: wal_status, attribute_columns: [slot_name, slot_type], value_type: int, data_type: gauge, description: "0 reserved, 1 extended, 2 unreserved, 3 lost, -1 none"}
          - {metric_name: postgresql.replication_slot.invalidated, value_column: invalidated, attribute_columns: [slot_name, slot_type, invalidation_reason], value_type: int, data_type: gauge, description: "1 when the slot is invalidated; the reason is an attribute"}
          - {metric_name: postgresql.replication_slot.inactive_seconds, value_column: inactive_seconds, attribute_columns: [slot_name, slot_type], value_type: double, data_type: gauge, unit: s, description: "Seconds since the slot became inactive (0 while active)"}
      # One row per subscription, built from pg_subscription so a subscription
      # without a worker still reports (apply_worker_running 0). Only subname
      # and subenabled are read: subconninfo is not readable by pg_monitor.
      # last_msg_age is 0 while there is no apply worker row.
      - sql: |
          SELECT
            s.subname AS subscription_name,
            s.subenabled::int AS enabled,
            (EXISTS (SELECT 1 FROM pg_stat_subscription a WHERE a.subid = s.oid AND a.worker_type = 'apply' AND a.pid IS NOT NULL))::int AS apply_worker_running,
            coalesce((SELECT extract(epoch FROM clock_timestamp() - max(a.last_msg_receipt_time)) FROM pg_stat_subscription a WHERE a.subid = s.oid AND a.worker_type = 'apply'), 0)::float8 AS last_msg_age,
            coalesce(t.apply_error_count, 0)::bigint AS apply_errors,
            coalesce(t.sync_error_count, 0)::bigint AS sync_errors
          FROM pg_subscription s
          LEFT JOIN pg_stat_subscription_stats t ON t.subid = s.oid
        metrics:
          - {metric_name: postgresql.subscription.enabled, value_column: enabled, attribute_columns: [subscription_name], value_type: int, data_type: gauge, description: "1 when the subscription is enabled"}
          - {metric_name: postgresql.subscription.apply_worker_running, value_column: apply_worker_running, attribute_columns: [subscription_name], value_type: int, data_type: gauge, description: "1 when an apply worker process exists for the subscription"}
          - {metric_name: postgresql.subscription.last_msg_age, value_column: last_msg_age, attribute_columns: [subscription_name], value_type: double, data_type: gauge, unit: s, description: "Seconds since the apply worker last received a message from the publisher (0 without a worker)"}
          - {metric_name: postgresql.subscription.apply_errors, value_column: apply_errors, attribute_columns: [subscription_name], value_type: int, data_type: sum, monotonic: true, aggregation: cumulative, description: "pg_stat_subscription_stats.apply_error_count"}
          - {metric_name: postgresql.subscription.sync_errors, value_column: sync_errors, attribute_columns: [subscription_name], value_type: int, data_type: sum, monotonic: true, aggregation: cumulative, description: "pg_stat_subscription_stats.sync_error_count"}
      # The seven PostgreSQL 18 conflict counters as one metric.
      - sql: |
          SELECT t.subname AS subscription_name, c.conflict_type, c.n::bigint AS conflicts
          FROM pg_stat_subscription_stats t
          CROSS JOIN LATERAL (VALUES
            ('insert_exists', t.confl_insert_exists),
            ('update_origin_differs', t.confl_update_origin_differs),
            ('update_exists', t.confl_update_exists),
            ('update_missing', t.confl_update_missing),
            ('delete_origin_differs', t.confl_delete_origin_differs),
            ('delete_missing', t.confl_delete_missing),
            ('multiple_unique_conflicts', t.confl_multiple_unique_conflicts)
          ) AS c(conflict_type, n)
        metrics:
          - {metric_name: postgresql.subscription.conflicts, value_column: conflicts, attribute_columns: [subscription_name, conflict_type], value_type: int, data_type: sum, monotonic: true, aggregation: cumulative, description: "pg_stat_subscription_stats confl_* counters, by conflict type"}
  sql_query/standby:
    driver: postgres
    host: pg-standby
    port: 5432
    database: postgres
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    queries: *pack_queries
  sql_query/subscriber:
    driver: postgres
    host: pg-subscriber
    port: 5432
    database: postgres
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    queries: *pack_queries

  # PgBouncer has no metrics endpoint (pgbouncer#1354): the receiver queries
  # the admin console, database `pgbouncer`, as the stats user otel_monitor.
  # The console speaks only the simple query protocol (pgbouncer.org/usage);
  # sql_query sends queries without arguments, which lib/pq runs as simple
  # queries. SHOW cannot be selected from, so maxwait (whole seconds) and
  # maxwait_us (the microseconds beyond them) are two metrics. The pool of the
  # console itself (database pgbouncer) is in SHOW POOLS too. Measured
  # 2026-11-07 (v0.164.0): the receiver reads every column of a row, and
  # SHOW returns NULL in some (load_balance_hosts, host, pool_mode of a
  # database without one). That logs one "problems encountered getting metric
  # rows" warning per scrape and row, but the row is still emitted when the
  # columns used are not NULL; hence no pool_mode attribute here.
  sql_query/pgbouncer:
    driver: postgres
    host: pgbouncer
    port: 6432
    database: pgbouncer
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    queries:
      - sql: SHOW POOLS
        metrics:
          - {metric_name: pgbouncer.pool.clients_active, value_column: cl_active, attribute_columns: [database, user], value_type: int, data_type: gauge, description: "Client connections linked to a server connection"}
          - {metric_name: pgbouncer.pool.clients_waiting, value_column: cl_waiting, attribute_columns: [database, user], value_type: int, data_type: gauge, description: "Client connections waiting for a server connection"}
          - {metric_name: pgbouncer.pool.servers_active, value_column: sv_active, attribute_columns: [database, user], value_type: int, data_type: gauge, description: "Server connections linked to a client"}
          - {metric_name: pgbouncer.pool.servers_idle, value_column: sv_idle, attribute_columns: [database, user], value_type: int, data_type: gauge, description: "Server connections unused and immediately usable"}
          - {metric_name: pgbouncer.pool.servers_used, value_column: sv_used, attribute_columns: [database, user], value_type: int, data_type: gauge, description: "Server connections idle for more than server_check_delay"}
          - {metric_name: pgbouncer.pool.servers_login, value_column: sv_login, attribute_columns: [database, user], value_type: int, data_type: gauge, description: "Server connections currently logging in"}
          - {metric_name: pgbouncer.pool.maxwait, value_column: maxwait, attribute_columns: [database, user], value_type: int, data_type: gauge, unit: s, description: "Whole seconds the oldest waiting client has waited; add maxwait_us / 1e6"}
          - {metric_name: pgbouncer.pool.maxwait_us, value_column: maxwait_us, attribute_columns: [database, user], value_type: int, data_type: gauge, unit: us, description: "Microseconds beyond maxwait"}
      - sql: SHOW DATABASES
        metrics:
          - {metric_name: pgbouncer.database.pool_size, value_column: pool_size, attribute_columns: [name], value_type: int, data_type: gauge, description: "Configured maximum server connections per user pool"}
          - {metric_name: pgbouncer.database.connections, value_column: current_connections, attribute_columns: [name], value_type: int, data_type: gauge, description: "Current server connections to the database"}
          - {metric_name: pgbouncer.database.paused, value_column: paused, attribute_columns: [name], value_type: int, data_type: gauge, description: "1 when the database is paused"}
          - {metric_name: pgbouncer.database.disabled, value_column: disabled, attribute_columns: [name], value_type: int, data_type: gauge, description: "1 when the database is disabled"}
      # Heartbeat: SHOW LISTS always has a row "databases" (a count, at least
      # the console itself); any answer from the console proves it is up.
      - sql: SHOW LISTS
        metrics:
          - {metric_name: pgbouncer.list.items, value_column: items, attribute_columns: [list], value_type: int, data_type: gauge, description: "Count per SHOW LISTS entry"}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # Attribute names are assumptions: service.* and db.system.name follow the
  # semantic conventions as remembered, db.cluster.name is a guess. No role
  # attribute on purpose: a standby can be promoted.
  resource/primary:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: postgresql, action: upsert}
      - {key: service.instance.id, value: pg-primary, action: upsert}
      - {key: server.address, value: pg-primary, action: upsert}
      - {key: server.port, value: '5432', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: db.cluster.name, value: slice1, action: upsert}
  resource/standby:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: postgresql, action: upsert}
      - {key: service.instance.id, value: pg-standby, action: upsert}
      - {key: server.address, value: pg-standby, action: upsert}
      - {key: server.port, value: '5432', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: db.cluster.name, value: slice1, action: upsert}
  resource/subscriber:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: postgresql, action: upsert}
      - {key: service.instance.id, value: pg-subscriber, action: upsert}
      - {key: server.address, value: pg-subscriber, action: upsert}
      - {key: server.port, value: '5432', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: db.cluster.name, value: slice1, action: upsert}
  resource/pgbouncer:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: pgbouncer, action: upsert}
      - {key: service.instance.id, value: pgbouncer, action: upsert}
      - {key: server.address, value: pgbouncer, action: upsert}
      - {key: server.port, value: '6432', action: upsert}
      - {key: db.system.name, value: pgbouncer, action: upsert}
      - {key: db.cluster.name, value: slice1, action: upsert}
  batch: {}

exporters:
  otlp_http/vm:
    endpoint: http://victoriametrics:8428/opentelemetry
  otlp_http/vl:
    endpoint: http://victorialogs:9428/insert/opentelemetry
    headers:
      VL-Stream-Fields: service.namespace,service.name,service.instance.id

service:
  extensions: [health_check, file_storage]
  telemetry:
    resource:
      attributes:
        - {name: service.namespace, value: obenhub-lab}
        - {name: service.name, value: otelcol}
        - {name: service.instance.id, value: otelcol-slice1}
    metrics:
      level: normal
      readers:
        - periodic:
            interval: 15000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
  pipelines:
    metrics/primary:
      receivers: [postgresql/primary, sql_query/primary]
      processors: [memory_limiter, resource/primary, batch]
      exporters: [otlp_http/vm]
    metrics/standby:
      receivers: [postgresql/standby, sql_query/standby]
      processors: [memory_limiter, resource/standby, batch]
      exporters: [otlp_http/vm]
    metrics/subscriber:
      receivers: [postgresql/subscriber, sql_query/subscriber]
      processors: [memory_limiter, resource/subscriber, batch]
      exporters: [otlp_http/vm]
    metrics/pgbouncer:
      receivers: [sql_query/pgbouncer]
      processors: [memory_limiter, resource/pgbouncer, batch]
      exporters: [otlp_http/vm]
    logs/primary:
      receivers: [file_log/primary]
      processors: [memory_limiter, resource/primary, batch]
      exporters: [otlp_http/vl]
    logs/standby:
      receivers: [file_log/standby]
      processors: [memory_limiter, resource/standby, batch]
      exporters: [otlp_http/vl]
    logs/subscriber:
      receivers: [file_log/subscriber]
      processors: [memory_limiter, resource/subscriber, batch]
      exporters: [otlp_http/vl]
