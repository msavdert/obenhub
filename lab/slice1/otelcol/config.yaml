# Slice 1 collector. Receiver keys: receiver/postgresqlreceiver and
# receiver/prometheusreceiver at v0.164.0.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # filelog offsets survive a Collector restart (volume otelcol-data).
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true

receivers:
  postgresql/primary:
    endpoint: pg-primary:5432
    transport: tcp
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    # The workload lives in database app; postgres holds the administrative
    # objects. The receiver connects to each listed database.
    databases: [postgres, app]
    collection_interval: 15s
    # Optional upstream metric, off by default (receiver metadata, v0.164.0).
    metrics:
      postgresql.deadlocks:
        enabled: true
    tls:
      insecure: true
  postgresql/standby:
    endpoint: pg-standby:5432
    transport: tcp
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    # The workload lives in database app; postgres holds the administrative
    # objects. The receiver connects to each listed database.
    databases: [postgres, app]
    collection_interval: 15s
    # Optional upstream metric, off by default (receiver metadata, v0.164.0).
    metrics:
      postgresql.deadlocks:
        enabled: true
    tls:
      insecure: true

  postgresql/subscriber:
    endpoint: pg-subscriber:5432
    transport: tcp
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    # The workload lives in database app; postgres holds the administrative
    # objects. The receiver connects to each listed database.
    databases: [postgres, app]
    collection_interval: 15s
    # Optional upstream metric, off by default (receiver metadata, v0.164.0).
    metrics:
      postgresql.deadlocks:
        enabled: true
    tls:
      insecure: true

  file_log/primary:
    include: [/var/log/pg-primary/postgresql-*.json]
    start_at: beginning
    storage: file_storage
    operators:
      - &jsonlog
        type: json_parser
        parse_from: body
        # keep integers exact (query_id is a 64-bit integer)
        parse_ints: true
        timestamp:
          parse_from: attributes.timestamp
          layout: '%Y-%m-%d %H:%M:%S.%L %Z'
        severity:
          parse_from: attributes.error_severity
          mapping:
            debug: [DEBUG1, DEBUG2, DEBUG3, DEBUG4, DEBUG5]
            info: [LOG, INFO, NOTICE]
            warn: WARNING
            error: ERROR
            fatal: [FATAL, PANIC]
      # the log body is the server message, not the raw JSON line
      - &body
        type: move
        from: attributes.message
        to: body
  file_log/standby:
    include: [/var/log/pg-standby/postgresql-*.json]
    start_at: beginning
    storage: file_storage
    operators:
      - *jsonlog
      - *body

  file_log/subscriber:
    include: [/var/log/pg-subscriber/postgresql-*.json]
    start_at: beginning
    storage: file_storage
    operators:
      - *jsonlog
      - *body

  # The query list is the shared PostgreSQL pack, packs/postgresql/
  # queries.yaml, mounted at /etc/otelcol/packs/postgresql; all three servers
  # use it. The slow tier (queries-slow.yaml, every 5 minutes) reads database
  # app, the only one with tables, once per server (pg_stat_user_tables shows
  # the connected database only); a standby answers the heartbeat only.
  sql_query/primary:
    driver: postgres
    host: pg-primary
    port: 5432
    database: postgres
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    queries: ${file:/etc/otelcol/packs/postgresql/queries.yaml}
  sql_query/primary-slow:
    driver: postgres
    host: pg-primary
    port: 5432
    database: app
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 1
    collection_interval: 5m
    timeout: 60s
    queries: ${file:/etc/otelcol/packs/postgresql/queries-slow.yaml}
  sql_query/standby:
    driver: postgres
    host: pg-standby
    port: 5432
    database: postgres
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    queries: ${file:/etc/otelcol/packs/postgresql/queries.yaml}
  sql_query/standby-slow:
    driver: postgres
    host: pg-standby
    port: 5432
    database: app
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 1
    collection_interval: 5m
    timeout: 60s
    queries: ${file:/etc/otelcol/packs/postgresql/queries-slow.yaml}
  sql_query/subscriber:
    driver: postgres
    host: pg-subscriber
    port: 5432
    database: postgres
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    queries: ${file:/etc/otelcol/packs/postgresql/queries.yaml}
  sql_query/subscriber-slow:
    driver: postgres
    host: pg-subscriber
    port: 5432
    database: app
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 1
    collection_interval: 5m
    timeout: 60s
    queries: ${file:/etc/otelcol/packs/postgresql/queries-slow.yaml}

  # PgBouncer has no metrics endpoint (pgbouncer#1354): the receiver queries
  # the admin console, database `pgbouncer`, as the stats user otel_monitor.
  # The console speaks only the simple query protocol (pgbouncer.org/usage);
  # sql_query sends queries without arguments, which lib/pq runs as simple
  # queries. SHOW cannot be selected from, so maxwait (whole seconds) and
  # maxwait_us (the microseconds beyond them) are two metrics. The pool of the
  # console itself (database pgbouncer) is in SHOW POOLS too. Measured
  # 2026-11-07 (v0.164.0): the receiver reads every column of a row, and
  # SHOW returns NULL in some (load_balance_hosts, host, pool_mode of a
  # database without one). That logs one "problems encountered getting metric
  # rows" warning per scrape and row, but the row is still emitted when the
  # columns used are not NULL; hence no pool_mode attribute here.
  sql_query/pgbouncer:
    driver: postgres
    host: pgbouncer
    port: 6432
    database: pgbouncer
    username: otel_monitor
    password: ${env:OTEL_MONITOR_PASSWORD}
    additional_params:
      sslmode: disable
    max_open_conn: 3
    collection_interval: 15s
    timeout: 10s
    # The query list is packs/pgbouncer/queries.yaml, mounted at
    # /etc/otelcol/packs/pgbouncer; the processors below rename its columns.
    queries: ${file:/etc/otelcol/packs/pgbouncer/queries.yaml}

  # pgBackRest backup state. Contrib has no pgBackRest receiver, so this is the
  # generic prometheusreceiver scraping woblerr/pgbackrest_exporter v0.25.0
  # (ADR 0007). The exporter refreshes its data every 30 s (--collect.interval),
  # so scraping faster gains nothing. Metric names arrive as the exporter
  # defines them (ADR 0006). Only the series that an alert or the dashboard
  # reads are kept (the exporter also exports per-backup sizes, database
  # counts and Go runtime metrics).
  prometheus/pgbackrest:
    config:
      scrape_configs:
        - job_name: pgbackrest
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['pgbackrest-exporter:9854']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'up|pgbackrest_(backup_since_last_completion_seconds|backup_last_error_status|stanza_status|repo_status|exporter_status|version_info)'
              action: keep

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # Attribute names: service.* and db.system.name follow the semantic
  # conventions, obenhub.cluster.name is a project attribute (ADR 0006). No role
  # attribute on purpose: a standby can be promoted.
  resource/primary:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: postgresql, action: upsert}
      - {key: service.instance.id, value: pg-primary, action: upsert}
      - {key: server.address, value: pg-primary, action: upsert}
      - {key: server.port, value: '5432', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: obenhub.cluster.name, value: slice1, action: upsert}
  resource/standby:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: postgresql, action: upsert}
      - {key: service.instance.id, value: pg-standby, action: upsert}
      - {key: server.address, value: pg-standby, action: upsert}
      - {key: server.port, value: '5432', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: obenhub.cluster.name, value: slice1, action: upsert}
  # A logical subscriber is a cluster of its own: it is not a member of the
  # streaming pair, so it must not share obenhub.cluster.name with it
  # (PostgresMultiplePrimaries counts writable members per obenhub.cluster.name).
  resource/subscriber:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: postgresql, action: upsert}
      - {key: service.instance.id, value: pg-subscriber, action: upsert}
      - {key: server.address, value: pg-subscriber, action: upsert}
      - {key: server.port, value: '5432', action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: obenhub.cluster.name, value: slice1-subscriber, action: upsert}
  resource/pgbouncer:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: pgbouncer, action: upsert}
      - {key: service.instance.id, value: pgbouncer, action: upsert}
      - {key: server.address, value: pgbouncer, action: upsert}
      - {key: server.port, value: '6432', action: upsert}
      - {key: db.system.name, value: pgbouncer, action: upsert}
      - {key: obenhub.cluster.name, value: slice1, action: upsert}
  resource/pgbackrest:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: pgbackrest, action: upsert}
      - {key: service.instance.id, value: pgbackrest, action: upsert}
      - {key: server.address, value: pgbackrest-exporter, action: upsert}
      - {key: server.port, value: '9854', action: upsert}
      - {key: obenhub.cluster.name, value: slice1, action: upsert}
  # SHOW output cannot be aliased in SQL, so the console's column names are
  # renamed here: database (SHOW POOLS, SHOW STATS) and name (SHOW DATABASES)
  # are the same thing. `insert` keeps an existing value and does nothing when
  # the source attribute is absent. Checked with synthetic OTLP input in the
  # contrib 0.164.0 image; the check against the live PgBouncer is pending the
  # next slice1 suite.
  attributes/pgbouncer:
    actions:
      - {key: pgbouncer.database.name, from_attribute: database, action: insert}
      - {key: pgbouncer.database.name, from_attribute: name, action: insert}
      - {key: user.name, from_attribute: user, action: insert}
      - {key: pgbouncer.list.name, from_attribute: list, action: insert}
      - {key: database, action: delete}
      - {key: name, action: delete}
      - {key: user, action: delete}
      - {key: list, action: delete}
  # SHOW STATS and SHOW POOLS report microseconds; the pack queries declare
  # unit us so that this condition finds them, and the values leave the
  # Collector in seconds. Order matters: the datapoint statement runs first,
  # while metric.unit is still us, then the metric statement changes the unit.
  # Checked with synthetic OTLP input in the contrib 0.164.0 image; the check
  # against the live PgBouncer is pending the next slice1 suite.
  transform/pgbouncer-seconds:
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.value_double, Double(datapoint.value_int) / 1000000.0) where metric.unit == "us"
      - context: metric
        statements:
          - set(metric.unit, "s") where metric.unit == "us"
  batch: {}

exporters:
  otlp_http/vm:
    endpoint: http://victoriametrics:8428/opentelemetry
  otlp_http/vl:
    endpoint: http://victorialogs:9428/insert/opentelemetry
    headers:
      VL-Stream-Fields: service.namespace,service.name,service.instance.id

service:
  extensions: [health_check, file_storage]
  telemetry:
    resource:
      attributes:
        - {name: service.namespace, value: obenhub-lab}
        - {name: service.name, value: otelcol}
        - {name: service.instance.id, value: otelcol-slice1}
    metrics:
      level: normal
      readers:
        - periodic:
            interval: 15000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
  pipelines:
    metrics/primary:
      receivers: [postgresql/primary, sql_query/primary, sql_query/primary-slow]
      processors: [memory_limiter, resource/primary, batch]
      exporters: [otlp_http/vm]
    metrics/standby:
      receivers: [postgresql/standby, sql_query/standby, sql_query/standby-slow]
      processors: [memory_limiter, resource/standby, batch]
      exporters: [otlp_http/vm]
    metrics/subscriber:
      receivers: [postgresql/subscriber, sql_query/subscriber, sql_query/subscriber-slow]
      processors: [memory_limiter, resource/subscriber, batch]
      exporters: [otlp_http/vm]
    metrics/pgbouncer:
      receivers: [sql_query/pgbouncer]
      processors: [memory_limiter, attributes/pgbouncer, transform/pgbouncer-seconds, resource/pgbouncer, batch]
      exporters: [otlp_http/vm]
    metrics/pgbackrest:
      receivers: [prometheus/pgbackrest]
      processors: [memory_limiter, resource/pgbackrest, batch]
      exporters: [otlp_http/vm]
    logs/primary:
      receivers: [file_log/primary]
      processors: [memory_limiter, resource/primary, batch]
      exporters: [otlp_http/vl]
    logs/standby:
      receivers: [file_log/standby]
      processors: [memory_limiter, resource/standby, batch]
      exporters: [otlp_http/vl]
    logs/subscriber:
      receivers: [file_log/subscriber]
      processors: [memory_limiter, resource/subscriber, batch]
      exporters: [otlp_http/vl]
