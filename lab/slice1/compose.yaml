# Slice 1, step A: PostgreSQL 18 primary + standby -> one OpenTelemetry
# Collector -> VictoriaMetrics (metrics) and VictoriaLogs (jsonlog lines).
# Stage 2 adds a logical subscriber (pg-subscriber) and PgBouncer on the same
# stack.
# Start with `mise run lab:up` (creates .env with random passwords).
name: obenhub-slice1

x-postgres: &postgres
  # postgres/Dockerfile: the pinned postgres image plus pgBackRest 2.60.0 (PGDG)
  build:
    context: ./postgres
  image: obenhub-slice1-postgres:18.7-pgbackrest-2.60.0
  entrypoint: ["/entrypoint.sh"]
  shm_size: 256mb
  # same as stage 3; observed use of the slice 1 containers is far below it (docker stats, 2026-11-11)
  mem_limit: 768m
  restart: unless-stopped
  # tini as PID 1 reaps orphans. Without it the postmaster is PID 1 and adopts
  # the processes left by `docker exec -d` in the scenarios; killing one of
  # them made it log "untracked child process ... signal 15" and crash-restart
  # the server (found 2026-11-08).
  init: true
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -q"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s

x-postgres-command: &postgres-command
  - postgres
  - -c
  - shared_preload_libraries=pg_stat_statements
  - -c
  - logging_collector=on
  - -c
  - log_destination=jsonlog
  - -c
  - log_directory=/var/log/postgresql
  - -c
  - log_filename=postgresql-%a.log
  - -c
  - log_file_mode=0644
  - -c
  - log_truncate_on_rotation=on
  - -c
  - log_lock_waits=on
  - -c
  - deadlock_timeout=1s
  - -c
  - log_min_duration_statement=1000
  - -c
  - track_io_timing=on
  - -c
  - hot_standby_feedback=off
  # logical is needed on the publisher only; the command is shared by every
  # node, so all of them run it (a little more WAL than replica; not measured).
  - -c
  - wal_level=logical
  - -c
  - max_wal_senders=5
  - -c
  - max_replication_slots=5
  # Monitoring role peak: sql_query max_open_conn 3 plus postgresqlreceiver,
  # assumed up to 5 from reading scraper.go (not measured; 3 seen live).
  - -c
  - reserved_connections=8
  - -c
  - max_slot_wal_keep_size=1GB
  # incremental pg_basebackup (scenario basebackup-compare) needs WAL
  # summaries on the source; the command is shared, so every node writes them
  # (a small summary file per checkpoint; not measured). sighup context.
  - -c
  - summarize_wal=on
  # WAL archiving is set per node by entrypoint.sh (ARCHIVE_STANZA): only the
  # primary archives, with pgBackRest (ADR 0007). The standby would archive
  # only after a promotion and the subscriber is another cluster.

services:
  pg-primary:
    <<: *postgres
    container_name: obenhub-slice1-pg-primary
    command: *postgres-command
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
      REPLICATOR_PASSWORD: "${REPLICATOR_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
      OTEL_MONITOR_PASSWORD: "${OTEL_MONITOR_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
      LOGICAL_PASSWORD: "${LOGICAL_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
      APP_PASSWORD: "${APP_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
      ARCHIVE_STANZA: slice1
    volumes:
      - primary-data:/var/lib/postgresql
      - primary-log:/var/log/postgresql
      - primary-run:/var/run/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./postgres/entrypoint.sh:/entrypoint.sh:ro
      - ./postgres/10-init-primary.sh:/docker-entrypoint-initdb.d/10-init-primary.sh:ro
      # outside /docker-entrypoint-initdb.d: the image would also run it in `postgres`
      - ./postgres/app-schema.sql:/opt/obenhub/app-schema.sql:ro
    networks:
      repl:
        aliases: [pg-primary-repl]
      logical:
        aliases: [pg-primary-logical]
      mon: {}

  pg-standby:
    <<: *postgres
    container_name: obenhub-slice1-pg-standby
    command: *postgres-command
    depends_on:
      pg-primary:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
      REPLICATOR_PASSWORD: "${REPLICATOR_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
      STANDBY_OF: pg-primary-repl
    volumes:
      - standby-data:/var/lib/postgresql
      - standby-log:/var/log/postgresql
      - ./postgres/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - repl
      - mon

  # Logical subscriber: database `app`, subscription app_sub (so the slot on
  # the primary is app_sub). Not a physical standby: its own data directory.
  pg-subscriber:
    <<: *postgres
    container_name: obenhub-slice1-pg-subscriber
    command: *postgres-command
    depends_on:
      pg-primary:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
      OTEL_MONITOR_PASSWORD: "${OTEL_MONITOR_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
      LOGICAL_PASSWORD: "${LOGICAL_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
    volumes:
      - subscriber-data:/var/lib/postgresql
      - subscriber-log:/var/log/postgresql
      - ./postgres/entrypoint.sh:/entrypoint.sh:ro
      - ./postgres/10-init-subscriber.sh:/docker-entrypoint-initdb.d/10-init-subscriber.sh:ro
      - ./postgres/app-schema.sql:/opt/obenhub/app-schema.sql:ro
    networks:
      - logical
      - mon

  # Connection pooler for database `app`. Image: CloudNativePG's PgBouncer
  # 1.26.1 (image label Apache-2.0; PgBouncer itself is ISC, see
  # /usr/share/doc/pgbouncer/copyright in the image). Runs as uid 998
  # (pgbouncer); the entrypoint is /usr/bin/pgbouncer with the config path as
  # its argument. The image is multi-arch (amd64, arm64). It has no metrics
  # endpoint: the Collector queries the admin console (database pgbouncer).
  pgbouncer:
    image: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:3164c7e929c05deef00175c0bb81f3446a59f7254715b43a865ec8cdb83f869e
    container_name: obenhub-slice1-pgbouncer
    mem_limit: 64m
    restart: unless-stopped
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    configs:
      - source: pgbouncer-userlist
        target: /etc/pgbouncer/userlist.txt
        mode: 0444
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U otel_monitor -d pgbouncer -q"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - mon

  # pgBackRest backups of the primary: creates the stanza, then keeps one
  # backup per BACKUP_INTERVAL seconds, scheduled from the repository (full
  # when none exists or the last full is older than FULL_EVERY intervals, else
  # incremental; see postgres/pgbackrest-backup.sh). Local mode: it reads the primary's data volume (read-only) and
  # talks to the server over the socket volume. `docker compose stop` of this
  # service is how the backup-stale scenario stops backups. The 600 s interval
  # (checkpoint_timeout is 300 s, assumed default) keeps the immediate
  # checkpoint of each backup from adding up to the requested-checkpoint
  # alert's threshold (more than 3 in 5 minutes, PostgresCheckpointsRequested).
  # Scenarios that count checkpoints pause the service (pause_backups in
  # scenarios/lib.sh).
  pgbackrest-backup:
    image: obenhub-slice1-postgres:18.7-pgbackrest-2.60.0
    container_name: obenhub-slice1-pgbackrest-backup
    user: postgres
    init: true
    entrypoint: ["/opt/obenhub/pgbackrest-backup.sh"]
    environment:
      BACKUP_INTERVAL: "600"
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      pg-primary:
        condition: service_healthy
    volumes:
      - primary-data:/var/lib/postgresql:ro
      - primary-run:/var/run/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./postgres/pgbackrest-backup.sh:/opt/obenhub/pgbackrest-backup.sh:ro
    network_mode: none

  # woblerr/pgbackrest_exporter v0.25.0 (MIT): runs `pgbackrest info` against
  # the repository and serves Prometheus metrics, scraped by the Collector.
  # The image bundles pgBackRest 2.60.0 (the version of the primary image).
  # It starts as root, then runs as BACKREST_USER; uid and gid 999 are the
  # postgres user of the postgres image, the owner of the repository.
  # --collect.interval 30 s: the info run is cheap on a lab repository, and a
  # backup that finished is visible within one exporter refresh plus one
  # Collector scrape (30 s each), small against the 780 s stale threshold of the
  # lab.
  pgbackrest-exporter:
    image: woblerr/pgbackrest_exporter:v0.25.0@sha256:6d8182f96020d8713caa365b743d3a39e1639ac759920aa5a2ee23bffc4f479d
    container_name: obenhub-slice1-pgbackrest-exporter
    environment:
      BACKREST_USER: postgres
      BACKREST_GROUP: postgres
      BACKREST_UID: "999"
      BACKREST_GID: "999"
      COLLECT_INTERVAL: "30"
      STANZA_INCLUDE: slice1
    mem_limit: 128m
    restart: unless-stopped
    volumes:
      - pgbackrest-repo:/var/lib/pgbackrest:ro
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    networks:
      - mon

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    container_name: obenhub-slice1-otelcol
    mem_limit: 384m
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OTEL_MONITOR_PASSWORD: "${OTEL_MONITOR_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
      - ../packs/postgresql/queries.yaml:/etc/otelcol/packs/postgresql/queries.yaml:ro
      - otelcol-data:/var/lib/otelcol
      - primary-log:/var/log/pg-primary:ro
      - standby-log:/var/log/pg-standby:ro
      - subscriber-log:/var/log/pg-subscriber:ro
    depends_on:
      otelcol-init:
        condition: service_completed_successfully
      pg-primary:
        condition: service_healthy
      pg-standby:
        condition: service_healthy
      pg-subscriber:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      pgbackrest-exporter:
        condition: service_started
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_started
    networks:
      - mon

  # one-shot: the Collector (uid 10001) must own its file_storage volume
  otelcol-init:
    image: postgres:18.7-trixie@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
    container_name: obenhub-slice1-otelcol-init
    user: root
    network_mode: none
    entrypoint: ["chown", "10001:10001", "/var/lib/otelcol"]
    volumes:
      - otelcol-data:/var/lib/otelcol
    restart: "no"

  victoriametrics:
    extends:
      file: ../mon/compose.base.yaml
      service: victoriametrics
    container_name: obenhub-slice1-victoriametrics
    ports:
      - "127.0.0.1:18428:8428"

  victorialogs:
    extends:
      file: ../mon/compose.base.yaml
      service: victorialogs
    container_name: obenhub-slice1-victorialogs
    ports:
      - "127.0.0.1:19428:9428"

  vmalert:
    extends:
      file: ../mon/compose.base.yaml
      service: vmalert
    container_name: obenhub-slice1-vmalert
    command:
      - -datasource.url=http://victoriametrics:8428
      - -remoteWrite.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -rule=/etc/vmalert/rules/*.yml
      - -rule=/etc/vmalert/pack/rules.yml
      - -rule=/etc/vmalert/pgbackrest/rules.yml
      - -evaluationInterval=15s
    ports:
      - "127.0.0.1:18880:8880"
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
      - ../packs/postgresql/rules.yml:/etc/vmalert/pack/rules.yml:ro
      - ../packs/pgbackrest/rules.yml:/etc/vmalert/pgbackrest/rules.yml:ro

  alertmanager:
    extends:
      file: ../mon/compose.base.yaml
      service: alertmanager
    container_name: obenhub-slice1-alertmanager
    ports:
      - "127.0.0.1:19093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    extends:
      file: ../mon/compose.base.yaml
      service: grafana
    container_name: obenhub-slice1-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?run: mise run lab:up (it generates lab/slice1/.env)}"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./grafana/dashboards:/var/lib/obenhub/dashboards:ro

configs:
  # Passwords in clear text: PgBouncer logs in to the servers with them. The
  # file exists only inside the container; compose fills it from .env.
  pgbouncer-userlist:
    content: |
      "app" "${APP_PASSWORD}"
      "otel_monitor" "${OTEL_MONITOR_PASSWORD}"

networks:
  # replication-only network: fixed subnet, no route out; pg_hba allows only it
  repl:
    internal: true
    ipam:
      config:
        - subnet: 10.213.0.0/24
  # logical-replication-only network: a cut here leaves the physical standby
  # and monitoring alone. Subnet is the one pg_hba allows for logical_repl.
  logical:
    internal: true
    ipam:
      config:
        - subnet: 10.214.0.0/24
  mon: {}

volumes:
  primary-data: {}
  standby-data: {}
  primary-log: {}
  primary-run: {}
  pgbackrest-repo: {}
  standby-log: {}
  subscriber-data: {}
  subscriber-log: {}
  vm-data: {}
  vl-data: {}
  otelcol-data: {}
  am-data: {}
  grafana-data: {}
