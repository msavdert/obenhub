# Installed as /etc/systemd/system/otelcol-contrib.service.d/obenhub.conf by
# scripts/provision.sh. The deb unit runs as otelcol-contrib (uid 999).
[Service]
# journalctl (journald receiver) needs the journal: members of systemd-journal
# read system units and the kernel ring buffer
SupplementaryGroups=systemd-journal
# OTEL_MONITOR_PASSWORD; the file is root-only and read by systemd itself
EnvironmentFile=/etc/otelcol-contrib/monitor.env
