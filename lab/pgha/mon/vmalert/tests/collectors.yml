# Generated by gen-collectors.py in this directory; edit the generator, not this file.
# Collector liveness in the pgha lab: three node Collectors that send through
# the gateway Collector (inventory: lab/pgha/mon/vmalert/inventory.yml), and the
# shared pack rules reading it. Each node's PostgreSQL heartbeat, Patroni and
# etcd scrapes are collected by that node's Collector, so they stop with it; when
# the gateway stops, every node's data and self-metrics stop together. Samples
# are 15 s apart; self-metrics stop after 2 m (8 samples). The timing tests are
# judged every 30 s from 2m30s to 7m, the window in which a gate wider than 1 m
# would let a target alert fire; the data of a stopped Collector may outlive its
# last self-metric by 15 to 30 s (the last batch can arrive late).
# CollectorAbsent: the 2 m window empties at 3m45s, firing after for: 1m (4m45s).
rule_files:
  - ../inventory.yml
  - ../../../../packs/collector/rules.yml
  - ../../../../packs/postgresql/rules.yml
  - ../../../../packs/patroni/rules.yml
  - ../../../../packs/etcd/rules.yml
evaluation_interval: 15s

tests:
  - name: "one node Collector stops, its data outliving its last self-metric by 30 s: only its CollectorAbsent"
    interval: 15s
    input_series:
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-gateway"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-pgha-1"}'
        values: '1x60'
      - series: 'postgresql.collection.heartbeat{service.name="postgresql",service.instance.id="pgha-1"}'
        values: '1x60'
      - series: 'up{service.name="patroni",service.instance.id="pgha-1"}'
        values: '1x60'
      - series: 'up{service.name="etcd",service.instance.id="pgha-1"}'
        values: '1x60'
      - series: 'patroni_primary{service.name="patroni",scope="pgha",service.instance.id="pgha-1"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-pgha-2"}'
        values: '1x8 _x52'
      - series: 'postgresql.collection.heartbeat{service.name="postgresql",service.instance.id="pgha-2"}'
        values: '1x10 _x50'
      - series: 'up{service.name="patroni",service.instance.id="pgha-2"}'
        values: '1x10 _x50'
      - series: 'up{service.name="etcd",service.instance.id="pgha-2"}'
