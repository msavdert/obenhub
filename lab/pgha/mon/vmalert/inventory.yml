# pgha inventory: the targets and scrapes this lab expects (the node Collectors
# of lab/pgha/files/otelcol.yaml.tmpl). The rules that read these series are the
# shared packs lab/packs/{postgresql,patroni,etcd}. Same record names and
# shapes as lab/stage3/vmalert/inventory.yml; the node ids are pgha-1..3 for
# all three services.
groups:
  - name: inventory
    interval: 15s
    rules:
      - record: obenhub.expected_target
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "pgha", "service.instance.id", "pgha-1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "pgha", "service.instance.id", "pgha-2"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "db.cluster.name", "pgha", "service.instance.id", "pgha-3")
          )

  - name: patroni-inventory
    interval: 15s
    rules:
      - record: obenhub.expected_scrape
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "db.cluster.name", "pgha", "service.instance.id", "pgha-1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "db.cluster.name", "pgha", "service.instance.id", "pgha-2"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "db.cluster.name", "pgha", "service.instance.id", "pgha-3")
          )

  - name: etcd-inventory
    interval: 15s
    rules:
      - record: obenhub.expected_scrape
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "pgha-1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "pgha-2"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "pgha-3")
          )
