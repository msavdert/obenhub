# pgha inventory: the targets and scrapes this lab expects (the node Collectors
# of lab/pgha/files/otelcol.yaml.tmpl). The rules that read these series are the
# shared packs lab/packs/{collector,postgresql,patroni,etcd}. Same record names and
# shapes as lab/stage3/vmalert/inventory.yml; the node ids are pgha-1..3 for
# all three services.
groups:
  - name: inventory
    interval: 15s
    rules:
      # The Collectors this lab expects, by their self-telemetry
      # service.instance.id; CollectorAbsent reads them. The gateway takes the
      # node Collectors' telemetry and sends its own straight to
      # VictoriaMetrics; obenhub.upstream names the Collector a node sends
      # through. The obenhub.collector label on the targets below names the
      # Collector that collects them: each node's own (etcd and Patroni are
      # scraped locally, lab/pgha/files/otelcol.yaml.tmpl).
      - record: obenhub.expected_collector
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-gateway"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-pgha-1", "obenhub.upstream", "otelcol-gateway"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-pgha-2", "obenhub.upstream", "otelcol-gateway"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-pgha-3", "obenhub.upstream", "otelcol-gateway")
          )

      - record: obenhub.expected_target
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "obenhub.cluster.name", "pgha", "service.instance.id", "pgha-1", "obenhub.collector", "otelcol-pgha-1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "obenhub.cluster.name", "pgha", "service.instance.id", "pgha-2", "obenhub.collector", "otelcol-pgha-2"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "postgresql", "obenhub.cluster.name", "pgha", "service.instance.id", "pgha-3", "obenhub.collector", "otelcol-pgha-3")
          )

  - name: patroni-inventory
    interval: 15s
    rules:
      - record: obenhub.expected_scrape
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "obenhub.cluster.name", "pgha", "service.instance.id", "pgha-1", "obenhub.collector", "otelcol-pgha-1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "obenhub.cluster.name", "pgha", "service.instance.id", "pgha-2", "obenhub.collector", "otelcol-pgha-2"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "patroni", "obenhub.cluster.name", "pgha", "service.instance.id", "pgha-3", "obenhub.collector", "otelcol-pgha-3")
          )

  - name: etcd-inventory
    interval: 15s
    rules:
      - record: obenhub.expected_scrape
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "pgha-1", "obenhub.collector", "otelcol-pgha-1"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "pgha-2", "obenhub.collector", "otelcol-pgha-2"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "etcd", "service.instance.id", "pgha-3", "obenhub.collector", "otelcol-pgha-3")
          )
