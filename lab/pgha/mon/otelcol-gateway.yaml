# pgha gateway Collector: receives OTLP/HTTP from the three node Collectors
# (lab/pgha/files/otelcol.yaml.tmpl) over mutual TLS and forwards to
# VictoriaMetrics and VictoriaLogs. Nodes set all resource attributes; the
# gateway adds none.
# Receiver TLS keys: opentelemetry-collector config/configtls README (server:
# cert_file, key_file, client_ca_file, min_version); OTLP receiver HTTP
# settings: receiver/otlpreceiver at v0.164.0.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /etc/otelcol/tls/gateway.crt
          key_file: /etc/otelcol/tls/gateway.key
          # setting client_ca_file makes the server require and verify a
          # client certificate
          client_ca_file: /etc/otelcol/tls/ca.crt
          min_version: "1.2"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  batch: {}

exporters:
  otlp_http/vm:
    endpoint: http://victoriametrics:8428/opentelemetry
  otlp_http/vl:
    endpoint: http://victorialogs:9428/insert/opentelemetry
    headers:
      VL-Stream-Fields: service.namespace,service.name,service.instance.id

service:
  extensions: [health_check]
  telemetry:
    resource:
      attributes:
        - {name: service.namespace, value: obenhub-lab}
        - {name: service.name, value: otelcol}
        - {name: service.instance.id, value: otelcol-gateway}
    metrics:
      level: normal
      readers:
        - periodic:
            interval: 15000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/vm]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/vl]
