# Oracle lab inventory: the Collectors and the databases this lab expects (one
# Collector per VM, ADR 0008 decision 2: host metrics and journal on each, the
# alert log of the CDB19 pair on ora-au-lab and ora-dg-stby, and on ora-dg-obs
# the database receivers that read both databases of the pair). The rules that read these series are the pack
# lab/packs/oracledb-dg. Same record names and shapes as lab/pgha's inventory:
# every VM's Collector sends through the gateway on the box (otelcol-gateway,
# lab/oracle/mon/compose.yaml), named as its obenhub.upstream.
groups:
  - name: inventory
    interval: 15s
    rules:
      # The Collectors this lab expects, by their self-telemetry
      # service.instance.id (otelcol-<ssh alias>, and the gateway on the box);
      # the VM Collectors send through the gateway (obenhub.upstream), so a
      # stopped gateway raises only its own CollectorAbsent.
      - record: obenhub.expected_collector
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-gateway"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-ora-au-lab", "obenhub.upstream", "otelcol-gateway"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-ora-dg-stby", "obenhub.upstream", "otelcol-gateway"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.instance.id", "otelcol-ora-dg-obs", "obenhub.upstream", "otelcol-gateway")
          )

      # The databases: service.instance.id is the db_unique_name, and the
      # obenhub.collector label names the Collector that collects them (the one
      # observer reads both).
      - record: obenhub.expected_target
        expr: |
          union(
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "oracledb", "obenhub.cluster.name", "cdb19", "service.instance.id", "CDB19", "obenhub.collector", "otelcol-ora-dg-obs"),
            label_set(vector(1), "service.namespace", "obenhub-lab", "service.name", "oracledb", "obenhub.cluster.name", "cdb19", "service.instance.id", "CDB19_STBY", "obenhub.collector", "otelcol-ora-dg-obs")
          )

  # Parameters of the oracledb-backup pack (lab/packs/oracledb-backup/rules.yml):
  # the tolerated age of the last completed RMAN backup per kind, in seconds,
  # from the schedule in lab/oracle/README.md (Backups). Database: daily level
  # 0 or 1 at 01:45 plus 2 h = 26 h. Archived logs: every 4 h at :45 plus 1 h
  # = 5 h. The same numbers as the pack's defaults, recorded so the lab's
  # values are visible; lab values, not measured.
  - name: backup-parameters
    interval: 15s
    rules:
      - record: obenhub.backup_age.limit
        expr: label_set(vector(93600), "oracledb.backup.kind", "database")
      - record: obenhub.backup_age.limit
        expr: label_set(vector(18000), "oracledb.backup.kind", "archivelog")
