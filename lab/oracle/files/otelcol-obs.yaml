# Collector on ora-dg-obs (otelcol-contrib 0.164.0): the database receivers of
# the CDB19 pair, run once from the observer's vantage point (ADR 0008
# decision 2), so they keep reporting while either database VM is down.
#   oracledb            C##OBENHUB_MON on the primary's CDB root
#   sql_query/primary   oracledb-dg pack, C##OBENHUB_DG as SYSDG on CDB19
#   sql_query/standby   oracledb-dg pack, C##OBENHUB_DG as SYSDG on CDB19_STBY
#   sql_query/primary_account
#                       oracledb-dg pack, queries-primary.yaml (state of the
#                       C##OBENHUB_* accounts from DBA_USERS), primary only:
#                       a mounted standby cannot read that view
#   sql_query/primary_backup, sql_query/standby_backup
#                       oracledb-backup pack (RMAN job state), same two
#                       connections; the queries return rows on the primary
#                       only, so the pair keeps reporting after a role change
#   tcp_check/primary, tcp_check/standby
#                       TCP connect to each listener (ADR 0008 decision 7); a
#                       connect only, no login, no pool
# The two sql_query receivers read the same pack on both databases on every
# collection, so roles are read again after a switchover or failover; the
# oracledb receiver detects role and open mode once at start (contrib
# v0.164.0) and stays pointed at the VM that was primary when it started.
# Component keys: receiver/{oracledbreceiver,sqlqueryreceiver,tcpcheckreceiver}
# READMEs and config.go at contrib v0.164.0. The tcpcheck receiver (alpha) is
# registered as tcp_check there; tcpcheck is its deprecated alias. Its metric
# names stay tcpcheck.status, tcpcheck.duration and tcpcheck.error.
# The data source option "DBA PRIVILEGE" is parsed by go-ora
# v2.9.0 (v2/configurations/connect_config.go); "#" in the user name is
# percent-encoded in the URL.
# Passwords and the gateway endpoint come from the environment (ORA_*_PASSWORD
# hold the 30 characters Oracle uses, see scripts/provision.sh); nothing
# secret is written here.
receivers:
  oracledb:
    endpoint: ora-au-lab.lab.local:1521
    service: CDB19
    username: C##OBENHUB_MON
    password: ${env:ORA_MON_PASSWORD}
    collection_interval: 30s
    # Tablespace size and usage are on by default (metadata.yaml, contrib
    # v0.164.0) but carry only tablespace_name: on a CDB-root connection one
    # data point per container is emitted and, without oracle.db.pdb, the
    # root's SYSTEM and the PDB's SYSTEM collapse into one averaged series
    # (read in the lab on 2026-11-14: SYSAUX 132312 blocks, the mean of the
    # root's 196216 and PDB19's 68408). oracle.db.pdb is opt-in per metric
    # (generated_config.go, README "Per-PDB metrics"). The limit is
    # DBA_TABLESPACE_USAGE_METRICS.TABLESPACE_SIZE, the size the tablespace
    # can grow to with autoextend (scraper.go tablespaceUsageCDBSQL); the
    # separate oracledb.tablespace.limit metric is not needed.
    metrics:
      oracledb.tablespace_size.usage:
        attributes: [tablespace_name, oracle.db.pdb]
      oracledb.tablespace_size.limit:
        attributes: [tablespace_name, oracle.db.pdb]
  sql_query/primary:
    driver: oracle
    datasource: "oracle://C%23%23OBENHUB_DG:${env:ORA_DG_PASSWORD}@ora-au-lab.lab.local:1521/CDB19?DBA%20PRIVILEGE=SYSDG"
    collection_interval: 15s
    queries: ${file:/etc/otelcol-contrib/packs/oracledb-dg/queries.yaml}
  sql_query/standby:
    driver: oracle
    datasource: "oracle://C%23%23OBENHUB_DG:${env:ORA_DG_PASSWORD}@ora-dg-stby.lab.local:1521/CDB19_STBY?DBA%20PRIVILEGE=SYSDG"
    collection_interval: 15s
    queries: ${file:/etc/otelcol-contrib/packs/oracledb-dg/queries.yaml}
  sql_query/primary_account:
    driver: oracle
    datasource: "oracle://C%23%23OBENHUB_DG:${env:ORA_DG_PASSWORD}@ora-au-lab.lab.local:1521/CDB19?DBA%20PRIVILEGE=SYSDG"
    collection_interval: 15s
    queries: ${file:/etc/otelcol-contrib/packs/oracledb-dg/queries-primary.yaml}
  sql_query/primary_backup:
    driver: oracle
    datasource: "oracle://C%23%23OBENHUB_DG:${env:ORA_DG_PASSWORD}@ora-au-lab.lab.local:1521/CDB19?DBA%20PRIVILEGE=SYSDG"
    collection_interval: 60s
    queries: ${file:/etc/otelcol-contrib/packs/oracledb-backup/queries.yaml}
  sql_query/standby_backup:
    driver: oracle
    datasource: "oracle://C%23%23OBENHUB_DG:${env:ORA_DG_PASSWORD}@ora-dg-stby.lab.local:1521/CDB19_STBY?DBA%20PRIVILEGE=SYSDG"
    collection_interval: 60s
    queries: ${file:/etc/otelcol-contrib/packs/oracledb-backup/queries.yaml}
  # Listener probes, one receiver per listener so that each gets its own
  # resource attributes below. tcpcheck.status is 1 when the connect succeeded,
  # else 0; the dialer timeout stays under the 15s interval.
  tcp_check/primary:
    collection_interval: 15s
    targets:
      - endpoint: ora-au-lab.lab.local:1521
        dialer:
          timeout: 5s
  tcp_check/standby:
    collection_interval: 15s
    targets:
      - endpoint: ora-dg-stby.lab.local:1521
        dialer:
          timeout: 5s
  # The FSFO observers (units of /home/oracle/scripts/observer.sh, owner
  # provided); a template instance is named with its configuration.
  journald/observer:
    units: [dg-observer@cdb19, dg-observer@cdb19b]
    storage: file_storage
    convert_to_semantic_conventions: true

processors:
  # server.address is the VM a receiver connects to, not a role: roles move
  # and are read from the oracledb.database.primary metric.
  resource/primary:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: oracledb, action: upsert}
      - {key: service.instance.id, value: CDB19, action: upsert}
      - {key: server.address, value: ora-au-lab, action: upsert}
      - {key: server.port, value: '1521', action: upsert}
      - {key: db.system.name, value: oracle.db, action: upsert}
      - {key: obenhub.cluster.name, value: cdb19, action: upsert}
  resource/standby:
    attributes:
      - {key: service.namespace, value: obenhub-lab, action: upsert}
      - {key: service.name, value: oracledb, action: upsert}
      - {key: service.instance.id, value: CDB19_STBY, action: upsert}
      - {key: server.address, value: ora-dg-stby, action: upsert}
      - {key: server.port, value: '1521', action: upsert}
      - {key: db.system.name, value: oracle.db, action: upsert}
      - {key: obenhub.cluster.name, value: cdb19, action: upsert}

# The exporter, the self-metrics, host metrics and the journal of this VM are
# in otelcol-host.yaml, loaded with this file; the pipelines below use its
# memory_limiter, batch and exporter. The observers' journal is read here.
service:
  pipelines:
    logs/observer:
      receivers: [journald/observer]
      processors: [memory_limiter, resource_detection/system, resource/host, batch]
      exporters: [otlp_http/gateway]
    metrics/primary:
      receivers: [oracledb, sql_query/primary, sql_query/primary_account, sql_query/primary_backup, tcp_check/primary]
      processors: [memory_limiter, resource/primary, batch]
      exporters: [otlp_http/gateway]
    metrics/standby:
      receivers: [sql_query/standby, sql_query/standby_backup, tcp_check/standby]
      processors: [memory_limiter, resource/standby, batch]
      exporters: [otlp_http/gateway]
