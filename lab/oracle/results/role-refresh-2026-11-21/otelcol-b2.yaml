receivers:
  oracledb/standby:
    endpoint: 10.0.0.14:1521
    service: CDB19_STBY
    username: C##OBENHUB_MON
    password: ${env:ORA_MON_PASSWORD}
    collection_interval: 10s
exporters:
  file/standby:
    path: /home/agent/work/upstream/oracle-lab/patched/data-b2/standby.jsonl
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    metrics/standby:
      receivers: [oracledb/standby]
      exporters: [file/standby]
