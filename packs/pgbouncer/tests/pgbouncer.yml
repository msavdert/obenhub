  # The lab's inventory (lab/slice1/vmalert/tests/targets.yml) defines
  # obenhub.expected_target; here it is an input series.
  - name: PgbouncerTargetAbsent fires for a stopped PgBouncer only, from the SHOW LISTS heartbeat
    interval: 15s
    input_series:
      - series: 'obenhub.expected_target{service.namespace="obenhub-lab",service.name="pgbouncer",obenhub.cluster.name="slice1",service.instance.id="pgbouncer",obenhub.collector="otelcol-slice1"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-slice1"}'
        values: '1x60'
      - series: 'pgbouncer.list.item.count{obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x8 _x52'
      - series: 'pgbouncer.list.item.count{obenhub.cluster.name="slice1",service.instance.id="pgbouncer",pgbouncer.list.name="users"}'
        values: '3x60'
    alert_rule_test:
      - eval_time: 3m   # gone for 1m but the 2m window is not yet empty
        groupname: pgbouncer
        alertname: PgbouncerTargetAbsent
        exp_alerts: []
      - eval_time: 6m   # only the "databases" row is the heartbeat: the live "users" row does not hide it
        groupname: pgbouncer
        alertname: PgbouncerTargetAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: pgbouncer
              service.namespace: obenhub-lab
              service.name: pgbouncer
              obenhub.cluster.name: slice1
              obenhub.collector: otelcol-slice1
            exp_annotations:
              summary: "No heartbeat from pgbouncer"
              description: "An expected PgBouncer target has sent no heartbeat (the SHOW LISTS row databases) for 2 minutes while its Collector is alive. Check that PgBouncer runs and that the stats user can reach the console."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/pgbouncer/#pgbouncertargetabsent

  # --- identity (ADR 0006, decision 7) --------------------------------------
  - name: two clusters share the instance pgbouncer - the other cluster's heartbeat does not hide a dead target
    interval: 15s
    input_series:
      - series: 'obenhub.expected_target{service.name="pgbouncer",obenhub.cluster.name="a",service.instance.id="pgbouncer",obenhub.collector="otelcol-x"}'
        values: '1x60'
      - series: 'obenhub.expected_target{service.name="pgbouncer",obenhub.cluster.name="b",service.instance.id="pgbouncer",obenhub.collector="otelcol-x"}'
        values: '1x60'
      - series: 'pgbouncer.list.item.count{obenhub.cluster.name="a",service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x8 _x52'
      - series: 'pgbouncer.list.item.count{obenhub.cluster.name="b",service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-x"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 1m
        groupname: pgbouncer
        alertname: PgbouncerTargetAbsent
        exp_alerts: []
      - eval_time: 6m
        groupname: pgbouncer
        alertname: PgbouncerTargetAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service.name: pgbouncer
              obenhub.cluster.name: a
              service.instance.id: pgbouncer
              obenhub.collector: otelcol-x
            exp_annotations:
              summary: No heartbeat from pgbouncer
              description: "An expected PgBouncer target has sent no heartbeat (the SHOW LISTS row databases) for 2 minutes while its Collector is alive. Check that PgBouncer runs and that the stats user can reach the console."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/pgbouncer/#pgbouncertargetabsent

  - name: two clusters share the instance pgbouncer - a paused database in b does not silence waiting clients in a
    interval: 15s
    input_series:
      - series: 'pgbouncer.list.item.count{obenhub.cluster.name="a",service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'pgbouncer.list.item.count{obenhub.cluster.name="b",service.instance.id="pgbouncer",pgbouncer.list.name="databases"}'
        values: '2x60'
      - series: 'pgbouncer.pool.oldest_wait_age{obenhub.cluster.name="a",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '8x60'
      - series: 'pgbouncer.pool.oldest_wait_subsecond_age{obenhub.cluster.name="a",service.instance.id="pgbouncer",pgbouncer.database.name="app",user.name="app"}'
        values: '0x60'
      # b pauses a database of the same name on the same instance name
      - series: 'pgbouncer.database.paused{obenhub.cluster.name="b",service.instance.id="pgbouncer",pgbouncer.database.name="app"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 5m
        groupname: pgbouncer
        alertname: PgbouncerClientsWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              obenhub.cluster.name: a
              service.instance.id: pgbouncer
              pgbouncer.database.name: app
              user.name: app
            exp_annotations:
              summary: PgBouncer pool app/app has a client waiting 8s for a server connection
              description: "A client has waited over 5 seconds for a server connection for a minute, so the pool is at pool_size with clients queued. Run SHOW POOLS on the PgBouncer console for cl_waiting and maxwait of the database named in the alert."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/pgbouncer/#pgbouncerclientswaiting

