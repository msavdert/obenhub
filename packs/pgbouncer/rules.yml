# PgBouncer pack rules, mounted into vmalert by lab/slice1. The lab defines the
# recorded series obenhub.expected_target (with an obenhub.collector label
# naming the Collector that collects it) in its inventory group;
# PgbouncerTargetAbsent reads the service.name="pgbouncer" entries. Names follow
# the naming contract (ADR 0006); the series are the ones the Collector
# pipeline produces from queries.yaml (see its header). Identity (ADR 0006,
# decision 7): joins match on obenhub.cluster.name and service.instance.id; a
# one-to-one match (division) adds k8s.pod.uid, as in packs/postgresql/rules.yml.
groups:
  # SHOW POOLS gives the oldest waiting client as whole
  # seconds (pgbouncer.pool.oldest_wait_age, SHOW POOLS maxwait) plus the
  # part below one second (oldest_wait_subsecond_age, maxwait_us, converted
  # to seconds by the Collector); the sum is the wait.
  - name: pgbouncer
    interval: 15s
    rules:
      # Its heartbeat is the SHOW LISTS row "databases"
      # (never missing while the console answers). Absent only while the
      # Collector that collects it (obenhub.collector) is alive, for the reason given at PostgresTargetAbsent in
      # packs/postgresql/rules.yml.
      - alert: PgbouncerTargetAbsent
        expr: |
          obenhub.expected_target{service.name="pgbouncer"}
            unless on(obenhub.cluster.name, service.instance.id)
          present_over_time(pgbouncer.list.item.count{pgbouncer.list.name="databases"}[2m])
            and on(obenhub.collector)
          label_replace(present_over_time(otelcol_process_uptime[1m]), "obenhub.collector", "$1", "service.instance.id", "(.+)")
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'No heartbeat from {{ (index $labels "service.instance.id") }}'

      # A PgBouncer target without obenhub.cluster.name (ADR 0006, decision 7):
      # its joins match on it, so the saturation and wait rules would see it
      # pair with nothing. The heartbeat is the series PgbouncerTargetAbsent reads.
      - alert: PgbouncerClusterNameMissing
        expr: pgbouncer.list.item.count{pgbouncer.list.name="databases", obenhub.cluster.name=""}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} reports no obenhub.cluster.name'

      # The rules of this pack size their windows for a collection every 15 s
      # (README, "Collection interval"): the [75s:15s] subqueries and the
      # [75s] window hold five collections. Collected only every 60 s, a 30 s window
      # holds one sample or none, so the rules go quiet or flap without any
      # error. This says it: the average distance between the samples of
      # pgbouncer.list.item.count{pgbouncer.list.name="databases"} (the heartbeat PgbouncerTargetAbsent reads) over 5 m is above 20 s.
      # scrape_interval() is MetricsQL (VictoriaMetrics): the average interval
      # in seconds between the raw samples in the window. One missed sample at
      # 15 s gives about 16 s and stays quiet; a series at 30 s, where a 30 s
      # window holds one sample, fires: the threshold of 20 s leaves room for
      # jitter at 15 s.
      # max by (...): one value per target.
      - alert: PgbouncerCollectionIntervalTooLong
        expr: max by (obenhub.cluster.name, service.instance.id) (scrape_interval(pgbouncer.list.item.count{pgbouncer.list.name="databases"}[5m])) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'PgBouncer {{ (index $labels "service.instance.id") }} is collected every {{ $value | printf "%.0f" }} s, the rules assume 15 s'

      # A client waits for a server connection only when the pool is at
      # pool_size. Over 5 s for 1 m is a lab threshold (assumption: a healthy
      # transaction-mode pool hands over a connection in milliseconds). Not for
      # the console's own pool (database pgbouncer), not for a paused or
      # disabled database (clients wait there by design), and not while the
      # target is absent (stale series); all in the expression, for the reason
      # given at PostgresTargetAbsent in packs/postgresql/rules.yml. The Collector renames the SHOW
      # columns (database, name, user, list) to pgbouncer.* attributes, so the
      # SHOW DATABASES and SHOW POOLS series join on pgbouncer.database.name.
      - alert: PgbouncerClientsWaiting
        expr: |
          (
            pgbouncer.pool.oldest_wait_age{pgbouncer.database.name!="pgbouncer"}
              + pgbouncer.pool.oldest_wait_subsecond_age{pgbouncer.database.name!="pgbouncer"} > 5
          )
            unless on(obenhub.cluster.name, service.instance.id, pgbouncer.database.name)
          (pgbouncer.database.paused == 1 or pgbouncer.database.disabled == 1)
            and on(obenhub.cluster.name, service.instance.id)
          present_over_time(pgbouncer.list.item.count{pgbouncer.list.name="databases"}[2m])
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'PgBouncer pool {{ (index $labels "pgbouncer.database.name") }}/{{ (index $labels "user.name") }} has a client waiting {{ $value | humanizeDuration }} for a server connection'

      # The three rules below are not for the console (database pgbouncer),
      # not for a paused or disabled database and not while the target is
      # absent, as at PgbouncerClientsWaiting. All thresholds are lab values
      # (assumption: they need tuning against a real workload).
      # A pool at its size with no client queued yet is the warning before
      # clients wait: r is the share of the configured pool_size that is linked
      # to a client, averaged over 5 m (window of 20 points, see the window
      # notes at PostgresConnectionSaturation in packs/postgresql/rules.yml; n
      # requires a full window, so a new pool stays silent while it warms up).
      # sv_active can exceed pool_size when a reserve pool is configured (it is
      # 0 in the lab), so r can pass 1. SHOW DATABASES pool_size shows
      # default_pool_size when the database sets none (PgBouncer 1.26.1).
      - alert: PgbouncerPoolSaturated
        expr: |
          WITH (
            r = pgbouncer.pool.active_server.count{pgbouncer.database.name!="pgbouncer"}
              / on(obenhub.cluster.name, service.instance.id, k8s.pod.uid, pgbouncer.database.name) group_left()
            (pgbouncer.database.server_connection.limit > 0),
            x = avg_over_time(r[5m:15s]),
            n = count_over_time(r[5m:15s])
          )
          ((x >= 0.9) and (n >= 20))
            unless on(obenhub.cluster.name, service.instance.id, pgbouncer.database.name)
          (pgbouncer.database.paused == 1 or pgbouncer.database.disabled == 1)
            and on(obenhub.cluster.name, service.instance.id)
          present_over_time(pgbouncer.list.item.count{pgbouncer.list.name="databases"}[2m])
        labels:
          severity: warning
        annotations:
          summary: 'PgBouncer pool {{ (index $labels "pgbouncer.database.name") }}/{{ (index $labels "user.name") }} used {{ $value | humanizePercentage }} of its pool_size over 5m'

      # Client connections against max_client_conn, two tiers as at
      # PostgresConnectionSaturation (old for 1m, W' = 75s, 5 points): critical at a
      # ratio of 0.95 or more, warning above 0.85 and below 0.95. used_clients
      # (SHOW LISTS) is every client connection, the console's too. Console
      # connections count towards the limit but are never refused (decide_startup_pool,
      # src/client.c:1086, PgBouncer 1.26.1 commit f03e9bf), so r can exceed 1;
      # the new client is counted before the check, so max_client_conn clients
      # are admitted and the next is refused. A refused client is counted
      # nowhere (it is logged only with log_disconnections) and adds no wait
      # time, so this alert is the only signal. max_db_client_connections and
      # max_user_client_connections (1.24 and later) are 0 in the lab and are
      # not covered. The series has no database label, so there is nothing to
      # exclude or pause. If the SHOW CONFIG query alone fails, the division
      # yields nothing and both tiers go silent while the heartbeat (SHOW
      # LISTS) stays present; not covered.
      - alert: PgbouncerClientSaturation
        expr: |
          WITH (
            r = pgbouncer.list.item.count{pgbouncer.list.name="used_clients"}
              / on(obenhub.cluster.name, service.instance.id, k8s.pod.uid)
            pgbouncer.client_connection.limit,
            x = min_over_time(r[75s:15s]),
            n = count_over_time(r[75s:15s])
          )
          (((x > 0.85) unless (x >= 0.95)) and (n >= 5))
            and on(obenhub.cluster.name, service.instance.id)
          present_over_time(pgbouncer.list.item.count{pgbouncer.list.name="databases"}[2m])
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} client connections above 85% of max_client_conn'

      - alert: PgbouncerClientSaturation
        expr: |
          WITH (
            r = pgbouncer.list.item.count{pgbouncer.list.name="used_clients"}
              / on(obenhub.cluster.name, service.instance.id, k8s.pod.uid)
            pgbouncer.client_connection.limit,
            x = min_over_time(r[75s:15s]),
            n = count_over_time(r[75s:15s])
          )
          ((x >= 0.95) and (n >= 5))
            and on(obenhub.cluster.name, service.instance.id)
          present_over_time(pgbouncer.list.item.count{pgbouncer.list.name="databases"}[2m])
        labels:
          severity: critical
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} client connections at or above 95% of max_client_conn; further clients are refused'

      # Average wait per server assignment over 5 m, in seconds. Complements
      # PgbouncerClientsWaiting (oldest waiter over 5 s): many short waits that
      # never reach 5 s. total_wait_time grows when a waiting client is
      # activated (activate_client, src/objects.c:845; microseconds in SHOW
      # STATS, converted to seconds by the Collector). A client that died while queued is activated too, when a
      # server frees up, but gets no assignment: measured 2026-11-08, ending
      # pgbouncer-pool-saturated added about 1046 s of wait with no assignment.
      # Such a lump would dominate the average for the 5 m window, however
      # many assignments dilute it. A lump that large comes only from clients
      # that sat in the queue, so it shows first as maxwait. The rule is silent
      # for a database while, in the last 6 m (the rate window plus one scrape
      # margin), one of its pools had maxwait of 5 s or more for 75 s on end:
      # the run PgbouncerClientsWaiting needs to fire (5 s, for 1m), so that
      # wait already has its alert. Shorter bursts of 5 s or more do not
      # silence it; waits under 5 s each are counted as they are. Without
      # assignments in the window the ratio is +Inf or NaN and never fires.
      - alert: PgbouncerWaitTime
        expr: |
          (
            rate(pgbouncer.stats.wait_time{pgbouncer.database.name!="pgbouncer"}[5m])
              / (rate(pgbouncer.stats.server_assignment{pgbouncer.database.name!="pgbouncer"}[5m]) > 0) > 0.1
          )
            unless on(obenhub.cluster.name, service.instance.id, pgbouncer.database.name)
          max by(obenhub.cluster.name, service.instance.id, pgbouncer.database.name) (
            max_over_time(
              (min_over_time(pgbouncer.pool.oldest_wait_age{pgbouncer.database.name!="pgbouncer"}[75s]) >= 5)[6m:15s]
            )
          )
            unless on(obenhub.cluster.name, service.instance.id, pgbouncer.database.name)
          (pgbouncer.database.paused == 1 or pgbouncer.database.disabled == 1)
            and on(obenhub.cluster.name, service.instance.id)
          present_over_time(pgbouncer.list.item.count{pgbouncer.list.name="databases"}[2m])
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'PgBouncer database {{ (index $labels "pgbouncer.database.name") }}: clients wait {{ $value | humanizeDuration }} on average for a server connection'
