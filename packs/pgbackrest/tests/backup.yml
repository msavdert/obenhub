# Tests for the pgBackRest pack: PgBackRestBackupStale (lab parameter and the
# 26 h default), PgBackRestStanzaError, PgBackRestExporterDown,
# PgBackRestBackupChecksumError.
rule_files:
  - ../rules.yml
evaluation_interval: 15s

tests:
  - name: stale fires when the age passes the lab parameter for 1m, clears after a new backup
    interval: 15s
    input_series:
      - series: 'obenhub.backup_age.limit'
        values: '300x80'
      # age grows 15 s per step; a backup at step 40 (10m) resets it
      - series: 'pgbackrest_backup_since_last_completion_seconds{obenhub.cluster.name="slice1",backup_type="incr",stanza="slice1",service.name="pgbackrest",service.instance.id="pgbackrest"}'
        values: '0+15x39 0+15x40'
    alert_rule_test:
      - eval_time: 5m   # 300 s: not above the parameter
        groupname: pgbackrest
        alertname: PgBackRestBackupStale
        exp_alerts: []
      - eval_time: 5m45s   # above for 30 s: pending
        groupname: pgbackrest
        alertname: PgBackRestBackupStale
        exp_alerts: []
      - eval_time: 7m
        groupname: pgbackrest
        alertname: PgBackRestBackupStale
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: slice1
              severity: warning
              backup_type: incr
              stanza: slice1
              service.name: pgbackrest
              service.instance.id: pgbackrest
            exp_annotations:
              summary: 'No completed pgBackRest backup of stanza slice1 for 420 s'
              description: "The last completed backup of a stanza is older than the tolerated age (obenhub.backup_age.limit, 26 h by default), for a minute. Run pgbackrest info for the stanza and check the job that takes the backups."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/pgbackrest/#pgbackrestbackupstale
      - eval_time: 11m   # a backup was completed at 10m
        groupname: pgbackrest
        alertname: PgBackRestBackupStale
        exp_alerts: []

  - name: without the lab parameter the 26 h default applies
    interval: 5m
    input_series:
      - series: 'pgbackrest_backup_since_last_completion_seconds{obenhub.cluster.name="slice1",backup_type="incr",stanza="slice1",service.name="pgbackrest",service.instance.id="pgbackrest"}'
        values: '0+300x400'
    alert_rule_test:
      - eval_time: 25h   # 90000 s: below 93600
        groupname: pgbackrest
        alertname: PgBackRestBackupStale
        exp_alerts: []
      - eval_time: 27h   # 97200 s, for 1m passed
        groupname: pgbackrest
        alertname: PgBackRestBackupStale
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: slice1
              severity: warning
              backup_type: incr
              stanza: slice1
              service.name: pgbackrest
              service.instance.id: pgbackrest
            exp_annotations:
              summary: 'No completed pgBackRest backup of stanza slice1 for 97200 s'
              description: "The last completed backup of a stanza is older than the tolerated age (obenhub.backup_age.limit, 26 h by default), for a minute. Run pgbackrest info for the stanza and check the job that takes the backups."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/pgbackrest/#pgbackrestbackupstale

  - name: no age series, no alert
    interval: 15s
    input_series:
      - series: 'obenhub.backup_age.limit'
        values: '300x40'
    alert_rule_test:
      - eval_time: 8m
        groupname: pgbackrest
        alertname: PgBackRestBackupStale
        exp_alerts: []

  - name: stanza status other than 0 fires after 2m (1 and 2 as seen live), 0 does not
    interval: 15s
    input_series:
      - series: 'pgbackrest_stanza_status{obenhub.cluster.name="slice1",stanza="slice1",service.name="pgbackrest",service.instance.id="pgbackrest"}'
        values: '1x4 2x8 0x40'
    alert_rule_test:
      - eval_time: 1m
        groupname: pgbackrest
        alertname: PgBackRestStanzaError
        exp_alerts: []
      - eval_time: 2m30s
        groupname: pgbackrest
        alertname: PgBackRestStanzaError
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: slice1
              severity: critical
              stanza: slice1
              service.name: pgbackrest
              service.instance.id: pgbackrest
            exp_annotations:
              summary: 'pgBackRest stanza slice1 reports status 2'
              description: "pgbackrest_stanza_status is not 0 for 2 minutes: the stanza is missing or has no valid backup (the first backup of a new lab takes about a minute). Run pgbackrest info and pgbackrest check for the stanza."
              runbook_url: https://msavdert.github.io/obenhub/reference/pgbackrest-pack-alerts/#pgbackreststanzaerror
      - eval_time: 8m
        groupname: pgbackrest
        alertname: PgBackRestStanzaError
        exp_alerts: []

  - name: a short blip of the stanza status does not fire
    interval: 15s
    input_series:
      - series: 'pgbackrest_stanza_status{obenhub.cluster.name="slice1",stanza="slice1",service.name="pgbackrest",service.instance.id="pgbackrest"}'
        values: '0x4 2x5 0x40'
    alert_rule_test:
      - eval_time: 4m
        groupname: pgbackrest
        alertname: PgBackRestStanzaError
        exp_alerts: []

  - name: exporter down fires on a failed scrape and on exporter_status 0, not on 1
    interval: 15s
    input_series:
      - series: 'up{obenhub.cluster.name="slice1",service.name="pgbackrest",service.instance.id="pgbackrest"}'
        values: '1x8 0x20 1x30'
      - series: 'pgbackrest_exporter_status{obenhub.cluster.name="slice1",stanza="slice1",service.name="pgbackrest",service.instance.id="pgbackrest"}'
        values: '1x40 0x20 1x18'
    alert_rule_test:
      - eval_time: 2m
        groupname: pgbackrest
        alertname: PgBackRestExporterDown
        exp_alerts: []
      - eval_time: 5m   # up 0 since 2m, for 2m passed
        groupname: pgbackrest
        alertname: PgBackRestExporterDown
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: slice1
              severity: warning
              service.name: pgbackrest
              service.instance.id: pgbackrest
            exp_annotations:
              summary: 'pgBackRest state is not being collected (pgbackrest)'
              description: "The exporter cannot read the repository (pgbackrest_exporter_status 0) or the Collector cannot scrape the exporter (up 0) for 2 minutes. While it fires the backup age is frozen or absent; check the exporter's log."
              runbook_url: https://msavdert.github.io/obenhub/reference/pgbackrest-pack-alerts/#pgbackrestexporterdown
      - eval_time: 9m   # both fine again
        groupname: pgbackrest
        alertname: PgBackRestExporterDown
        exp_alerts: []
      - eval_time: 13m   # exporter_status 0 from 10m, for 2m passed
        groupname: pgbackrest
        alertname: PgBackRestExporterDown
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: slice1
              severity: warning
              stanza: slice1
              service.name: pgbackrest
              service.instance.id: pgbackrest
            exp_annotations:
              summary: 'pgBackRest state is not being collected (pgbackrest)'
              description: "The exporter cannot read the repository (pgbackrest_exporter_status 0) or the Collector cannot scrape the exporter (up 0) for 2 minutes. While it fires the backup age is frozen or absent; check the exporter's log."
              runbook_url: https://msavdert.github.io/obenhub/reference/pgbackrest-pack-alerts/#pgbackrestexporterdown

  - name: checksum error fires on the incr series (the exporter's last backup of any kind), not on full alone, clears when incr is 0
    interval: 15s
    input_series:
      - series: 'pgbackrest_backup_last_error_status{obenhub.cluster.name="slice1",backup_type="incr",block_incr="n",stanza="slice1",service.name="pgbackrest",service.instance.id="pgbackrest"}'
        values: '0x8 1x20 0x10'
      # full alone at 1 (an older full backup with an error, a newer clean
      # incremental one) does not fire: only incr, the last backup, counts
      - series: 'pgbackrest_backup_last_error_status{obenhub.cluster.name="slice1",backup_type="full",block_incr="n",stanza="slice1",service.name="pgbackrest",service.instance.id="pgbackrest"}'
        values: '1x8 0x32'
    alert_rule_test:
      - eval_time: 1m
        groupname: pgbackrest
        alertname: PgBackRestBackupChecksumError
        exp_alerts: []
      - eval_time: 3m
        groupname: pgbackrest
        alertname: PgBackRestBackupChecksumError
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: slice1
              severity: critical
              backup_type: incr
              block_incr: n
              stanza: slice1
              service.name: pgbackrest
              service.instance.id: pgbackrest
            exp_annotations:
              summary: 'The last pgBackRest backup of stanza slice1 found invalid page checksums'
              description: "The last backup of a stanza found pages whose checksum does not match: damage in the data files, which PostgreSQL itself reports only when it reads the page. The backup still completes, so the stale alert stays silent; check pgbackrest info and the pgBackRest log of that backup (invalid page checksum found)."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/pgbackrest/#pgbackrestbackupchecksumerror
      - eval_time: 8m   # the next backup is clean from 7m
        groupname: pgbackrest
        alertname: PgBackRestBackupChecksumError
        exp_alerts: []

  # --- a target without a cluster (ADR 0006, decision 7) --------------------
  - name: an exporter target without obenhub.cluster.name fires PgBackRestClusterNameMissing after 5 m
    interval: 15s
    input_series:
      - series: 'up{service.name="pgbackrest",service.instance.id="pgbackrest"}'
        values: '1x60'
      - series: 'up{service.name="pgbackrest",obenhub.cluster.name="slice1",service.instance.id="other"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 4m
        groupname: pgbackrest
        alertname: PgBackRestClusterNameMissing
        exp_alerts: []
      - eval_time: 6m
        groupname: pgbackrest
        alertname: PgBackRestClusterNameMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              service.name: pgbackrest
              service.instance.id: pgbackrest
            exp_annotations:
              summary: pgBackRest exporter pgbackrest reports no obenhub.cluster.name
              description: "The pgBackRest exporter scrape carries no obenhub.cluster.name. Fix the resource attribute of the Collector scrape."
              runbook_url: https://msavdert.github.io/obenhub/reference/pgbackrest-pack-alerts/#pgbackrestclusternamemissing

  - name: exporter targets with a cluster name keep PgBackRestClusterNameMissing quiet
    interval: 15s
    input_series:
      - series: 'up{service.name="pgbackrest",obenhub.cluster.name="slice1",service.instance.id="pgbackrest"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 10m
        groupname: pgbackrest
        alertname: PgBackRestClusterNameMissing
        exp_alerts: []
