# The rules file alone, without the lab's obenhub.backup_age.limit: the
# defaults of packs/oracledb-backup/rules.yml (26 h database, 5 h archived
# logs) apply.
rule_files:
  - ../rules.yml
evaluation_interval: 15s

tests:
  - name: defaults apply per kind
    interval: 1m
    input_series:
      - series: 'oracledb.backup.age{obenhub.cluster.name="cdb19",service.instance.id="CDB19",oracledb.backup.kind="database"}'
        values: '90000+60x120'
      - series: 'oracledb.backup.age{obenhub.cluster.name="cdb19",service.instance.id="CDB19",oracledb.backup.kind="archivelog"}'
        values: '17400+60x120'
    alert_rule_test:
      - eval_time: 5m   # database 90300 s, archivelog 17700 s: below both defaults
        groupname: oracledb-backup
        alertname: OracleBackupStale
        exp_alerts: []
      - eval_time: 90m   # database 95400 s, archivelog 22800 s: both above
        groupname: oracledb-backup
        alertname: OracleBackupStale
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: cdb19
              severity: warning
              service.instance.id: CDB19
              oracledb.backup.kind: database
            exp_annotations:
              summary: 'No completed RMAN database backup of CDB19 for 95400 s'
              description: "The newest completed RMAN job of a kind (database or archivelog) is older than the tolerated age (obenhub.backup_age.limit, 26 h by default). Check V$RMAN_BACKUP_JOB_DETAILS and the scheduler that runs the backups."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/oracledb-backup/#oraclebackupstale
          - exp_labels:
              obenhub.cluster.name: cdb19
              severity: warning
              service.instance.id: CDB19
              oracledb.backup.kind: archivelog
            exp_annotations:
              summary: 'No completed RMAN archivelog backup of CDB19 for 22800 s'
              description: "The newest completed RMAN job of a kind (database or archivelog) is older than the tolerated age (obenhub.backup_age.limit, 26 h by default). Check V$RMAN_BACKUP_JOB_DETAILS and the scheduler that runs the backups."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/oracledb-backup/#oraclebackupstale
