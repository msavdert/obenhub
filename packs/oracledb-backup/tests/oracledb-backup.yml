# Tests for packs/oracledb-backup/rules.yml with the lab's limits
# (lab/oracle/mon/vmalert/inventory.yml, group backup-parameters). Series
# shapes follow queries.yaml (labels reduced to the ones the rules use); no lab
# scenario has produced them yet. A completed backup resets the age to 0.
rule_files:
  - ../rules.yml
  - ../../../lab/oracle/mon/vmalert/inventory.yml
evaluation_interval: 15s

tests:
  - name: fresh backups and no failure, both rules are quiet
    interval: 1m
    input_series:
      - series: 'oracledb.backup.age{service.instance.id="CDB19",oracledb.backup.kind="database"}'
        values: '3600+60x120'
      - series: 'oracledb.backup.age{service.instance.id="CDB19",oracledb.backup.kind="archivelog"}'
        values: '600+60x120'
      - series: 'oracledb.backup.failed{service.instance.id="CDB19",oracledb.backup.kind="database"}'
        values: '0x120'
      - series: 'oracledb.backup.failed{service.instance.id="CDB19",oracledb.backup.kind="archivelog"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 90m
        groupname: oracledb-backup
        alertname: OracleBackupStale
        exp_alerts: []
      - eval_time: 90m
        groupname: oracledb-backup
        alertname: OracleBackupFailed
        exp_alerts: []

  - name: database backup older than 26 h fires, archived logs below 5 h do not
    interval: 1m
    input_series:
      # 25 h at the start, grows one minute per minute: passes 26 h (93600 s) at 60 min
      - series: 'oracledb.backup.age{service.instance.id="CDB19",oracledb.backup.kind="database"}'
        values: '90000+60x120'
      - series: 'oracledb.backup.age{service.instance.id="CDB19",oracledb.backup.kind="archivelog"}'
        values: '600+60x120'
    alert_rule_test:
      - eval_time: 55m   # 93300 s
        groupname: oracledb-backup
        alertname: OracleBackupStale
        exp_alerts: []
      - eval_time: 90m   # 95400 s, above for 30 min
        groupname: oracledb-backup
        alertname: OracleBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: CDB19
              oracledb.backup.kind: database
            exp_annotations:
              summary: 'No completed RMAN database backup of CDB19 for 95400 s'

  - name: archived log backup older than 5 h fires, the database backup does not
    interval: 1m
    input_series:
      - series: 'oracledb.backup.age{service.instance.id="CDB19",oracledb.backup.kind="database"}'
        values: '3600+60x120'
      # 4 h 50 min at the start, passes 5 h (18000 s) at 10 min
      - series: 'oracledb.backup.age{service.instance.id="CDB19",oracledb.backup.kind="archivelog"}'
        values: '17400+60x120'
    alert_rule_test:
      - eval_time: 9m
        groupname: oracledb-backup
        alertname: OracleBackupStale
        exp_alerts: []
      - eval_time: 30m   # 19200 s
        groupname: oracledb-backup
        alertname: OracleBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: CDB19
              oracledb.backup.kind: archivelog
            exp_annotations:
              summary: 'No completed RMAN archivelog backup of CDB19 for 19200 s'

  - name: a new backup clears the stale alert
    interval: 1m
    input_series:
      - series: 'oracledb.backup.age{service.instance.id="CDB19",oracledb.backup.kind="archivelog"}'
        values: '18600+60x20 0+60x40'
    alert_rule_test:
      - eval_time: 15m
        groupname: oracledb-backup
        alertname: OracleBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: CDB19
              oracledb.backup.kind: archivelog
            exp_annotations:
              summary: 'No completed RMAN archivelog backup of CDB19 for 19500 s'
      - eval_time: 30m
        groupname: oracledb-backup
        alertname: OracleBackupStale
        exp_alerts: []

  - name: a failed job fires after 2m, resolves when the next one succeeds
    interval: 1m
    input_series:
      - series: 'oracledb.backup.failed{service.instance.id="CDB19",oracledb.backup.kind="archivelog"}'
        values: '0x4 1x20 0x20'
      - series: 'oracledb.backup.failed{service.instance.id="CDB19",oracledb.backup.kind="database"}'
        values: '0x45'
    alert_rule_test:
      - eval_time: 5m   # failed for 1 min: pending
        groupname: oracledb-backup
        alertname: OracleBackupFailed
        exp_alerts: []
      - eval_time: 10m
        groupname: oracledb-backup
        alertname: OracleBackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: CDB19
              oracledb.backup.kind: archivelog
            exp_annotations:
              summary: 'The last RMAN archivelog backup of CDB19 failed'
      - eval_time: 30m
        groupname: oracledb-backup
        alertname: OracleBackupFailed
        exp_alerts: []

  - name: a failed database job fails both kinds; the next archived log job clears archivelog only
    # queries.yaml counts a database job for the archivelog kind too (its
    # archived logs are backed up in the same job), for the age and for failed
    # alike, so a failed level 1 sets failed 1 for both kinds; the next
    # archived log job that succeeds is the newest archivelog job, not the
    # newest database job.
    interval: 1m
    input_series:
      - series: 'oracledb.backup.failed{service.instance.id="CDB19",oracledb.backup.kind="database"}'
        values: '0x4 1x40'
      - series: 'oracledb.backup.failed{service.instance.id="CDB19",oracledb.backup.kind="archivelog"}'
        values: '0x4 1x20 0x20'
    alert_rule_test:
      - eval_time: 10m
        groupname: oracledb-backup
        alertname: OracleBackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: CDB19
              oracledb.backup.kind: database
            exp_annotations:
              summary: 'The last RMAN database backup of CDB19 failed'
          - exp_labels:
              severity: critical
              service.instance.id: CDB19
              oracledb.backup.kind: archivelog
            exp_annotations:
              summary: 'The last RMAN archivelog backup of CDB19 failed'
      - eval_time: 30m
        groupname: oracledb-backup
        alertname: OracleBackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              service.instance.id: CDB19
              oracledb.backup.kind: database
            exp_annotations:
              summary: 'The last RMAN database backup of CDB19 failed'

  - name: a standby reports no backup series, so nothing fires (only its heartbeat exists)
    interval: 1m
    input_series:
      - series: 'oracledb.collection.heartbeat{service.instance.id="CDB19_STBY"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        groupname: oracledb-backup
        alertname: OracleBackupStale
        exp_alerts: []
      - eval_time: 30m
        groupname: oracledb-backup
        alertname: OracleBackupFailed
        exp_alerts: []

  - name: a primary without a backup series fires after 30m, a standby and a primary with a series do not
    interval: 1m
    input_series:
      # CDB19 is primary and has no backup series; CDB19_STBY is a standby
      - series: 'oracledb.database.primary{service.instance.id="CDB19",obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",oracledb.database.role="PRIMARY"}'
        values: '1x60'
      - series: 'oracledb.database.primary{service.instance.id="CDB19_STBY",obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19_STBY",oracledb.database.role="PHYSICAL STANDBY"}'
        values: '0x60'
      # a second cluster whose primary has a series
      - series: 'oracledb.database.primary{service.instance.id="CDB26",obenhub.cluster.name="cdb26",oracledb.database.unique_name="CDB26",oracledb.database.role="PRIMARY"}'
        values: '1x60'
      - series: 'oracledb.backup.age{service.instance.id="CDB26",obenhub.cluster.name="cdb26",oracledb.database.unique_name="CDB26",oracledb.backup.kind="database"}'
        values: '600x60'
    alert_rule_test:
      - eval_time: 20m   # pending
        groupname: oracledb-backup
        alertname: OracleBackupMissing
        exp_alerts: []
      - eval_time: 40m
        groupname: oracledb-backup
        alertname: OracleBackupMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: CDB19
              obenhub.cluster.name: cdb19
              oracledb.database.unique_name: CDB19
            exp_annotations:
              summary: 'Primary CDB19 has no completed RMAN database backup on record'

  - name: a first database backup clears the missing alert, an archivelog series alone does not
    interval: 1m
    input_series:
      - series: 'oracledb.database.primary{service.instance.id="CDB19",obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",oracledb.database.role="PRIMARY"}'
        values: '1x60'
      - series: 'oracledb.backup.age{service.instance.id="CDB19",obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",oracledb.backup.kind="archivelog"}'
        values: '60x60'
      - series: 'oracledb.backup.age{service.instance.id="CDB19",obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",oracledb.backup.kind="database"}'
        values: '_x40 60+60x20'
    alert_rule_test:
      - eval_time: 38m
        groupname: oracledb-backup
        alertname: OracleBackupMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: CDB19
              obenhub.cluster.name: cdb19
              oracledb.database.unique_name: CDB19
            exp_annotations:
              summary: 'Primary CDB19 has no completed RMAN database backup on record'
      - eval_time: 50m
        groupname: oracledb-backup
        alertname: OracleBackupMissing
        exp_alerts: []

  - name: a promotion moves the alert to the new primary
    interval: 1m
    input_series:
      # CDB19 was primary for 10 minutes and then a standby; CDB19_STBY took over; neither has a backup series
      - series: 'oracledb.database.primary{service.instance.id="CDB19",obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",oracledb.database.role="PRIMARY"}'
        values: '1x10'
      - series: 'oracledb.database.primary{service.instance.id="CDB19",obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19",oracledb.database.role="PHYSICAL STANDBY"}'
        values: '_x10 0x60'
      - series: 'oracledb.database.primary{service.instance.id="CDB19_STBY",obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19_STBY",oracledb.database.role="PHYSICAL STANDBY"}'
        values: '0x10'
      - series: 'oracledb.database.primary{service.instance.id="CDB19_STBY",obenhub.cluster.name="cdb19",oracledb.database.unique_name="CDB19_STBY",oracledb.database.role="PRIMARY"}'
        values: '_x10 1x60'
    alert_rule_test:
      - eval_time: 60m
        groupname: oracledb-backup
        alertname: OracleBackupMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: CDB19_STBY
              obenhub.cluster.name: cdb19
              oracledb.database.unique_name: CDB19_STBY
            exp_annotations:
              summary: 'Primary CDB19_STBY has no completed RMAN database backup on record'

  - name: recovery area above 85% of what cannot be reclaimed fires after 10m, reclaimable space does not count
    interval: 1m
    input_series:
      # CDB19: 20 GiB limit, 19 GiB used, 5 GiB reclaimable: 70%, quiet
      - series: 'oracledb.recovery_area.limit{service.instance.id="CDB19",oracledb.database.unique_name="CDB19"}'
        values: '21474836480x40'
      - series: 'oracledb.recovery_area.usage{service.instance.id="CDB19",oracledb.database.unique_name="CDB19"}'
        values: '20401094656x40'
      - series: 'oracledb.recovery_area.reclaimable{service.instance.id="CDB19",oracledb.database.unique_name="CDB19"}'
        values: '5368709120x40'
      # CDB19_STBY: 19 GiB used, 0 reclaimable: 95%, fires
      - series: 'oracledb.recovery_area.limit{service.instance.id="CDB19_STBY",oracledb.database.unique_name="CDB19_STBY"}'
        values: '21474836480x40'
      - series: 'oracledb.recovery_area.usage{service.instance.id="CDB19_STBY",oracledb.database.unique_name="CDB19_STBY"}'
        values: '20401094656x40'
      - series: 'oracledb.recovery_area.reclaimable{service.instance.id="CDB19_STBY",oracledb.database.unique_name="CDB19_STBY"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 5m
        groupname: oracledb-backup
        alertname: OracleRecoveryAreaFull
        exp_alerts: []
      - eval_time: 20m
        groupname: oracledb-backup
        alertname: OracleRecoveryAreaFull
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: CDB19_STBY
              oracledb.database.unique_name: CDB19_STBY
            exp_annotations:
              summary: 'Recovery area of CDB19_STBY is 95% full of space that cannot be reclaimed'

  - name: recovery area limit lowered under the usage fires after 10m (archiver-stuck scenario)
    interval: 1m
    input_series:
      # the shape of the archiver-stuck scenario (lab/oracle/scenarios/archiver-stuck.sh): illustrative values close to the
      # CDB19 primary's recovery area (not a kept record), the limit lowered at minute 5 from 20 GiB to 4000000000 bytes, below what cannot be reclaimed.
      # The scenario ends before this rule's hold; this test shows what a fault of 10 minutes or more fires.
      - series: 'oracledb.recovery_area.limit{service.instance.id="CDB19",oracledb.database.unique_name="CDB19"}'
        values: '21474836480x4 4000000000x35'
      - series: 'oracledb.recovery_area.usage{service.instance.id="CDB19",oracledb.database.unique_name="CDB19"}'
        values: '8428404224x40'
      - series: 'oracledb.recovery_area.reclaimable{service.instance.id="CDB19",oracledb.database.unique_name="CDB19"}'
        values: '1470878720x40'
    alert_rule_test:
      - eval_time: 12m   # the condition has held for 7 minutes
        groupname: oracledb-backup
        alertname: OracleRecoveryAreaFull
        exp_alerts: []
      - eval_time: 20m
        groupname: oracledb-backup
        alertname: OracleRecoveryAreaFull
        exp_alerts:
          - exp_labels:
              severity: warning
              service.instance.id: CDB19
              oracledb.database.unique_name: CDB19
            exp_annotations:
              summary: 'Recovery area of CDB19 is 173.9% full of space that cannot be reclaimed'
