# Host (operating system) alerts on the series the Collector's hostmetrics
# receiver emits, written to be shared by the labs (mounted in lab/pgha and
# lab/oracle). Written here, except HostDiskIOSaturation, which follows
# node_exporter's node-mixin (source next to the rule). Metric names and attributes: opentelemetry-collector-contrib
# receiver/hostmetricsreceiver at tag v0.165.0, the version lab/pgha/versions.sh
# pins (filesystemscraper, memoryscraper and diskscraper metadata.yaml); the
# series carry host.name and
# service.instance.id from the Collector's resource attributes. The memory
# metrics are off by default and are enabled in the Collector config
# (lab/pgha/files/otelcol.yaml.tmpl); system.disk.weighted_io_time is on by default.
# Thresholds (C4): a production default in
# the rule and an optional lab parameter, the recorded series
# obenhub.host.*.limit (ADR 0006), always written as
#   <expr> < (or >) on() group_left() (obenhub.host.<thing>.limit or on() vector(<default>))
# The labs' values equal the defaults, so none records an override today.
# Units of the limit series, read by scripts/gen-pack-alerts.py for
# docs/reference/host-pack-alerts.md:
# unit obenhub.host.disk_queue_depth.limit {request}
# unit obenhub.host.filesystem_free_ratio.limit 1
# unit obenhub.host.memory_available_ratio.limit 1
# The rules keep service.instance.id (the lab's Alertmanager groups by it) by
# aggregating on it next to host.name; they need no other lab label.
groups:
  - name: host
    interval: 15s
    rules:
      # Share of the filesystem still available to an unprivileged writer:
      # free / (free + used). system.filesystem.usage reports state free, used
      # and reserved; reserved blocks (ext4 root reserve) are in neither term,
      # which matches the Avail column of df (assumption: the scraper derives
      # free from f_bavail and reserved from f_bfree - f_bavail; source not
      # read; on 2026-11-10 the free series for / on pgha-1, 27001122816,
      # matched df Avail, 27000913920, read by hand). Only
      # real on-disk filesystems are looked at: the vfat /boot/efi is small,
      # static and not something the operator can relieve. The type list is a
      # lab choice. 10 % free for 2 m.
      - alert: HostFilesystemSpaceLow
        expr: |
          sum by (host.name, service.instance.id, mountpoint) (system.filesystem.usage{state="free", type=~"ext4|xfs|btrfs"})
            /
          sum by (host.name, service.instance.id, mountpoint) (system.filesystem.usage{state=~"free|used", type=~"ext4|xfs|btrfs"})
            < on() group_left()
          (obenhub.host.filesystem_free_ratio.limit or on() vector(0.1))
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Less than 10 % of {{ (index $labels "mountpoint") }} is free on {{ (index $labels "host.name") }}'
          description: "Under 10 % of a mounted ext4, xfs or btrfs filesystem is free for 2 minutes (system.filesystem.usage; 10 % unless the lab sets obenhub.host.filesystem_free_ratio.limit). Find what grows under the mount point named in the alert, for a PostgreSQL host start with the data and WAL directories."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/host/#hostfilesystemspacelow

      # MemAvailable (the kernel's estimate of memory a new workload can get
      # without swapping) as a share of MemTotal, per host. Not based on
      # system.memory.usage{state="used"}, whose meaning depends on the beta
      # feature gate receiver.hostmetricsreceiver.UseLinuxMemAvailable.
      # 10 % for 2 m.
      - alert: HostMemoryAvailableLow
        expr: |
          sum by (host.name, service.instance.id) (system.linux.memory.available)
            /
          sum by (host.name, service.instance.id) (system.memory.limit)
            < on() group_left()
          (obenhub.host.memory_available_ratio.limit or on() vector(0.1))
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Less than 10 % of memory is available on {{ (index $labels "host.name") }}'
          description: "MemAvailable (system.linux.memory.available) is under 10 % of the host's memory for 2 minutes (10 % unless the lab sets obenhub.host.memory_available_ratio.limit). Read MemAvailable and MemTotal in /proc/meminfo, then look for the process that grew."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/host/#hostmemoryavailablelow

      # Average number of requests in flight on a whole disk (iostat's aqu-sz):
      # rate(system.disk.weighted_io_time[5m]), a counter of seconds with
      # attribute device, on by default (diskscraper metadata.yaml at v0.165.0),
      # read by gopsutil v4.26.10 from field 11 of /proc/diskstats (Linux
      # Documentation/admin-guide/iostats.rst: milliseconds spent doing I/O,
      # weighted by the number of requests in flight). Expression, threshold
      # 10 and "for" 30m follow NodeDiskIOSaturation in node_exporter's
      # docs/node-mixin/alerts/alerts.libsonnet and config.libsonnet
      # (diskIOSaturationThreshold) at tag v1.13.1, commit
      # 0192dd896337e6eeb5935024cd5d8aec431caf3a, Apache-2.0 (its LICENSE file);
      # the metric is renamed and the device filter is ours. Devices: whole
      # disks only, listed by name: sd*, vd*, xvd*, hd*, nvme*n*, mmcblk*. The
      # labs report sda with its partitions (sda1, sda14, sda15: pgha,
      # 2026-11-27) and, on the Oracle VMs, sda..sdc with sda1..4 and
      # device-mapper volumes dm-0..3 on top of the disks, plus the optical
      # sr0. A partition repeats its disk's figure and a dm device repeats the
      # disk below it, so the anchored regex leaves out partitions (sda1, vda2,
      # nvme0n1p1, mmcblk0p1), dm-*, md*, loop*, ram* and sr*.
      # Baseline read from VictoriaMetrics on 2026-11-28 (per minute, all
      # retained data, fault-injection windows left out): highest 5 m value
      # 1.72 on pgha (11 days, p99 1.3-1.4) and 1.92 on oracle (8 days,
      # ora-au-lab sdc, p99 up to 0.6). Not the share of busy time
      # (system.disk.io_time): a multi-queue virtual disk stays below 100 %
      # under any load, and pgha's client load alone holds it at 51-55 %; not
      # the average latency either (system.disk.operation_time over
      # system.disk.operations): it leaves out flushes, and the lab's normal
      # highest values (8.6 ms pgha, 14 to 60 ms oracle) were above what a
      # synchronous load produced (4 to 6 ms). Both measured on pgha-2 on
      # 2026-11-28, lab/pgha/scenarios/disk-saturated.sh.
      - alert: HostDiskIOSaturation
        expr: |
          sum by (host.name, service.instance.id, device) (rate(system.disk.weighted_io_time{device=~"sd[a-z]+|vd[a-z]+|xvd[a-z]+|hd[a-z]+|nvme[0-9]+n[0-9]+|mmcblk[0-9]+"}[5m]))
            > on() group_left()
          (obenhub.host.disk_queue_depth.limit or on() vector(10))
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "device") }} on {{ (index $labels "host.name") }} had {{ $value | printf "%.1f" }} requests in flight on average over the last 5 minutes'
          description: "A whole disk had more than 10 requests in flight on average for 30 minutes (rate of system.disk.weighted_io_time over 5 minutes, iostat's aqu-sz; 10 unless the lab sets obenhub.host.disk_queue_depth.limit). Requests queue faster than the disk completes them, so each one waits longer: find the process doing the I/O, then compare the disk's throughput with what it can deliver."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/host/#hostdiskiosaturation

      # The 300 s are structural (the time from boot to the first scrape) and stay
      # literal, as the collection interval of the *CollectionIntervalTooLong rules.
      # The host booted less than 5 m ago: a reset of any kind (watchdog, power,
      # operator). No "for": system.uptime is a continuous series; the expression
      # limits the alert to the first 5 m after a boot, so the alert is itself the
      # event. The window is above the time from boot to the
      # node Collector's first scrape (lab value; in the network-partition run
      # the alert fired about a minute after the boot, the boot-to-first-scrape
      # time itself was not measured) and short enough to resolve before the next
      # fault run. A host whose Collector is down is CollectorAbsent's case.
      - alert: HostRebooted
        expr: |
          min by (host.name, service.instance.id) (system.uptime) < 300
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "host.name") }} booted {{ $value | humanizeDuration }} ago'
          description: "system.uptime of the host is under 5 minutes: it booted just now, whatever the reason (watchdog, power, operator). Check the host's boot log for the cause and the services that did not come back."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/host/#hostrebooted
