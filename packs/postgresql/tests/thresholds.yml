# Thresholds of the PostgreSQL pack, in the one form of C4: a production default in the
# rule and an optional lab parameter, the recorded series obenhub.*.limit. Two tests:
# defaults (no limit series: each rule fires just above its default and is quiet at it)
# and override (limit series recorded: each rule fires above the override, and a value
# between the default and the override stays quiet). For the tiered rules the override test moves the critical limit and checks that the warning band moves with it. The tests read the firing
# alerts back as ALERTS series, so a quiet case is a series missing from the list.
rule_files:
  - ../rules.yml
evaluation_interval: 15s

tests:
  - name: defaults - every limit series absent, fires just above the default, quiet at it
    interval: 15s
    input_series:
