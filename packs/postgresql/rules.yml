# PostgreSQL pack rules, mounted into vmalert by every PostgreSQL lab next to
# the Collector pack (packs/collector/rules.yml: Watchdog, CollectorAbsent,
# CollectorUnknown). Each lab defines the recorded series obenhub.expected_target
# (with an obenhub.collector label naming the Collector that collects it) in its
# own inventory group; PostgresTargetAbsent reads the service.name="postgresql"
# entries. Names follow the naming contract (ADR 0006).
# Identity (ADR 0006, decision 7): a target is obenhub.cluster.name together
# with service.instance.id, so every join below matches on both. A one-to-one
# match (arithmetic, comparison) adds k8s.pod.uid, so the last sample of a
# deleted pod never pairs with its recreated successor of the same name;
# where the label is absent on both sides the match is unchanged. Set
# operations (and, unless, or) leave the pod out: they ask about the instance.
# Gating: standby-only rules join on recovery.active == 1, so a primary never
# matches and missing data never fires.
groups:
  - name: postgresql
    interval: 15s
    rules:
      - alert: PostgresTargetAbsent
        expr: |
          obenhub.expected_target{service.name="postgresql"}
            unless on(obenhub.cluster.name, service.instance.id)
          present_over_time(postgresql.collection.heartbeat[2m])
            and on(obenhub.collector)
          label_replace(present_over_time(otelcol_process_uptime[1m]), "obenhub.collector", "$1", "service.instance.id", "(.+)")
        # The heartbeat of a PostgreSQL target is postgresql.collection.heartbeat.
        # A target is absent only while the Collector that collects it is alive
        # (obenhub.collector, matched to the Collector's self-metrics
        # service.instance.id): the 1m window empties before the 2m one, so a
        # stopped Collector raises only its own CollectorAbsent. The Alertmanager inhibit alone lost the race in the
        # lab (2026-11-06, collector-stopped): vmalert's startsAt is older than
        # group_wait, so Alertmanager sends at once, in whatever order.
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'No heartbeat from {{ (index $labels "service.instance.id") }}'
          description: "An expected PostgreSQL target has sent no heartbeat (postgresql.collection.heartbeat) for 2 minutes while its Collector is alive. Check that PostgreSQL runs and that the monitoring role can connect."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgrestargetabsent

      # A target without obenhub.cluster.name (ADR 0006, decision 7). Every
      # join of this pack matches on it, so such a target would pair with
      # nothing: the rules that need a partner stay silent and PostgresTargetAbsent
      # fires against its inventory entry. This says why.
      - alert: PostgresClusterNameMissing
        expr: postgresql.collection.heartbeat{obenhub.cluster.name=""}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} reports no obenhub.cluster.name'
          description: "A PostgreSQL target carries no obenhub.cluster.name, so every join of the pack pairs it with nothing and PostgresTargetAbsent fires against its inventory entry. Fix the resource attribute of the Collector."
          runbook_url: https://msavdert.github.io/obenhub/reference/postgresql-pack-alerts/#postgresclusternamemissing

      # The rules of this pack size their windows for a collection every 15 s
      # (README, "Collection interval"): [30s] holds two collections, the
      # [75s:15s] subqueries five. Collected only every 60 s, a 30 s window
      # holds one sample or none, so the rules go quiet or flap without any
      # error. This says it: the average distance between the samples of
      # postgresql.collection.heartbeat (the series PostgresTargetAbsent reads) over 5 m is above 20 s.
      # scrape_interval() is MetricsQL (VictoriaMetrics): the average interval
      # in seconds between the raw samples in the window. One missed sample at
      # 15 s gives about 16 s and stays quiet; a series at 30 s, where a 30 s
      # window holds one sample, fires: the threshold of 20 s leaves room for
      # jitter at 15 s.
      # max by (...): one value per target, also while a recreated pod's old
      # series is still in the window.
      - alert: PostgresCollectionIntervalTooLong
        expr: max by (obenhub.cluster.name, service.instance.id) (scrape_interval(postgresql.collection.heartbeat[5m])) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'PostgreSQL {{ (index $labels "service.instance.id") }} is collected every {{ $value | printf "%.0f" }} s, the rules assume 15 s'
          description: "The target is collected less often than every 15 s (average spacing above 20 s over 5 minutes), while the rules size their windows for 15 s, so they go quiet or flap. Set the collection interval back to 15 s."
          runbook_url: https://msavdert.github.io/obenhub/reference/postgresql-pack-alerts/#postgrescollectionintervaltoolong

      - alert: PostgresStandbyNotStreaming
        # Not while no PostgreSQL of the same cluster is writable: then every
        # member is in recovery and none can stream; a cluster manager's own
        # alert says that (stage 3: PatroniNoWritablePrimary). The guard is per
        # cluster: another cluster's writable node, a logical subscriber
        # included (slice1-subscriber is its own cluster), neither silences
        # nor confirms it. "A node is writable" is read from the pack
        # (recovery.active == 0), so the two sources stay independent.
        # The join includes k8s.pod.uid: on Kubernetes a deleted pod's last
        # sample (streaming 0, as on any primary) stays visible for the
        # staleness lookback and would otherwise match the recreated pod of the
        # same name in recovery (lab/k8s primary-deleted, run 2026-11-11).
        # Where the label is absent on both sides (VM and Compose labs) the
        # join is unchanged.
        expr: |
          postgresql.wal_receiver.streaming == 0
            and on(obenhub.cluster.name, service.instance.id, k8s.pod.uid)
          postgresql.recovery.active == 1
            and on(obenhub.cluster.name)
          count by (obenhub.cluster.name) (postgresql.recovery.active == 0) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} is in recovery and not streaming'
          description: "A standby is in recovery with no WAL receiver streaming for a minute, while another member of the cluster is writable. Query pg_stat_wal_receiver on the standby and pg_stat_replication on the primary."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresstandbynotstreaming

      # Fewer standbys listed as sync or quorum by pg_stat_replication than
      # synchronous_standby_names requires (FIRST n, ANY n, n, a plain list or
      # * is 1, empty is 0; see the pack query). Primary only. It assumes
      # synchronous_commit waits for a standby (on, remote_write or
      # remote_apply); with local or off commits do not wait and the alert
      # still fires. With Patroni synchronous_mode_strict on, Patroni leaves the
      # setting in place and every commit blocks; without strict it empties the
      # setting after a loop and this alert cannot see the loss (lab scenario
      # synchronous-standby-cut, lab/pgha/README.md). 1m is a lab value.
      - alert: PostgresSynchronousStandbyMissing
        expr: |
          postgresql.replication.synchronous_standby.count
            < on(obenhub.cluster.name, service.instance.id, k8s.pod.uid)
          postgresql.replication.synchronous_standby.required
            and on(obenhub.cluster.name, service.instance.id)
          postgresql.recovery.active == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} has fewer synchronous standbys than synchronous_standby_names requires: commits wait'
          description: "The primary lists fewer synchronous standbys in pg_stat_replication than synchronous_standby_names requires, for a minute; commits wait for a standby. Check which standby dropped out of pg_stat_replication."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgressynchronousstandbymissing

      - alert: PostgresReplayBacklog
        expr: |
          postgresql.replay.backlog > 16 * 1024 * 1024
            and on(obenhub.cluster.name, service.instance.id)
          postgresql.recovery.active == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} replay backlog is {{ $value | humanize1024 }}B'
          description: "A standby has received more than 16 MiB of WAL it has not replayed, for a minute. Check pg_is_wal_replay_paused() on the standby."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresreplaybacklog

      - alert: PostgresSnapshotHeldTooLong
        expr: postgresql.snapshot.oldest_age > 120
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'A snapshot on {{ (index $labels "service.instance.id") }} is {{ $value | humanizeDuration }} old (lab threshold)'
          description: "A snapshot on the instance is older than 120 seconds for 30 seconds (lab threshold), which holds back the xmin horizon. Look for the oldest transaction in pg_stat_activity by xact_start and backend_xmin."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgressnapshotheldtoolong

      # The xmin horizon held without a client transaction to blame: a replication
      # slot (xmin, catalog_xmin), standby feedback (a walsender's backend_xmin)
      # or a prepared transaction pins old row versions, and
      # postgresql.snapshot.oldest_age (seconds, client transactions and prepared
      # transactions only) shows nothing for the first two. The metric is an
      # age in transactions (queries.yaml), so the threshold depends on the
      # workload: 10 million is an assumption (5 % of autovacuum_freeze_max_age,
      # default 200 million; PostgreSQL 18 docs, runtime-config-autovacuum, not read: unverified), about
      # three hours at 1000 transactions/s. Suppressed while PostgresSnapshotHeldTooLong's
      # condition holds on the instance (a client snapshot older than 120 s
      # explains the horizon and has its own alert). Not reachable in a lab run
      # (unit tests only, as PostgresTransactionIdWraparound): hot_standby_feedback
      # is off in every lab, the heaviest load client is stage3's pgbench at
      # -R 100 (lab/stage3/scripts/load.sh; 10 million transactions take about
      # 28 hours), and a scenario holds a slot or snapshot for minutes.
      - alert: PostgresXminHorizonHeld
        expr: |
          postgresql.xmin_horizon.age > 10000000
            unless on(obenhub.cluster.name, service.instance.id)
          postgresql.snapshot.oldest_age > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'The xmin horizon on {{ (index $labels "service.instance.id") }} is {{ $value | humanize }} transactions old with no client snapshot over 120 s: check replication slots, standby feedback and prepared transactions (assumed threshold)'
          description: "The xmin horizon is more than 10 million transactions old for 5 minutes with no client snapshot over 120 s to explain it, so something else pins old row versions. Check pg_replication_slots (xmin, catalog_xmin), pg_stat_replication (backend_xmin) and pg_prepared_xacts."
          runbook_url: https://msavdert.github.io/obenhub/reference/postgresql-pack-alerts/#postgresxminhorizonheld

      # Two tiers share one alertname and differ in severity, with no `for` and so
      # no pending state: the old `for` became a window inside the expression.
      # x = min_over_time(value[W':15s]) is the lowest value over the last W',
      # where W' = the time a tier used to need before firing (its old `for`)
      # plus one 15s step: a subquery window (t-W', t] holds W'/15s points
      # (the left edge is excluded, found with vmalert-tool v1.155.0), while
      # `for` needed one sample more than its length / 15s. Critical is x above
      # the critical threshold; warning is x above the warning threshold unless
      # the critical holds. At every evaluation exactly one tier is up while the
      # value stays above the warning threshold for W': when escalating,
      # de-escalating and across a single dip (a dip below the critical
      # threshold shows the warning for W', then the critical returns). A value
      # that jumps from below the warning threshold to above the critical one
      # never shows the warning, because both windows fill at the same
      # evaluation.
      # Warm-up: both tiers also require n = count_over_time(value[W':15s]) to
      # equal a full window (W'/15s points), as the old `for` required a full run
      # of evaluations. A new series, or one returning after a gap longer than
      # the lookback, therefore stays silent until its window is full. Points
      # bridged by the lookback after a missed scrape still count, so a single
      # lost sample does not restart the warm-up.
      # Suppression lives in the expressions, not in Alertmanager inhibit rules
      # (see lab/mon/alertmanager.yml). $value in the summaries is the lowest
      # value of the window, not the latest one.
      # PostgresConnectionSaturation, old for 1m, W' = 75s (5 points): critical at a ratio
      # of 0.95 or more, warning above 0.85 and below 0.95.
      - alert: PostgresConnectionSaturation
        expr: |
          WITH (
            r = postgresql.client_connection.count
              / on(obenhub.cluster.name, service.instance.id, k8s.pod.uid)
            postgresql.client_connection.limit,
            x = min_over_time(r[75s:15s]),
            n = count_over_time(r[75s:15s])
          )
          ((x > 0.85) unless (x >= 0.95)) and (n >= 5)
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} client connections above 85% of capacity'
          description: "Client connections are above 85 % of the connection limit (critical at 95 %), as the lowest value over the last 75 seconds. Count sessions in pg_stat_activity by state and application to find who holds them."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresconnectionsaturation

      - alert: PostgresConnectionSaturation
        expr: |
          WITH (
            r = postgresql.client_connection.count
              / on(obenhub.cluster.name, service.instance.id, k8s.pod.uid)
            postgresql.client_connection.limit,
            x = min_over_time(r[75s:15s]),
            n = count_over_time(r[75s:15s])
          )
          (x >= 0.95) and (n >= 5)
        labels:
          severity: critical
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} client connections at or above 95% of capacity'
          description: "Client connections are above 85 % of the connection limit (critical at 95 %), as the lowest value over the last 75 seconds. Count sessions in pg_stat_activity by state and application to find who holds them."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresconnectionsaturation

      # Wraparound: age as a fraction of 2^31 (2147483648), the point where
      # PostgreSQL stops accepting commands. 50 % and 75 % are pgMonitor's
      # "percent towards wraparound" thresholds as recorded in the private
      # dbsight survey (pgMonitor at 862ff68, crunchy-alert-rules-pg.yml.example
      # L320-L359); that file was not re-read here, so the numbers are an
      # unconfirmed assumption. `kind` tells transaction ids from multixact ids;
      # postgresql.database.name comes from the pack. Primary only: a physical standby repeats the
      # primary's datfrozenxid, so it would alert twice. Not reachable in a lab
      # run (it takes about a billion transactions): unit tests only, the metric
      # itself is present in both labs. Tiers as described above, old for 5m, W' = 315s (21 points):
      # critical above 0.75, warning above 0.5 up to and including 0.75.
      - alert: PostgresTransactionIdWraparound
        expr: |
          WITH (
            f = label_set(postgresql.database.xid_age / 2147483648, "kind", "xid")
              or
            label_set(postgresql.database.mxid_age / 2147483648, "kind", "mxid"),
            x = min_over_time(f[315s:15s]),
            n = count_over_time(f[315s:15s])
          )
          (((x > 0.5) unless (x > 0.75)) and (n >= 21))
            and on(obenhub.cluster.name, service.instance.id)
          postgresql.recovery.active == 0
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.kind }} age of {{ (index $labels "postgresql.database.name") }} on {{ (index $labels "service.instance.id") }} is {{ $value | humanizePercentage }} of the wraparound limit'
          description: "The age of a database's datfrozenxid (kind xid) or datminmxid (kind mxid) is above 50 % of the wraparound limit 2^31 (critical above 75 %). Check pg_database for the database and whether autovacuum freezing can progress."
          runbook_url: https://msavdert.github.io/obenhub/reference/postgresql-pack-alerts/#postgrestransactionidwraparound

      - alert: PostgresTransactionIdWraparound
        expr: |
          WITH (
            f = label_set(postgresql.database.xid_age / 2147483648, "kind", "xid")
              or
            label_set(postgresql.database.mxid_age / 2147483648, "kind", "mxid"),
            x = min_over_time(f[315s:15s]),
            n = count_over_time(f[315s:15s])
          )
          ((x > 0.75) and (n >= 21))
            and on(obenhub.cluster.name, service.instance.id)
          postgresql.recovery.active == 0
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.kind }} age of {{ (index $labels "postgresql.database.name") }} on {{ (index $labels "service.instance.id") }} is {{ $value | humanizePercentage }} of the wraparound limit'
          description: "The age of a database's datfrozenxid (kind xid) or datminmxid (kind mxid) is above 50 % of the wraparound limit 2^31 (critical above 75 %). Check pg_database for the database and whether autovacuum freezing can progress."
          runbook_url: https://msavdert.github.io/obenhub/reference/postgresql-pack-alerts/#postgrestransactionidwraparound

      # Idle in a transaction is a session that stopped talking, not a long
      # statement: postgresql.transaction.idle_age counts from the moment it
      # went idle. PostgresSnapshotHeldTooLong is the other half (the xmin horizon,
      # held by a running query as well). Thresholds are lab thresholds, scaled
      # down from pgMonitor's 300 s and 900 s (same survey, L199-L216,
      # unconfirmed here). Tiers as described above, old for 30s, W' = 45s (3 points): critical above 180 s,
      # warning above 60 s up to and including 180 s.
      - alert: PostgresIdleInTransaction
        expr: |
          WITH (
            x = min_over_time(postgresql.transaction.idle_age[45s:15s]),
            n = count_over_time(postgresql.transaction.idle_age[45s:15s])
          )
          ((x > 60) unless (x > 180)) and (n >= 3)
        labels:
          severity: warning
        annotations:
          summary: 'A session on {{ (index $labels "service.instance.id") }} has been idle in a transaction for {{ $value | humanizeDuration }} (lab threshold)'
          description: "A session has been idle in a transaction for more than 60 seconds (critical over 180 s; lab thresholds). Find it in pg_stat_activity where state is idle in transaction, ordered by state_change."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresidleintransaction

      - alert: PostgresIdleInTransaction
        expr: |
          WITH (
            x = min_over_time(postgresql.transaction.idle_age[45s:15s]),
            n = count_over_time(postgresql.transaction.idle_age[45s:15s])
          )
          (x > 180) and (n >= 3)
        labels:
          severity: critical
        annotations:
          summary: 'A session on {{ (index $labels "service.instance.id") }} has been idle in a transaction for {{ $value | humanizeDuration }} (lab threshold)'
          description: "A session has been idle in a transaction for more than 60 seconds (critical over 180 s; lab thresholds). Find it in pg_stat_activity where state is idle in transaction, ordered by state_change."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresidleintransaction

      # The oldest lock wait. Lab threshold; one tier, because a wait is a
      # symptom whose cause (the blocker) the pack does not name.
      - alert: PostgresBlockedSessions
        expr: postgresql.lock.oldest_wait_age > 30
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'A session on {{ (index $labels "service.instance.id") }} has waited {{ $value | humanizeDuration }} for a lock (lab threshold)'
          description: "A session has waited more than 30 seconds for a lock (lab threshold). Join pg_locks with pg_stat_activity or call pg_blocking_pids() to find the blocker."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresblockedsessions

      # postgresql.deadlocks is postgresqlreceiver's optional metric (enabled in
      # both labs' Collector configs) and only covers the databases listed in
      # the receiver's `databases`. last minus first sample in the window, not
      # increase or delta: MetricsQL counts a counter that is new in the window
      # from zero, so a Collector restart would read the lifetime total as fresh
      # deadlocks (seen in a unit test with a flat counter, 2026-11-08, for
      # increase, increase_pure and delta). A reset to zero reads as negative
      # and does not fire; the accepted trade-off is that a reset followed by a
      # rise back above the first sample within the window can hide deadlocks.
      # Any deadlock in the last 5 minutes fires: PostgreSQL
      # resolves it by aborting one session, so this is evidence, not a page.
      - alert: PostgresDeadlocks
        expr: last_over_time(postgresql.deadlocks[5m]) - first_over_time(postgresql.deadlocks[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | printf "%.0f" }} deadlock(s) in {{ (index $labels "postgresql.database.name") }} on {{ (index $labels "service.instance.id") }} in the last 5 minutes'
          description: "The deadlock counter of a database rose within the last 5 minutes. PostgreSQL resolves a deadlock by aborting one session, so this is evidence, not an outage; check the PostgreSQL log."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresdeadlocks

      # Requested checkpoints (pg_stat_checkpointer.num_requested on
      # PostgreSQL 17+, read by postgresqlreceiver as
      # postgresql.bgwriter.checkpoint.count{type="requested"}): WAL reached
      # max_wal_size before checkpoint_timeout. Requested checkpoints also come
      # from CHECKPOINT, CREATE DATABASE, base backups, promotion and
      # shutdown, so one or two per 5 minutes are normal; the lab threshold of more
      # than 3 per 5 minutes is an assumption checked against the default-config
      # labs (a handful of requested checkpoints per day) and the
      # checkpoint-pressure scenario. The 5 minute window keeps the resolve
      # time inside the scenario's 10 minute limit.
      # Last minus first sample, for the reason given at PostgresDeadlocks.
      # Primary only: a standby counts restartpoints.
      - alert: PostgresCheckpointsRequested
        expr: |
          (
            last_over_time(postgresql.bgwriter.checkpoint.count{type="requested"}[5m])
              - first_over_time(postgresql.bgwriter.checkpoint.count{type="requested"}[5m])
          ) > 3
            and on(obenhub.cluster.name, service.instance.id)
          postgresql.recovery.active == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} had {{ $value | printf "%.0f" }} requested checkpoints in 5 minutes (lab threshold)'
          description: "More than 3 requested checkpoints in 5 minutes on a primary: WAL reached max_wal_size before checkpoint_timeout (lab threshold). Check max_wal_size against the WAL volume and what writes it."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgrescheckpointsrequested

      # A physical slot without a consumer keeps WAL until
      # max_slot_wal_keep_size. Primary only: Patroni keeps member slots on
      # replicas too, and those are inactive by design. Lab threshold. An
      # invalidated slot retains no WAL and has its own alert
      # (PostgresReplicationSlotInvalidated, below), so it is excluded.
      - alert: PostgresPhysicalSlotInactive
        expr: |
          (
            postgresql.replication_slot.inactive_age{postgresql.replication_slot.type="physical"} > 120
              unless on(obenhub.cluster.name, service.instance.id, postgresql.replication_slot.name)
            postgresql.replication_slot.invalidated == 1
          )
            and on(obenhub.cluster.name, service.instance.id)
          postgresql.recovery.active == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Physical slot {{ (index $labels "postgresql.replication_slot.name") }} on {{ (index $labels "service.instance.id") }} has been inactive for {{ $value | humanizeDuration }} (lab threshold)'
          description: "A physical replication slot on the primary has had no consumer for more than 120 seconds and is not invalidated, so it keeps WAL. Check pg_replication_slots and whether its standby is still connected."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresphysicalslotinactive

      # Any slot, physical or logical, on any node. Lab scenario slot-invalidated (slice1): an
      # unused physical slot falls more than max_slot_wal_keep_size behind and
      # a CHECKPOINT removes its WAL (wal_status lost, reason wal_removed).
      - alert: PostgresReplicationSlotInvalidated
        expr: postgresql.replication_slot.invalidated == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: 'Slot {{ (index $labels "postgresql.replication_slot.name") }} on {{ (index $labels "service.instance.id") }} is invalidated ({{ (index $labels "postgresql.replication_slot.invalidation_reason") }})'
          description: "A replication slot is invalidated for 30 seconds; the invalidation reason is in the alert. The slot no longer retains WAL. Check pg_replication_slots (wal_status, invalidation_reason) and the consumer that depended on it."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresreplicationslotinvalidated

      # A slot, valid and not yet invalidated, that holds back more than
      # 512 MiB of WAL on a primary: the volume is filling. Fires per slot,
      # whatever the type and whether the slot is active (a consumer that is
      # connected but far behind retains the same WAL). Lab threshold, set
      # against the k8s lab's guard max_slot_wal_keep_size = 1GB (lab/k8s/cnpg/cluster.yaml,
      # read as -1 = unlimited on 2026-11-11): half of it, so the alert comes
      # while the slot is still valid. An invalidated slot retains nothing and
      # has PostgresReplicationSlotInvalidated. Primary only: CloudNativePG (and
      # Patroni) copy slots to the replicas, where retained_wal is a few
      # hundred KB to 1 MB and means nothing (read on the k8s, pgha and stage3
      # labs on 2026-11-11).
      # Read from the existing labs on 2026-11-11 (pgha, stage3, slice1; five
      # days of history, 30 s steps): in their normal state retained_wal on a
      # primary is below 1 MB. Replay-heavy scenarios push a valid slot past
      # 256 MiB for under 6 minutes in total (stage3 reached 411 MB), never
      # past 512 MiB; slice1 slot-invalidated and subscription-disabled each
      # touched it in two isolated 30 s samples, which the 2 minute hold rides
      # out. A sustained breach in those labs would now alert; the hold is the
      # only protection. Accepted miss: a slot that retains less than the
      # threshold for ever, or one that goes from below to invalidated inside
      # one hold time.
      # Smoke run 2026-11-11 (k8s lab, replica cut, 700 MiB written): fired
      # 2m48s after the writes ended, resolved 1m after the cut was removed
      # (the replica consumed the WAL). The scratch table must not be left to
      # autovacuum: that doubled the WAL in the first run and the slot passed
      # the guard (status unreserved).
      # Lab scenarios: lab/k8s/scenarios/slot-retaining-wal.sh, lab/slice1/scenarios/slot-retaining-wal.sh.
      - alert: PostgresReplicationSlotRetainingWAL
        expr: |
          (
            postgresql.replication_slot.retained_wal > 512 * 1024 * 1024
              unless on(obenhub.cluster.name, service.instance.id, postgresql.replication_slot.name)
            postgresql.replication_slot.invalidated == 1
          )
            and on(obenhub.cluster.name, service.instance.id)
          postgresql.recovery.active == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Slot {{ (index $labels "postgresql.replication_slot.name") }} on {{ (index $labels "service.instance.id") }} retains {{ $value | humanize1024 }}B of WAL (lab threshold)'
          description: "A valid slot on a primary holds back more than 512 MiB of WAL for 2 minutes (lab threshold), so the volume is filling. Check pg_replication_slots (retained WAL, active) and bring the consumer back or drop the slot."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresreplicationslotretainingwal

      # WAL archiving, two alerts that fail differently (PostgreSQL 18 docs,
      # 25.3.1 Setting Up WAL Archiving). PostgresArchivingFailing reads
      # pg_stat_archiver: the archive_command ran and returned non-zero, and
      # the last failure is newer than the last success. It clears by itself
      # once an attempt succeeds. It cannot see a failure that aborts the
      # archiver process (signal, exit status above 125; the docs say those are
      # not recorded in pg_stat_archiver) and not an archive_command that hangs
      # or is merely slower than the WAL rate. PostgresArchiveBacklog reads what
      # the archiver has not done: segments with a .ready file in
      # pg_wal/archive_status, which stay in pg_wal until archived and can fill
      # the disk. It fires for any cause. The lab threshold, 8 files (128 MB at
      # the default 16 MB segment size), is an assumption: the control run
      # shows what the lab's workload leaves waiting. Both are silent where
      # archive_mode is off (no failures, no .ready files).
      # Lab scenario: lab/slice1/scenarios/archiver-failing.sh.
      - alert: PostgresArchivingFailing
        expr: postgresql.archiver.failing == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'WAL archiving on {{ (index $labels "service.instance.id") }} is failing: the last attempt failed and no attempt has succeeded since'
          description: "The archive_command ran and failed, and the last failure is newer than the last success, for a minute. Check pg_stat_archiver (last_failed_wal, last_failed_time) and the PostgreSQL log for the command's error."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresarchivingfailing

      - alert: PostgresArchiveBacklog
        expr: postgresql.archiver.ready_file.count > 8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | printf "%.0f" }} WAL files on {{ (index $labels "service.instance.id") }} are waiting for the archiver (lab threshold)'
          description: "More than 8 WAL segments wait with a .ready file in pg_wal/archive_status for 2 minutes (lab threshold); they stay in pg_wal until archived and can fill the disk. Check pg_stat_archiver and the archive_command."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresarchivebacklog

      # The two metric lists below must equal queries.yaml (less the exclusions
      # listed in the script): scripts/check-series-vanished.py, mise run
      # lint:series-vanished, fails when they drift.
      # Covers the pack and postgresqlreceiver's database.count (a canary for the
      # receiver). Every pack query returns at least one row on every node, or
      # (slots, subscriptions) none by design, so the list holds both kinds. `on(__name__)` is not honoured by binary
      # operators, so the metric name
      # is copied into the `metric` label first; that also puts it in the alert.
      # Looks back 1h: a series gone for longer resolves silently; a dead target
      # is still caught by PostgresTargetAbsent. Slot series exist only where
      # slots exist (the primary) and subscription series only on the
      # subscriber; the match is per instance, so a node that never had them
      # is silent. Dropping the last slot or subscription on purpose therefore
      # alerts for up to an hour; that is accepted, not filtered.
      - alert: PostgresSeriesVanished
        expr: |
          label_copy(last_over_time({__name__=~"postgresql[.](recovery[.]active|wal_receiver[.]streaming|replay[.](backlog|paused)|snapshot[.]oldest_age|xmin_horizon[.]age|client_connection[.](count|limit)|database[.](count|xid_age|mxid_age)|transaction[.]idle_age|lock[.](waiting_session[.]count|oldest_wait_age)|replication[.]synchronous_standby[.](count|required)|replication_slot[.](active|retained_wal|unconfirmed_wal|wal_status|invalidated|inactive_age)|subscription[.](enabled|apply_worker_running|last_msg_age|apply_error|sync_error|conflict)|archiver[.](archived_file|failure|failing|ready_file[.]count))"}[1h]) keep_metric_names, "__name__", "metric")
            unless on(metric, obenhub.cluster.name, service.instance.id)
          label_copy(present_over_time({__name__=~"postgresql[.](recovery[.]active|wal_receiver[.]streaming|replay[.](backlog|paused)|snapshot[.]oldest_age|xmin_horizon[.]age|client_connection[.](count|limit)|database[.](count|xid_age|mxid_age)|transaction[.]idle_age|lock[.](waiting_session[.]count|oldest_wait_age)|replication[.]synchronous_standby[.](count|required)|replication_slot[.](active|retained_wal|unconfirmed_wal|wal_status|invalidated|inactive_age)|subscription[.](enabled|apply_worker_running|last_msg_age|apply_error|sync_error|conflict)|archiver[.](archived_file|failure|failing|ready_file[.]count))"}[2m]) keep_metric_names, "__name__", "metric")
            and on(obenhub.cluster.name, service.instance.id)
          present_over_time(postgresql.collection.heartbeat[2m])
        # Only while the target's heartbeat lives: a dead target or Collector
        # is PostgresTargetAbsent or CollectorAbsent, not one alert per series.
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.metric }} vanished on {{ (index $labels "service.instance.id") }}'
          description: "A metric of the pack that was present in the last hour has disappeared on an instance whose heartbeat is still present; the metric name is in the alert. Check the Collector log for failing queries and the monitoring role's privileges."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgresseriesvanished

      # Two or more instances of one cluster are writable at the same time
      # (postgresql.recovery.active == 0): two primaries, split brain. This
      # reads PostgreSQL itself, so it holds with any cluster manager or none
      # (Patroni, CloudNativePG, a manual promote). A cluster is the set of
      # members of one physical (streaming) replication group: they share
      # obenhub.cluster.name, unique within the backend (ADR 0006, decision 7;
      # k8s.namespace.name is grouped on too, absent off Kubernetes). A logical subscriber is a cluster of its own and has its
      # own obenhub.cluster.name (slice1-subscriber), or it would always count as a
      # second primary.
      # Only fresh samples count: last_over_time over 30 s (two 15 s
      # collections) returns the latest value per series and drops a series
      # that has not reported for 30 s: a dead primary's last 0 would
      # otherwise live on for the backend's staleness lookback (minutes) and
      # fire next to the promoted primary. The inner max by service.instance.id
      # keeps one value per instance: a recreated Kubernetes pod of the same
      # name is a new series (k8s.pod.uid) and the deleted pod's last 0 must
      # not count twice; max prefers "in recovery" (1), so this can only hide
      # an alert, never invent one.
      # "for" is 60 s (four evaluations). The stale 0 of a deleted primary
      # lives 30 s after its last sample (the window; two 15 s scrapes), so a
      # failover overlap is at most that 30 s plus the 15 s between the
      # promoted instance's first sample and the stale one's last: a 45 s
      # worst case, which the unit test (failover) uses. That is a derived
      # bound, not a measurement. What the recorded suites of 2026-11-12 show
      # is overlaps of a single 15 s sample (k8s switchover at 05:19:00 UTC);
      # no recorded overlap is longer. "for" is the 45 s bound plus one scrape
      # interval (15 s) of margin. Patroni: the leader key expires 20 to 30 s
      # after the last sample, so the overlap is shorter still.
      # Trade-off, accepted: a real split brain shorter than about 75 s (the
      # hold plus one 15 s sample) is not alerted; dropping a
      # series after two missed collections can only hide an alert.
      - alert: PostgresMultiplePrimaries
        expr: |
          count by (obenhub.cluster.name, k8s.namespace.name) (
            max by (obenhub.cluster.name, k8s.namespace.name, service.instance.id) (
              last_over_time(postgresql.recovery.active[30s])
            ) == 0
          ) > 1
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: 'Cluster {{ (index $labels "obenhub.cluster.name") }} has {{ $value }} writable instances (split brain)'
          description: "Two or more instances of one cluster are writable (postgresql.recovery.active 0) at the same time for 60 seconds: split brain, independent of any cluster manager. Check pg_is_in_recovery() on every member and stop one."
          runbook_url: https://msavdert.github.io/obenhub/reference/postgresql-pack-alerts/#postgresmultipleprimaries

  # Logical replication. The series come from the subscription and
  # replication-slot queries of queries.yaml, which return a row only per
  # subscription or slot: no subscription means no postgresql.subscription.*
  # series, so the two subscription rules cannot match, and the slot rule
  # reads logical slots only (postgresql.replication_slot.type="logical"), so
  # an instance without them never fires any rule of this group. Thresholds
  # are lab values. Measured in the
  # lab on a healthy idle subscription: last_msg_age peaks near 30 s (the
  # publisher's keepalive at half of wal_sender_timeout = 60 s). A network
  # cut moves apply_error_count by exactly 1 (the apply worker dies on
  # wal_receiver_timeout; measured 42 -> 43), then not again, while a
  # conflict raises it every retry. So two or more errors, not one, mean a
  # failing change.
  - name: logical-replication
    interval: 15s
    rules:
      # apply_error_count rises on every retry of a failing change (measured:
      # +1 about every 5 s, wal_retrieve_retry_interval, for an insert_exists
      # conflict), so two or more over 3 m means the apply worker is failing;
      # a single increase is a timeout or a one-off, and the not-streaming
      # alert covers a dead connection.
      # The rise is last minus first sample in the window, not increase(), so a
      # counter that appears already high (Collector restart) is not read as
      # fresh errors; see the comment at PostgresDeadlocks for the reason and
      # the trade-off.
      - alert: PostgresLogicalApplyErrors
        expr: |
          (last_over_time(postgresql.subscription.apply_error[3m]) - first_over_time(postgresql.subscription.apply_error[3m]))
            + (last_over_time(postgresql.subscription.sync_error[3m]) - first_over_time(postgresql.subscription.sync_error[3m])) >= 2
        labels:
          severity: critical
        annotations:
          summary: 'Subscription {{ (index $labels "postgresql.subscription.name") }} on {{ (index $labels "service.instance.id") }} has apply or sync errors'
          description: "A logical subscription raised its apply or sync error counter by 2 or more within 3 minutes: the apply worker keeps failing on a change. Check pg_stat_subscription_stats and the subscriber's PostgreSQL log for the conflicting row."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgreslogicalapplyerrors

      # An enabled subscription that is not receiving, by either branch:
      # - the apply worker is absent for most of 1 m (avg_over_time < 0.5; the
      #   average smooths the worker restart loop). This is what fires in the
      #   logical-cut scenario: with the default wal_receiver_timeout of 60 s
      #   the worker is killed after 60 s of silence, so
      # - last_msg_age > 60 (a worker that is alive but silent for longer than
      #   twice the ~30 s a healthy idle subscription peaks at) can only be
      #   reached when wal_receiver_timeout is longer than 60 s or 0. It is
      #   unit-tested only; no scenario reaches it with the default setting.
      # Not while the subscription is failing with errors (PostgresLogicalApplyErrors owns that
      # case: the worker restarts every 5 s) and not while the target is
      # absent. Both are expressed here, not as an Alertmanager inhibit, for
      # the reason given at PostgresTargetAbsent. A disabled subscription
      # (enabled 0) never matches.
      - alert: PostgresLogicalSubscriptionNotStreaming
        expr: |
          (
            postgresql.subscription.enabled == 1
              and on(obenhub.cluster.name, service.instance.id, postgresql.subscription.name)
            (
              avg_over_time(postgresql.subscription.apply_worker_running[1m]) < 0.5
                or on(obenhub.cluster.name, service.instance.id, postgresql.subscription.name)
              postgresql.subscription.last_msg_age > 60
            )
          )
            unless on(obenhub.cluster.name, service.instance.id, postgresql.subscription.name)
          (
            (last_over_time(postgresql.subscription.apply_error[3m]) - first_over_time(postgresql.subscription.apply_error[3m]))
              + on(obenhub.cluster.name, service.instance.id, k8s.pod.uid, postgresql.subscription.name)
            (last_over_time(postgresql.subscription.sync_error[3m]) - first_over_time(postgresql.subscription.sync_error[3m])) >= 2
          )
            and on(obenhub.cluster.name, service.instance.id)
          present_over_time(postgresql.collection.heartbeat[2m])
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Subscription {{ (index $labels "postgresql.subscription.name") }} on {{ (index $labels "service.instance.id") }} is enabled but not receiving'
          description: "An enabled subscription has had no apply worker for most of a minute, or no message for over 60 seconds, without errors that PostgresLogicalApplyErrors would own. Check pg_stat_subscription on the subscriber and the connection to the publisher."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgreslogicalsubscriptionnotstreaming

      # On the publisher. Inactive for 3 m (a subscriber restart or a worker
      # restart loop resets inactive_age and does not match), or more than
      # 128 MiB not yet confirmed for the whole hold time. The bytes branch has
      # no lab scenario (it would need a stuck but connected subscriber and
      # 128 MiB of writes); it is covered by a unit test only. A failing
      # subscription (logical-conflict) restarts its walsender every 5 s, so
      # inactive_age stays small and a few rows stay far below the
      # threshold: the slot alert does not fire there, and the scenario
      # asserts that. Physical slots are out of scope here (standby-stopped
      # leaves standby1 inactive on purpose).
      - alert: PostgresLogicalSlotStalled
        expr: |
          (
            postgresql.replication_slot.inactive_age{postgresql.replication_slot.type="logical"} > 180
              or on(obenhub.cluster.name, service.instance.id, postgresql.replication_slot.name)
            postgresql.replication_slot.unconfirmed_wal{postgresql.replication_slot.type="logical"} > 128 * 1024 * 1024
          )
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Logical slot {{ (index $labels "postgresql.replication_slot.name") }} on {{ (index $labels "service.instance.id") }} is inactive or far behind and retains WAL'
          description: "A logical slot on the publisher has been inactive for over 180 seconds, or has more than 128 MiB of WAL unconfirmed, for a minute. Check pg_replication_slots and the state of the subscriber that reads it."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/postgresql/#postgreslogicalslotstalled
