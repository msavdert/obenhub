# One test group per etcd rule: EtcdMemberAbsent, EtcdInsufficientMembers,
# EtcdNoLeader, EtcdHighLeaderChanges. The disk latency rules are tested in
# etcd-defaults.yml (pack defaults) and etcd-lab-override.yml (lab thresholds).
# The inventory is per lab; these tests use the stage 3 one (pg-1..3, etcd-1..3).
rule_files:
  - ../rules.yml
  - ../../../lab/stage3/vmalert/inventory.yml
evaluation_interval: 15s

tests:
  - name: one member scraped as up 0 fires EtcdMemberAbsent for it only, quorum holds
    interval: 15s
    input_series:
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-1"}'
        values: '1x60'
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-2"}'
        values: '1x8 0x52'
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-3"}'
        values: '1x60'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-stage3"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 3m
        groupname: etcd
        alertname: EtcdMemberAbsent
        exp_alerts: []
      - eval_time: 6m
        groupname: etcd
        alertname: EtcdMemberAbsent
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: stage3-etcd
              severity: warning
              service.instance.id: etcd-2
              service.namespace: obenhub-lab
              service.name: etcd
              obenhub.collector: otelcol-stage3
            exp_annotations:
              summary: etcd member etcd-2 is not scraped
              description: "An expected etcd member has had no successful scrape for 2 minutes while the Collector that scrapes it is alive. Check whether the etcd process or its metrics endpoint is up on that member."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/etcd/#etcdmemberabsent
      - eval_time: 6m
        groupname: etcd
        alertname: EtcdInsufficientMembers
        exp_alerts: []

  - name: a member whose series vanish fires the same way
    interval: 15s
    input_series:
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-1"}'
        values: '1x60'
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-2"}'
        values: '1x60'
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-3"}'
        values: '1x8 _x52'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-stage3"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 6m
        groupname: etcd
        alertname: EtcdMemberAbsent
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: stage3-etcd
              severity: warning
              service.instance.id: etcd-3
              service.namespace: obenhub-lab
              service.name: etcd
              obenhub.collector: otelcol-stage3
            exp_annotations:
              summary: etcd member etcd-3 is not scraped
              description: "An expected etcd member has had no successful scrape for 2 minutes while the Collector that scrapes it is alive. Check whether the etcd process or its metrics endpoint is up on that member."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/etcd/#etcdmemberabsent

  - name: two members down names both and fires EtcdInsufficientMembers
    interval: 15s
    input_series:
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-1"}'
        values: '1x60'
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-2"}'
        values: '1x8 0x52'
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-3"}'
        values: '1x8 0x52'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-stage3"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 3m
        groupname: etcd
        alertname: EtcdInsufficientMembers
        exp_alerts: []
      - eval_time: 6m
        groupname: etcd
        alertname: EtcdInsufficientMembers
        exp_alerts:
          - exp_labels: {severity: critical, obenhub.cluster.name: stage3-etcd}
            exp_annotations:
              summary: "Only 1 members of etcd cluster stage3-etcd report: quorum is lost"
              description: "Fewer etcd members report than a majority of the cluster's inventory (2 of 3), so the cluster has lost quorum or cannot be seen. Check which members are absent (EtcdMemberAbsent) and bring them back."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/etcd/#etcdinsufficientmembers
      - eval_time: 6m
        groupname: etcd
        alertname: EtcdMemberAbsent
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: stage3-etcd
              severity: warning
              service.instance.id: etcd-2
              service.namespace: obenhub-lab
              service.name: etcd
              obenhub.collector: otelcol-stage3
            exp_annotations:
              summary: etcd member etcd-2 is not scraped
              description: "An expected etcd member has had no successful scrape for 2 minutes while the Collector that scrapes it is alive. Check whether the etcd process or its metrics endpoint is up on that member."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/etcd/#etcdmemberabsent
          - exp_labels:
              obenhub.cluster.name: stage3-etcd
              severity: warning
              service.instance.id: etcd-3
              service.namespace: obenhub-lab
              service.name: etcd
              obenhub.collector: otelcol-stage3
            exp_annotations:
              summary: etcd member etcd-3 is not scraped
              description: "An expected etcd member has had no successful scrape for 2 minutes while the Collector that scrapes it is alive. Check whether the etcd process or its metrics endpoint is up on that member."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/etcd/#etcdmemberabsent

  - name: all members gone with the Collector raises neither member nor quorum alerts
    interval: 15s
    input_series:
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-1"}'
        values: '1x8 _x52'
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-2"}'
        values: '1x8 _x52'
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-3"}'
        values: '1x8 _x52'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-stage3"}'
        values: '1x8 _x52'
    alert_rule_test:
      - eval_time: 6m
        groupname: etcd
        alertname: EtcdMemberAbsent
        exp_alerts: []
      - eval_time: 6m
        groupname: etcd
        alertname: EtcdInsufficientMembers
        exp_alerts: []

  - name: a member without a leader fires after 1 m; a healthy one does not
    interval: 15s
    input_series:
      - series: 'etcd_server_has_leader{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-1"}'
        values: '1x4 0x56'
      - series: 'etcd_server_has_leader{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-2"}'
        values: '1x60'
      - series: 'etcd_server_has_leader{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-3"}'
        values: '1x4 0x2 1x54'
    alert_rule_test:
      - eval_time: 90s
        groupname: etcd
        alertname: EtcdNoLeader
        exp_alerts: []
      - eval_time: 3m
        groupname: etcd
        alertname: EtcdNoLeader
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: stage3-etcd
              severity: critical
              service.instance.id: etcd-1
              service.name: etcd
            exp_annotations:
              summary: etcd member etcd-1 has no leader
              description: "A reporting etcd member has had no leader (etcd_server_has_leader 0) for a minute; a normal election takes about a second. Check the other members and the network between them."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/etcd/#etcdnoleader

  - name: three leader changes in 5 m fire, two do not
    interval: 15s
    input_series:
      # three members with different counter values; the largest per-member increase counts
      - series: 'etcd_server_leader_changes_seen_total{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-1"}'
        values: '2x24 3 4 5 6x74'
      - series: 'etcd_server_leader_changes_seen_total{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-2"}'
        values: '1x24 2 3 4 5x74'
      - series: 'etcd_server_leader_changes_seen_total{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-3"}'
        values: '1x24 2 3 4 5x74'
    alert_rule_test:
      # MetricsQL counts the first sample of a series that starts inside the
      # window as an increase from 0, so the series run flat for 6 m first.
      - eval_time: 5m
        groupname: etcd
        alertname: EtcdHighLeaderChanges
        exp_alerts: []
      - eval_time: 8m
        groupname: etcd
        alertname: EtcdHighLeaderChanges
        exp_alerts:
          - exp_labels: {severity: warning, obenhub.cluster.name: stage3-etcd}
            exp_annotations:
              summary: 4 leader changes of etcd cluster stage3-etcd within 5 minutes
              description: "Three or more leader changes of one etcd cluster within 5 minutes (increase of etcd_server_leader_changes_seen_total). Look at the members for restarts, slow disks (EtcdHighFsyncDurations) or network trouble between them."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/etcd/#etcdhighleaderchanges
      - eval_time: 14m   # the window has moved past the changes
        groupname: etcd
        alertname: EtcdHighLeaderChanges
        exp_alerts: []

  - name: two leader changes in 5 m do not fire
    interval: 15s
    input_series:
      - series: 'etcd_server_leader_changes_seen_total{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-1"}'
        values: '2x24 3 4 4x74'
    alert_rule_test:
      - eval_time: 8m
        groupname: etcd
        alertname: EtcdHighLeaderChanges
        exp_alerts: []

  # The max holder drops out. The old expression, increase(max(...)[5m:1m]),
  # would have read the fall of the max (etcd-1 at 100 gone, etcd-2 at 5) as a
  # counter reset and fired; the per-member increase sees one change only.
  - name: the member with the highest counter disappearing does not fire
    interval: 15s
    input_series:
      - series: 'etcd_server_leader_changes_seen_total{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-1"}'
        values: '100x24 _x76'
      - series: 'etcd_server_leader_changes_seen_total{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-2"}'
        values: '4x24 5x76'
    alert_rule_test:
      - eval_time: 8m
        groupname: etcd
        alertname: EtcdHighLeaderChanges
        exp_alerts: []

  - name: exactly three changes fire
    interval: 15s
    input_series:
      - series: 'etcd_server_leader_changes_seen_total{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-1"}'
        values: '2x24 3 4 5x74'
    alert_rule_test:
      - eval_time: 8m
        groupname: etcd
        alertname: EtcdHighLeaderChanges
        exp_alerts:
          - exp_labels: {severity: warning, obenhub.cluster.name: stage3-etcd}
            exp_annotations:
              summary: 3 leader changes of etcd cluster stage3-etcd within 5 minutes
              description: "Three or more leader changes of one etcd cluster within 5 minutes (increase of etcd_server_leader_changes_seen_total). Look at the members for restarts, slow disks (EtcdHighFsyncDurations) or network trouble between them."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/etcd/#etcdhighleaderchanges

  # No etcd `up` series at all while the Collector lives: count() is empty and
  # `or on() vector(0)` supplies the 0.
  - name: zero members reporting with a live Collector fires EtcdInsufficientMembers
    interval: 15s
    input_series:
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-1"}'
        values: '1x8 _x52'
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-2"}'
        values: '1x8 _x52'
      - series: 'up{obenhub.cluster.name="stage3-etcd",service.name="etcd",service.instance.id="etcd-3"}'
        values: '1x8 _x52'
      - series: 'otelcol_process_uptime{service.name="otelcol",service.instance.id="otelcol-stage3"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 6m
        groupname: etcd
        alertname: EtcdInsufficientMembers
        exp_alerts:
          - exp_labels: {severity: critical, obenhub.cluster.name: stage3-etcd}
            exp_annotations:
              summary: "Only 0 members of etcd cluster stage3-etcd report: quorum is lost"
              description: "Fewer etcd members report than a majority of the cluster's inventory (2 of 3), so the cluster has lost quorum or cannot be seen. Check which members are absent (EtcdMemberAbsent) and bring them back."
              runbook_url: https://msavdert.github.io/obenhub/runbooks/etcd/#etcdinsufficientmembers
