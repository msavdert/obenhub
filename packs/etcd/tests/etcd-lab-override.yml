# EtcdHighFsyncDurations and EtcdHighCommitDurations with the stage3 lab
# override (obenhub.etcd.*.limit = 1.0 s, lab/stage3/vmalert/inventory.yml): a
# p99 of 0.75 s or 0.583 s, above the pack defaults, does not fire; 1.5 s does.
# The pack-default behaviour is in etcd-defaults.yml.
rule_files:
  - ../rules.yml
  - ../../../lab/stage3/vmalert/inventory.yml
evaluation_interval: 15s

tests:
  - name: EtcdHighFsyncDurations with the lab override 1.0 s does not fire at p99 0.75 s and 0.583 s
    interval: 15s
    input_series:
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="0.5",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+98x100'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="1",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+100x100'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="+Inf",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+100x100'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="0.5",service.name="etcd",service.instance.id="etcd-2"}'
        values: '0+988x100'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="1",service.name="etcd",service.instance.id="etcd-2"}'
        values: '0+1000x100'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="+Inf",service.name="etcd",service.instance.id="etcd-2"}'
        values: '0+1000x100'
    alert_rule_test:
      - eval_time: 16m
        groupname: etcd
        alertname: EtcdHighFsyncDurations
        exp_alerts: []

  - name: EtcdHighFsyncDurations with the lab override 1.0 s fires at p99 1.5 s
    interval: 15s
    input_series:
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="1",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+98x100'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="2",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+100x100'
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="+Inf",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+100x100'
    alert_rule_test:
      - eval_time: 16m
        groupname: etcd
        alertname: EtcdHighFsyncDurations
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: stage3-etcd
              severity: warning
              service.instance.id: etcd-1
              service.name: etcd
            exp_annotations:
              summary: etcd member etcd-1 WAL fsync p99 is 1.5s
              description: "The 99th percentile of the WAL fsync duration of a member is over the limit (0.5 s unless the lab inventory sets obenhub.etcd.fsync_duration.limit) for 10 minutes. Check the disk under the etcd data directory for contention."
              runbook_url: https://msavdert.github.io/obenhub/reference/etcd-pack-alerts/#etcdhighfsyncdurations

  - name: EtcdHighCommitDurations with the lab override 1.0 s does not fire at p99 0.75 s and 0.583 s
    interval: 15s
    input_series:
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="0.5",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+98x100'
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="1",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+100x100'
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="+Inf",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+100x100'
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="0.5",service.name="etcd",service.instance.id="etcd-2"}'
        values: '0+988x100'
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="1",service.name="etcd",service.instance.id="etcd-2"}'
        values: '0+1000x100'
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="+Inf",service.name="etcd",service.instance.id="etcd-2"}'
        values: '0+1000x100'
    alert_rule_test:
      - eval_time: 16m
        groupname: etcd
        alertname: EtcdHighCommitDurations
        exp_alerts: []

  - name: EtcdHighCommitDurations with the lab override 1.0 s fires at p99 1.5 s
    interval: 15s
    input_series:
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="1",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+98x100'
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="2",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+100x100'
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{obenhub.cluster.name="stage3-etcd",le="+Inf",service.name="etcd",service.instance.id="etcd-1"}'
        values: '0+100x100'
    alert_rule_test:
      - eval_time: 16m
        groupname: etcd
        alertname: EtcdHighCommitDurations
        exp_alerts:
          - exp_labels:
              obenhub.cluster.name: stage3-etcd
              severity: warning
              service.instance.id: etcd-1
              service.name: etcd
            exp_annotations:
              summary: etcd member etcd-1 backend commit p99 is 1.5s
              description: "The 99th percentile of the backend commit duration of a member is over the limit (0.25 s unless the lab inventory sets obenhub.etcd.commit_duration.limit) for 10 minutes. Check the disk under the etcd data directory for contention."
              runbook_url: https://msavdert.github.io/obenhub/reference/etcd-pack-alerts/#etcdhighcommitdurations
