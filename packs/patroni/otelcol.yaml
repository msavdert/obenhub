# Collector fragment of the Patroni pack: the generic prometheus receiver
# scraping the Patroni REST API /metrics (contrib has no Patroni receiver) and
# the identity of one member. Variables: README.md, "Collector fragment".
# Base: ../otelcol-base.yaml. OBENHUB_PATRONI_SCHEME is http or https; with
# https the CA file verifies the REST API certificate.
receivers:
  prometheus/obenhub-patroni:
    config:
      scrape_configs:
        - job_name: patroni
          scheme: ${env:OBENHUB_PATRONI_SCHEME}
          tls_config:
            ca_file: ${env:OBENHUB_PATRONI_CA_FILE}
          scrape_interval: 15s
          scrape_timeout: 10s
          static_configs:
            - targets: ['${env:OBENHUB_PATRONI_HOST}:${env:OBENHUB_PATRONI_PORT}']

processors:
  memory_limiter/obenhub:
    check_interval: 1s
    limit_mib: 256
  batch/obenhub: {}
  # No role attribute on purpose: the leader moves. The cluster name is the
  # PostgreSQL cluster's, not Patroni's scope.
  resource/obenhub-patroni:
    attributes:
      - {key: service.namespace, value: "${env:OBENHUB_SERVICE_NAMESPACE}", action: upsert}
      - {key: service.name, value: patroni, action: upsert}
      - {key: service.instance.id, value: "${env:OBENHUB_PATRONI_INSTANCE_ID}", action: upsert}
      - {key: server.address, value: "${env:OBENHUB_PATRONI_HOST}", action: upsert}
      - {key: server.port, value: "${env:OBENHUB_PATRONI_PORT}", action: upsert}
      - {key: db.system.name, value: postgresql, action: upsert}
      - {key: obenhub.cluster.name, value: "${env:OBENHUB_CLUSTER_NAME}", action: upsert}

service:
  pipelines:
    metrics/obenhub-patroni:
      receivers: [prometheus/obenhub-patroni]
      processors: [memory_limiter/obenhub, resource/obenhub-patroni, batch/obenhub]
      exporters: [otlp/obenhub]
