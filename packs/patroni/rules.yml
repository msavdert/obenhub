# Patroni alert rules (Patroni 4.1.5 REST /metrics), shared by the labs. The
# inventory these rules read (obenhub.expected_scrape with service.name
# "patroni", each with an obenhub.collector label naming the Collector that
# scrapes it, next to obenhub.expected_collector) is per lab, for example
# lab/stage3/vmalert/inventory.yml.
# Three Patroni nodes. Every rule is role-agnostic: the leader moves,
# so nothing here names a node as primary or standby. Patroni reports 0 for
# metrics that do not apply to a node's role (timeline and xlog_location are 0
# on a replica, received and replayed location are 0 on the leader; observed
# 2026-11-07 on Patroni 4.1.5), so cluster-wide values are max by (obenhub.cluster.name).
# Suppression is written into the expressions, not into Alertmanager inhibits
# (lab/slice1 lesson: vmalert's startsAt predates group_wait, so inhibits race).
# Names follow the naming contract (ADR 0006). Identity (ADR 0006, decision 7):
# rules group and join on obenhub.cluster.name, with service.instance.id for a
# member; Patroni's own `scope` label stays as it arrives but no rule reads it.
groups:
  - name: patroni
    interval: 15s
    rules:
      # No node reports itself as the primary. "for" is longer than a normal
      # failover: the leader key expires after ttl (30 s), then the election
      # and the promotion follow (measured in the leader-killed scenario).
      # Silent while there is no Patroni data at all (the target alerts own
      # that case). Also silent while the most recent known primary is a member
      # whose Collector is dead: its patroni_primary goes stale, so the live
      # replicas alone sum to 0 although nothing is known about the leader
      # (that is its CollectorAbsent's). "Most recent": its last sample with
      # value 1 is not older than any other member's, so a replica promoted
      # since, or the leader's Patroni dying with a live Collector, ends the
      # suppression. Accepted loss: if the leader's whole VM dies and no
      # replica is promoted, this rule stays quiet while that node's
      # CollectorAbsent fires. patroni_cluster_unlocked is no alternative: in
      # the stage 3 data it reached 1 in only 4 samples in 3 days, never during
      # the leader-killed or quorum-lost runs.
      - alert: PatroniNoWritablePrimary
        expr: |
          WITH (
            last_primary = tlast_over_time((patroni_primary == 1)[1d:15s])
          )
          sum by (obenhub.cluster.name) (patroni_primary) == 0
            unless on(obenhub.cluster.name)
          (
            (
              last_primary
                and on(obenhub.cluster.name, service.instance.id)
              (last_over_time(patroni_primary[1d]) == 1)
                and on(obenhub.cluster.name, service.instance.id)
              (
                obenhub.expected_scrape{service.name="patroni"}
                  unless on(obenhub.collector)
                label_replace(present_over_time(otelcol_process_uptime[1m]), "obenhub.collector", "$1", "service.instance.id", "(.+)")
              )
            )
              >= on(obenhub.cluster.name) group_left
            max by (obenhub.cluster.name) (last_primary)
          )
        for: 90s
        labels:
          severity: critical
        annotations:
          summary: 'Cluster {{ (index $labels "obenhub.cluster.name") }} has no writable primary'
          description: "No member of the cluster reports patroni_primary 1, so the cluster cannot take writes. Check patronictl list and the DCS."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/patroni/#patroninowritableprimary

      # Two or more members of one cluster report patroni_primary == 1 at the
      # same time: two writable primaries, split brain. Only fresh samples
      # count: last_over_time over 30 s (two 15 s scrapes, so one missed scrape
      # is tolerated) returns each member's latest value and drops a member
      # that has not reported for 30 s. Without it a member whose Collector
      # died keeps its last 1 for the backend's implicit staleness lookback
      # (minutes), and after a failover that stale 1 plus the new leader's 1
      # would fire. A live member that is demoted reports 0 at its next
      # scrape, so its old 1 does not count either. The inner min by
      # service.instance.id makes it count members, not series: one member
      # with two series (a changed label set) is one member, and it is a
      # primary only if all its fresh series say 1, so this can only hide an
      # alert, never invent one.
      # "for" is 60 s (four evaluations), derived as follows. A dead leader's
      # last 1 stays in the window for 30 s after its last sample (the window;
      # two 15 s scrapes). A replica is promoted only after the leader key
      # expires, which is 20 to 30 s after the leader's last refresh (ttl 30 s,
      # stage3/postgres/patroni.yml, pgha/files/patroni.yml.tmpl; the last
      # refresh is up to loop_wait, 10 s, before the last sample; assumption:
      # ttl and loop_wait are not changed), and then reports 1 at its next
      # scrape, so the real overlap of the stale 1 with the new 1 is well
      # under 30 s. The unit test (failover) assumes a pessimistic 45 s overlap
      # (the new 1 two scrapes before the stale one's last sample), a derived
      # bound (30 s window plus one 15 s scrape), not a measurement; the
      # recorded suites of 2026-11-12 show single-sample (15 s) overlaps at
      # most (pgha network-partition, 11:47:45 UTC). It is more than the
      # derivation allows; "for" adds one scrape interval (15 s)
      # to that, so a normal failover cannot fire even with that overlap, and
      # the stale 1 is gone before the hold can complete. A planned switchover
      # demotes the old leader first; the overlap there is at most one scrape,
      # 15 s.
      # Trade-off, accepted: a real split brain shorter than about 75 s (the
      # hold plus one 15 s sample) is not alerted, and a primary
      # whose Patroni is unreachable (no fresh sample) is not counted;
      # PatroniTargetAbsent and PostgresMultiplePrimaries (which reads
      # PostgreSQL itself) cover that.
      - alert: PatroniMultiplePrimaries
        expr: |
          count by (obenhub.cluster.name) (
            min by (obenhub.cluster.name, service.instance.id) (
              last_over_time(patroni_primary[30s])
            ) == 1
          ) > 1
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: 'Cluster {{ (index $labels "obenhub.cluster.name") }} has {{ $value }} members reporting primary (split brain)'
          description: "Two or more members of one cluster report patroni_primary 1 within the last 30 seconds, for a minute: split brain. Check patronictl list and the DCS to see which member holds the leader key, then stop the other."
          runbook_url: https://msavdert.github.io/obenhub/reference/patroni-pack-alerts/#patronimultipleprimaries

      # The highest timeline any node reports rose compared with the highest
      # one seen in the hour before the last 3 m (a rolling maximum, so the
      # zeros of a gap do not count as a lower baseline). It holds for 3 m,
      # then the baseline catches up and the alert resolves: one firing per
      # change. It cannot fire during the first ~3 minutes after Patroni
      # metrics first appear: there is no baseline yet.
      # A planned switchover and an unplanned failover both raise the
      # timeline by one; these signals do not tell them apart (see the
      # switchover scenario).
      - alert: PatroniFailoverHappened
        expr: |
          max by (obenhub.cluster.name) (patroni_postgres_timeline)
            > on(obenhub.cluster.name)
          max_over_time(max by (obenhub.cluster.name) (patroni_postgres_timeline)[1h:1m] offset 3m)
        labels:
          severity: warning
        annotations:
          summary: 'Cluster {{ (index $labels "obenhub.cluster.name") }} moved to timeline {{ $value }}'
          description: "The highest PostgreSQL timeline of the cluster rose compared with the last hour: a switchover or a failover (the metrics cannot tell them apart). It resolves after 3 minutes; patronictl history shows the cause."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/patroni/#patronifailoverhappened

      # A replica whose WAL position (max of received and replayed, the value
      # Patroni itself compares) is more than maximum_lag_on_failover behind
      # the leader's. 16777216 must equal maximum_lag_on_failover in
      # postgres/patroni.yml. The two positions come from two scrapes up to
      # 15 s apart; at the lab's load that skew stays well below the threshold
      # (assumption, checked by the control). A paused replay does not move
      # this value while the WAL receiver keeps receiving.
      - alert: PatroniReplicaNotEligible
        expr: |
          (
            max by (obenhub.cluster.name) (patroni_xlog_location)
              - on(obenhub.cluster.name) group_right()
            (
              (
                clamp_min(patroni_xlog_received_location - patroni_xlog_replayed_location, 0)
                  + patroni_xlog_replayed_location
              )
                and on(obenhub.cluster.name, service.instance.id)
              patroni_replica == 1
            )
          ) > 16777216
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} is {{ $value | humanize1024 }}B behind the leader, beyond maximum_lag_on_failover'
          description: "A replica's WAL position is more than 16 MiB (maximum_lag_on_failover) behind the leader's for a minute, so Patroni will not promote it. Check that the replica receives and replays WAL."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/patroni/#patronireplicanoteligible

      # Maintenance mode disables automatic failover. 3 m is a lab value.
      - alert: PatroniClusterPaused
        expr: max by (obenhub.cluster.name) (patroni_is_paused) == 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: 'Cluster {{ (index $labels "obenhub.cluster.name") }} is paused: no automatic failover'
          description: "The cluster has been in maintenance mode (patroni_is_paused 1) for 3 minutes, which disables automatic failover. End it with patronictl resume when the maintenance is done."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/patroni/#patroniclusterpaused

      # A parameter changed that needs a restart. 2 m is a lab value.
      - alert: PatroniPendingRestart
        expr: patroni_pending_restart == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} has a pending restart'
          description: "A PostgreSQL parameter changed on the member that needs a restart to take effect, for 2 minutes. patronictl list shows the member flagged; restart it in a maintenance window."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/patroni/#patronipendingrestart

      # Provenance (ADR 0004 decision 4): the two alert kinds are PatroniDown
      # (patroni_up < 1, for 1m) and PatroniFailSafeActive
      # (sum(patroni_failsafe_mode_is_active) > 0) of pgsty/pigsty
      # files/victoria/rules/pgsql.yml at tag v4.5.0, commit
      # dab5dba333a070d96fde1f9feb41761148f2be8c, Apache-2.0. Read for ideas;
      # the expressions are written for this lab: pigsty's patroni_up comes from
      # its own exporter, here the signal is the Collector's scrape.
      #
      # Patroni's REST scrape has not succeeded for 2 m while the node's
      # PostgreSQL heartbeat is still present: Patroni down, PostgreSQL up (no
      # failover logic is running on that node). A node that is gone entirely
      # loses its heartbeat first (1 m window) and is PostgresTargetAbsent's
      # case, so the two never fire together. A stopped Collector raises only
      # its own CollectorAbsent: the gate is that the Collector that scrapes
      # this node (obenhub.collector) lived in the last 1 m.
      - alert: PatroniTargetAbsent
        expr: |
          obenhub.expected_scrape{service.name="patroni"}
            unless on(obenhub.cluster.name, service.instance.id)
          (max_over_time(up{service.name="patroni"}[2m]) == 1)
            and on(obenhub.cluster.name, service.instance.id)
          present_over_time(postgresql.collection.heartbeat[1m])
            and on(obenhub.collector)
          label_replace(present_over_time(otelcol_process_uptime[1m]), "obenhub.collector", "$1", "service.instance.id", "(.+)")
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Patroni on {{ (index $labels "service.instance.id") }} is not scraped while PostgreSQL still reports'
          description: "Patroni's REST scrape of a member has not succeeded for 2 minutes while that node's PostgreSQL heartbeat is present: Patroni is down on a node whose PostgreSQL still runs, so no failover logic runs there. Check the Patroni service on the node."
          runbook_url: https://msavdert.github.io/obenhub/runbooks/patroni/#patronitargetabsent

      # A Patroni target without obenhub.cluster.name (ADR 0006, decision 7).
      # Every rule of this pack groups on it, so such a member belongs to no
      # cluster: PatroniNoWritablePrimary and PatroniMultiplePrimaries count
      # it nowhere. up is the series PatroniTargetAbsent reads.
      - alert: PatroniClusterNameMissing
        expr: up{service.name="patroni", obenhub.cluster.name=""}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Patroni on {{ (index $labels "service.instance.id") }} reports no obenhub.cluster.name'
          description: "A Patroni scrape carries no obenhub.cluster.name, so the cluster rules count the member nowhere. Fix the resource attribute of the Collector scrape."
          runbook_url: https://msavdert.github.io/obenhub/reference/patroni-pack-alerts/#patroniclusternamemissing

      # The rules of this pack size their windows for a collection every 15 s
      # (README, "Collection interval"): the [30s] window of
      # PatroniMultiplePrimaries holds two scrapes. Collected only every 60 s, a 30 s window
      # holds one sample or none, so the rules go quiet or flap without any
      # error. This says it: the average distance between the samples of
      # `up` of the Patroni scrape (the series PatroniTargetAbsent reads) over 5 m is above 20 s.
      # scrape_interval() is MetricsQL (VictoriaMetrics): the average interval
      # in seconds between the raw samples in the window. One missed sample at
      # 15 s gives about 16 s and stays quiet; a series at 30 s, where a 30 s
      # window holds one sample, fires: the threshold of 20 s leaves room for
      # jitter at 15 s.
      # max by (...): one value per target.
      - alert: PatroniCollectionIntervalTooLong
        expr: max by (obenhub.cluster.name, service.instance.id) (scrape_interval(up{service.name="patroni"}[5m])) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Patroni {{ (index $labels "service.instance.id") }} is collected every {{ $value | printf "%.0f" }} s, the rules assume 15 s'
          description: "Patroni is scraped less often than every 15 s (average spacing above 20 s over 5 minutes), while the rules size their windows for 15 s, so they go quiet or flap. Set the scrape interval back to 15 s."
          runbook_url: https://msavdert.github.io/obenhub/reference/patroni-pack-alerts/#patronicollectionintervaltoolong

      # Failsafe mode: the DCS is unreachable and the leader keeps running on
      # the failsafe topology. UNIT TESTS ONLY: the lab runs with failsafe_mode
      # off (postgres/patroni.yml), so quorum-lost demotes the leader instead.
      # pigsty has no "for"; 30 s (two evaluations) is a lab value.
      - alert: PatroniFailsafeActive
        expr: patroni_failsafe_mode_is_active == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: '{{ (index $labels "service.instance.id") }} runs in failsafe mode, the DCS is unreachable'
          description: "Patroni reports failsafe mode (patroni_failsafe_mode_is_active 1): the DCS is unreachable and the leader keeps running on the failsafe topology. Check the DCS (etcd) and the network to it."
          runbook_url: https://msavdert.github.io/obenhub/reference/patroni-pack-alerts/#patronifailsafeactive
