# Test fixture: the lab values of the Oracle Data Guard pack thresholds, as the labs record them
# (lab/oracle/mon/vmalert/inventory.yml, group oracledb-dg-parameters). The older tests of this pack encode lab values; they load this file
# so they keep testing the rules at the values their scenarios use. The defaults
# are tested without it in thresholds.yml. Not read by anything else; a lab test
# (lab/*/tests) checks the real inventory.

groups:
  - name: oracledb-dg-lab-values
    interval: 15s
    rules:
      - record: obenhub.oracledb.standby_lag.limit
        expr: vector(60)
      - record: obenhub.oracledb.standby_data_age.limit
        expr: vector(60)
      - record: obenhub.oracledb.lock_wait_age.limit
        expr: vector(30)
