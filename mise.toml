[tools]
actionlint = "1.7.12"
zizmor = "1.32.0"
shellcheck = "0.11.0"
ruff = "0.17.4"
typos = "1.52.0"
lychee = "0.24.2"
editorconfig-checker = "4.0.2"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.0"
node = "26.13.0"
python = "3.13.18"
"pipx:zensical" = "0.1.0"

[tasks."docs:build"]
description = "build the documentation site into site/ (fails on warnings)"
run = "zensical build --clean --strict"

[tasks."docs:serve"]
description = "preview the documentation site locally"
run = "zensical serve"

[tasks."lint:actions"]
description = "actionlint on workflows"
run = "actionlint"

[tasks."lint:zizmor"]
description = "zizmor static analysis of workflows (offline)"
run = "zizmor --offline .github/workflows"

[tasks."lint:yaml"]
description = "yamllint"
run = "yamllint ."

[tasks."lint:md"]
description = "markdownlint"
run = "markdownlint-cli2"

[tasks."lint:spell"]
description = "typos"
run = "typos"

[tasks."lint:links"]
description = "relative links in Markdown (no network)"
run = "lychee --offline --no-progress --exclude-path CLAUDE.local.md '**/*.md'"

[tasks."lint:editorconfig"]
description = "editorconfig-checker"
run = "editorconfig-checker"

[tasks."lint:shell"]
description = "shellcheck on every tracked shell script (*.sh or a bash or sh shebang)"
run = "scripts/lint-shell.sh"

[tasks."lint:python"]
description = "ruff check and ruff format --check on tracked Python (ruff.toml)"
run = [
  "git ls-files -z '*.py' | xargs -0 -r ruff check --force-exclude",
  "git ls-files -z '*.py' | xargs -0 -r ruff format --check --force-exclude",
]

[tasks."lint:compose"]
description = "docker compose config -q on every tracked compose file, with dummy variables; needs docker"
run = "scripts/lint-compose.sh"

[tasks."lint:otelcol"]
description = "otelcol-contrib validate on every tracked Collector config (pgha template rendered); needs docker"
run = "scripts/lint-otelcol.sh"

[tasks."lab:evidence"]
description = "per lab: is the latest complete passing suite newer than the lab's code? warns; pass --strict [LAB...] to fail (before a release)"
run = "scripts/check-evidence.sh"

[tasks."lab:evidence-test"]
description = "test check-evidence.sh on fixture runs.jsonl files in a throwaway git repository; no docker"
run = "scripts/test-check-evidence.sh"

[tasks."lab:guard-test"]
description = "test the scenario run guards (dirty pathspec, suite lock) in a throwaway git repository; no docker"
run = "lab/scenarios/test-guard.sh"

[tasks."lab:k8s:tools-test"]
description = "test lab/k8s/scripts/check-tools.sh and the manifest check of up.sh with fake binaries on a temporary PATH; no docker, no cluster, no network"
run = "scripts/test-k8s-check-tools.sh"

[tasks."lab:rules-test"]
description = "unit-test the lab alert rules (vmalert-tool) and Alertmanager routing (throwaway container); needs docker"
run = [
  "scripts/vmalert-unittest.sh lab/slice1/vmalert/tests",
  "lab/slice1/alertmanager/test.sh",
]

[tasks."lab:stage3:rules-test"]
description = "unit-test the stage 3 inventory and the shared Patroni and etcd pack rules (vmalert-tool); needs docker"
run = "scripts/vmalert-unittest.sh lab/stage3/vmalert/tests lab/packs/patroni/tests lab/packs/etcd/tests"

[tasks."lab:pgha:rules-test"]
description = "unit-test Collector liveness in the pgha inventory with the shared pack rules (vmalert-tool); needs docker"
run = "scripts/vmalert-unittest.sh lab/pgha/mon/vmalert/tests"

[tasks."lab:k8s:rules-test"]
description = "unit-test Collector liveness in the k8s inventory with the shared Collector pack rules (vmalert-tool); needs docker"
run = "scripts/vmalert-unittest.sh lab/k8s/mon/vmalert/tests"

[tasks."lab:cnpg:rules-test"]
description = "unit-test the CloudNativePG pack rules (lab/packs/cnpg, vmalert-tool); needs docker"
run = "scripts/vmalert-unittest.sh lab/packs/cnpg/tests"

[tasks."lab:k8s-pack:rules-test"]
description = "unit-test the Kubernetes pack rules (lab/packs/k8s, vmalert-tool); needs docker"
run = "scripts/vmalert-unittest.sh lab/packs/k8s/tests"

[tasks."lab:pgbackrest:rules-test"]
description = "unit-test the pgBackRest pack rules (lab/packs/pgbackrest, vmalert-tool); needs docker"
run = "scripts/vmalert-unittest.sh lab/packs/pgbackrest/tests"

[tasks."lab:collector:rules-test"]
description = "unit-test the shared Collector pack rules (lab/packs/collector, vmalert-tool); needs docker"
run = "scripts/vmalert-unittest.sh lab/packs/collector/tests"

[tasks."lab:oracle:rules-test"]
description = "unit-test the Oracle Data Guard pack rules and Collector liveness in the Oracle inventory (vmalert-tool); needs docker"
run = "scripts/vmalert-unittest.sh lab/packs/oracledb-dg/tests lab/oracle/mon/vmalert/tests"

[tasks."lab:host:rules-test"]
description = "unit-test the shared host pack rules (lab/packs/host, vmalert-tool); needs docker"
run = "scripts/vmalert-unittest.sh lab/packs/host/tests"

[tasks."lab:stage3:otelcol-check"]
description = "fail when lab/stage3/otelcol/config.yaml differs from what its template renders (lab/stage3/scripts/gen-otelcol.sh)"
run = "lab/stage3/scripts/gen-otelcol.sh --check"

[tasks."lab:pgha:rules-gen-check"]
description = "fail when lab/pgha/mon/vmalert/tests/collectors.yml differs from what gen-collectors.py generates"
run = """
t=$(mktemp)
trap 'rm -f "$t"' EXIT
python3 lab/pgha/mon/vmalert/tests/gen-collectors.py "$t"
diff -u lab/pgha/mon/vmalert/tests/collectors.yml "$t" || { echo "collectors.yml is stale: regenerate it with gen-collectors.py" >&2; exit 1; }
"""

[tasks."lab:pack:rules-test"]
description = "unit-test the shared PostgreSQL pack rules (lab/packs/postgresql, vmalert-tool); needs docker"
# Every rule-test task runs every *.yml of its test directories
# (scripts/vmalert-unittest.sh), so a new test file cannot be left out. The
# image is pinned in lab/packs/versions.sh.
run = "scripts/vmalert-unittest.sh lab/packs/postgresql/tests"

[tasks."lab:slice1:panels"]
description = "run the panel queries of the slice 1 PostgreSQL dashboard against the running slice 1 Grafana (scripts/check-panels.sh); needs the lab, not part of check"
run = "scripts/check-panels.sh --strict-rows lab/slice1/grafana/dashboards/postgresql.json http://127.0.0.1:13000 lab/slice1/.env pg-primary"

[tasks."lab:stage3:panels"]
description = "run the panel queries of the Patroni dashboard against the running stage 3 Grafana (scripts/check-panels.sh); needs the lab, not part of check"
run = "scripts/check-panels.sh lab/stage3/grafana/dashboards/patroni.json http://127.0.0.1:23000 lab/stage3/.env"

[tasks."lab:pgha:panels"]
description = "run the panel queries of the Patroni, host and PostgreSQL dashboards against the running pgha Grafana (scripts/check-panels.sh); needs the lab, not part of check"
run = """
set -e
g=http://127.0.0.1:33000
e=lab/pgha/mon/.env
scripts/check-panels.sh lab/stage3/grafana/dashboards/patroni.json $g $e
scripts/check-panels.sh lab/packs/host/dashboards/host.json $g $e
scripts/check-panels.sh lab/slice1/grafana/dashboards/postgresql.json $g $e pgha-1
"""

[tasks."lab:oracle:panels"]
description = "run the panel queries of the Oracle Data Guard dashboard against the running oracle Grafana (scripts/check-panels.sh); needs the lab, not part of check"
run = "scripts/check-panels.sh lab/packs/oracledb-dg/dashboards/oracle-dg.json http://127.0.0.1:53000 lab/oracle/mon/.env"

[tasks."lab:k8s:panels"]
description = "run the panel queries of the CloudNativePG/Kubernetes and PostgreSQL dashboards against the running k8s Grafana (scripts/check-panels.sh); needs the lab, not part of check"
run = """
set -e
g=http://127.0.0.1:43000
e=lab/k8s/mon/.env
scripts/check-panels.sh lab/k8s/grafana/dashboards/cnpg.json $g $e
scripts/check-panels.sh lab/slice1/grafana/dashboards/postgresql.json $g $e pg-1
"""

[tasks."lint:pack-names"]
description = "pack metric names against ADR 0006: units, unit words, dotted attributes, no clash with postgresqlreceiver or oracledbreceiver (no network)"
run = "python3 scripts/check-pack-names.py"

[tasks."lint:series-vanished"]
description = "PostgresSeriesVanished watches exactly the metrics of the PostgreSQL pack query file (no network)"
run = "python3 scripts/check-series-vanished.py"

[tasks."docs:reference-check"]
description = "fail when a docs/reference/*-pack-metrics.md page differs from what gen-pack-metrics.py generates"
run = "python3 scripts/gen-pack-metrics.py --check"

[tasks.check]
description = "all checks as CI runs them (needs docker for the compose, otelcol and rules tests, which pull images on first use)"
depends = [
  "lint:actions",
  "lint:zizmor",
  "lint:yaml",
  "lint:md",
  "lint:spell",
  "lint:links",
  "lint:editorconfig",
  "lint:shell",
  "lint:python",
  "lint:compose",
  "lint:otelcol",
  "lab:guard-test",
  "lab:k8s:tools-test",
  "lab:evidence-test",
  "lab:evidence",
  "lint:pack-names",
  "lint:series-vanished",
  "docs:reference-check",
  "lab:pack:rules-test",
  "lab:collector:rules-test",
  "lab:host:rules-test",
  "lab:rules-test",
  "lab:stage3:rules-test",
  "lab:pgha:rules-test",
  "lab:pgha:rules-gen-check",
  "lab:stage3:otelcol-check",
  "lab:k8s:rules-test",
  "lab:cnpg:rules-test",
  "lab:k8s-pack:rules-test",
  "lab:pgbackrest:rules-test",
  "lab:oracle:rules-test",
  "docs:build",
]

[tasks.eol]
description = "end-of-life check (needs network)"
run = "python3 scripts/check-eol.py"

[tasks."lab:up"]
description = "start the slice 1 lab (PostgreSQL primary, standby, logical subscriber and PgBouncer, collector, VictoriaMetrics/Logs)"
run = """
lab/scripts/gen-env.sh lab/slice1/.env POSTGRES_PASSWORD REPLICATOR_PASSWORD LOGICAL_PASSWORD OTEL_MONITOR_PASSWORD APP_PASSWORD GRAFANA_ADMIN_PASSWORD
docker compose -p obenhub-slice1 -f lab/slice1/compose.yaml up -d --wait
"""

[tasks."lab:down"]
description = "stop the slice 1 lab and delete its volumes"
run = "docker compose -p obenhub-slice1 -f lab/slice1/compose.yaml down -v"

[tasks."lab:ps"]
description = "show the slice 1 lab containers"
run = "docker compose -p obenhub-slice1 -f lab/slice1/compose.yaml ps"

[tasks."lab:scenario"]
description = "run one slice 1 fault scenario against the running lab (lab/slice1/scenarios/<name>.sh); appends to lab/slice1/results/runs.jsonl"
usage = 'arg "<name>" help "scenario name, e.g. standby-stopped"'
run = '''
f="lab/slice1/scenarios/${usage_name}.sh"
case "$usage_name" in *[!a-z-]*|lib|"") echo "bad scenario name: $usage_name" >&2; exit 2;; esac
[ -x "$f" ] || { echo "no such scenario: $usage_name" >&2; ls lab/slice1/scenarios | sed -n 's/\.sh$//p' | grep -v '^lib$' >&2; exit 2; }
exec "$f"
'''

[tasks."lab:scenarios"]
description = "run all lab fault scenarios, control last, as one suite (lab/scenarios/run-suite.sh: clean tree, host-wide lock, SUITE_ID; the list is lab/<lab>/scenarios/suite.txt); stops at the first failure"
run = '''
exec lab/scenarios/run-suite.sh slice1 $(cat lab/slice1/scenarios/suite.txt)
'''

[tasks."lab:k8s:scenarios"]
description = "run all k8s fault scenarios, control last, as one suite (lab/scenarios/run-suite.sh: clean tree, host-wide lock, SUITE_ID; the list is lab/<lab>/scenarios/suite.txt); stops at the first failure"
run = '''
MISE_ENV=k8s exec mise exec -- lab/scenarios/run-suite.sh k8s $(cat lab/k8s/scenarios/suite.txt)
'''

[tasks."lab:stage3:up"]
description = "start the stage 3 lab (three etcd members, three Patroni nodes, load client, collector, VictoriaMetrics/Logs)"
run = """
lab/scripts/gen-env.sh lab/stage3/.env POSTGRES_PASSWORD REPLICATOR_PASSWORD OTEL_MONITOR_PASSWORD APP_PASSWORD GRAFANA_ADMIN_PASSWORD
docker compose -p obenhub-stage3 -f lab/stage3/compose.yaml up -d --build --wait
"""

[tasks."lab:stage3:down"]
description = "stop the stage 3 lab and delete its volumes"
run = "docker compose -p obenhub-stage3 -f lab/stage3/compose.yaml down -v"

[tasks."lab:stage3:ps"]
description = "show the stage 3 lab containers"
run = "docker compose -p obenhub-stage3 -f lab/stage3/compose.yaml ps"

[tasks."lab:pgha:pki"]
description = "create the pgha lab CA and per-node certificates in lab/pgha/pki (gitignored; existing files are kept)"
run = "lab/pgha/scripts/pki.sh"

[tasks."lab:pgha:mon:up"]
description = "start the pgha backend on this box (gateway Collector on the LAN address, VictoriaMetrics/Logs, vmalert, Alertmanager, Grafana)"
run = """
lab/pgha/scripts/gen-mon-env.sh
[ -s lab/pgha/pki/gateway/gateway.crt ] || lab/pgha/scripts/pki.sh
docker compose -p obenhub-pgha -f lab/pgha/mon/compose.yaml up -d --wait
"""

[tasks."lab:pgha:mon:down"]
description = "stop the pgha backend and delete its volumes"
run = "docker compose -p obenhub-pgha -f lab/pgha/mon/compose.yaml down -v"

[tasks."lab:pgha:mon:ps"]
description = "show the pgha backend containers"
run = "docker compose -p obenhub-pgha -f lab/pgha/mon/compose.yaml ps"

[tasks."lab:oracle:pki"]
description = "create the Oracle lab CA, gateway certificate and the ora-dg-obs client certificate in lab/oracle/pki (gitignored; existing files are kept)"
run = "lab/oracle/scripts/pki.sh"

[tasks."lab:oracle:mon:up"]
description = "start the Oracle backend on this box (gateway Collector on the LAN address, VictoriaMetrics/Logs, vmalert, Alertmanager, Grafana)"
run = """
lab/oracle/scripts/gen-mon-env.sh
lab/oracle/scripts/pki.sh
docker compose -p obenhub-oracle -f lab/oracle/mon/compose.yaml up -d --wait
"""

[tasks."lab:oracle:collector"]
description = "install or converge otelcol-contrib on ora-dg-obs over ssh (rpm pinned by lab/pgha/versions.sh, config, pack, client certificate, environment file); restarts only on change; needs lab/oracle/.env and the PKI of lab:oracle:mon:up"
run = "lab/oracle/scripts/collector.sh"

[tasks."lab:oracle:scenario"]
description = "run one fault scenario against the CDB19 Data Guard pair (lab/oracle/scenarios/<name>.sh); appends to lab/oracle/results/runs.jsonl"
usage = 'arg "<name>" help "scenario name, e.g. apply-stopped"'
run = '''
f="lab/oracle/scenarios/${usage_name}.sh"
case "$usage_name" in *[!a-z-]*|lib|"") echo "bad scenario name: $usage_name" >&2; exit 2;; esac
[ -x "$f" ] || { echo "no such scenario: $usage_name" >&2; ls lab/oracle/scenarios | sed -n 's/\.sh$//p' | grep -v '^lib$' >&2; exit 2; }
exec "$f"
'''

[tasks."lab:oracle:scenarios"]
description = "run all Oracle fault scenarios, control last, as one suite (lab/scenarios/run-suite.sh: clean tree, host-wide lock, SUITE_ID; the list is lab/oracle/scenarios/suite.txt); stops at the first failure"
run = '''
exec lab/scenarios/run-suite.sh oracle $(cat lab/oracle/scenarios/suite.txt)
'''

[tasks."lab:oracle:mon:down"]
description = "stop the Oracle backend and delete its volumes"
run = "docker compose -p obenhub-oracle -f lab/oracle/mon/compose.yaml down -v"

[tasks."lab:oracle:mon:ps"]
description = "show the Oracle backend containers"
run = "docker compose -p obenhub-oracle -f lab/oracle/mon/compose.yaml ps"

[tasks."lab:pgha:provision"]
description = "install or converge etcd, PostgreSQL 18 and Patroni (TLS) on the pgha-1..3 VMs over ssh; idempotent; optional node names as arguments"
usage = 'arg "[node]..." var=#true help "node names, default all three"'
# provision.sh creates .env when it is missing and runs pki.sh, which only adds
# missing files; secrets of a running cluster are never regenerated (a key
# missing from .env fails the run)
run = "lab/pgha/scripts/provision.sh ${usage_node:-}"

[tasks."lab:pgha:scenario"]
description = "run one fault scenario against the pgha VMs (lab/pgha/scenarios/<name>.sh); appends to lab/pgha/results/runs.jsonl"
usage = 'arg "<name>" help "scenario name, e.g. patroni-down"'
run = '''
f="lab/pgha/scenarios/${usage_name}.sh"
case "$usage_name" in *[!a-z-]*|lib|"") echo "bad scenario name: $usage_name" >&2; exit 2;; esac
[ -x "$f" ] || { echo "no such scenario: $usage_name" >&2; ls lab/pgha/scenarios | sed -n 's/\.sh$//p' | grep -v '^lib$' >&2; exit 2; }
exec "$f"
'''

[tasks."lab:pgha:scenarios"]
description = "run all pgha fault scenarios, control last, as one suite (lab/scenarios/run-suite.sh: clean tree, host-wide lock, SUITE_ID; the list is lab/<lab>/scenarios/suite.txt); stops at the first failure"
run = '''
exec lab/scenarios/run-suite.sh pgha $(cat lab/pgha/scenarios/suite.txt)
'''

[tasks."lab:stage3:scenario"]
description = "run one stage 3 fault scenario against the running lab (lab/stage3/scenarios/<name>.sh); appends to lab/stage3/results/runs.jsonl"
usage = 'arg "<name>" help "scenario name, e.g. leader-killed"'
run = '''
f="lab/stage3/scenarios/${usage_name}.sh"
case "$usage_name" in *[!a-z-]*|lib|"") echo "bad scenario name: $usage_name" >&2; exit 2;; esac
[ -x "$f" ] || { echo "no such scenario: $usage_name" >&2; ls lab/stage3/scenarios | sed -n 's/\.sh$//p' | grep -v '^lib$' >&2; exit 2; }
exec "$f"
'''

[tasks."lab:stage3:scenarios"]
description = "run all stage 3 fault scenarios, control last, as one suite (lab/scenarios/run-suite.sh: clean tree, host-wide lock, SUITE_ID; the list is lab/<lab>/scenarios/suite.txt); stops at the first failure"
run = '''
exec lab/scenarios/run-suite.sh stage3 $(cat lab/stage3/scenarios/suite.txt)
'''
